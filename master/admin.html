<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1C2D">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<title>🔧 관리자 · 메인</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://rent-4d521-default-rtdb.firebaseio.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../shared.js?v=2"></script>
<script src="../db-paths.js"></script>
<style>
:root{
  --bg:#0F1C2D;--card:#1A2B3C;--border:rgba(255,255,255,.08);
  --text:#F0F6FF;--sub:#94A3B8;--hint:#64748B;
  --sky:#0EA5E9;--gold:#F59E0B;--green:#10B981;--red:#EF4444;
  --radius:14px;--shadow:0 4px 20px rgba(0,0,0,.4)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
/* HDR */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,#0A1628,#1A2B3C);border-bottom:1px solid rgba(245,158,11,.2);box-shadow:0 3px 20px rgba(0,0,0,.5)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px}
.hdr-left{display:flex;align-items:center;gap:8px}
.admin-badge{font-size:10px;font-weight:800;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--gold);padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.hdr-right{display:flex;align-items:center;gap:8px}
.ctx-btn{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 10px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.25);color:var(--sky);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.av-img{width:32px;height:32px;border-radius:50%;border:2px solid rgba(245,158,11,.4);object-fit:cover;cursor:pointer}
.av-txt{width:32px;height:32px;border-radius:50%;background:var(--sky);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid rgba(245,158,11,.4);cursor:pointer}
.nav{display:flex;border-top:1px solid rgba(255,255,255,.08);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-tab{flex:1;text-align:center;padding:10px 4px;font-size:12px;font-weight:700;color:var(--sub);text-decoration:none;white-space:nowrap;min-width:60px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.nav-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.content{margin-top:96px;padding:16px;min-height:calc(100vh - 96px);padding-bottom:40px}
/* CARDS */
.sec-title{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.add-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--border);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.5px}
.field input{border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none;color:var(--text);background:rgba(255,255,255,.04);width:100%;transition:border-color .2s}
.field input:focus{border-color:var(--sky)}
.field input::placeholder{color:var(--hint)}
.btn-add-u{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#D97706);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
/* USER CARDS */
.users-list{display:flex;flex-direction:column;gap:10px}
.user-card{background:var(--card);border-radius:var(--radius);padding:14px;border:1.5px solid var(--border);box-shadow:var(--shadow)}
.user-card.active{border-color:var(--sky);background:rgba(14,165,233,.05)}
.uc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.uc-name{font-size:15px;font-weight:700;color:var(--text);min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.uc-type-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;cursor:pointer;letter-spacing:.5px;user-select:none;transition:filter .15s;flex-shrink:0}
.uc-type-badge.self{background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.35);color:var(--sky)}
.uc-type-badge.proxy{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.35);color:var(--gold)}
.uc-type-badge:hover{filter:brightness(1.25)}
.users-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.users-hdr .sec-title{margin-bottom:0;flex-shrink:0}
.uc-search{flex:1;min-width:120px;padding:7px 12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text);font-family:inherit;outline:none;transition:border-color .15s}
.uc-search:focus{border-color:var(--sky)}
.uc-search::placeholder{color:var(--hint)}
.uc-sync-btn{flex-shrink:0;padding:6px 12px;background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:filter .15s}
.uc-sync-btn:hover{filter:brightness(1.2)}
.uc-sync-btn:disabled{opacity:.5;cursor:not-allowed}
.uc-num{font-size:11px;font-weight:700;background:rgba(255,255,255,.07);color:var(--sub);padding:2px 8px;border-radius:5px}
.uc-desc{font-size:12px;color:var(--sub);margin-bottom:6px}
.uc-uid{font-size:10px;color:var(--hint);word-break:break-all;background:rgba(0,0,0,.25);border-radius:6px;padding:5px 8px;font-family:monospace;margin-bottom:10px}
.uc-actions{display:flex;gap:6px;flex-wrap:wrap}
.uc-btn{flex:1;min-width:56px;padding:9px 4px;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-sky{background:var(--sky);color:#fff}
.btn-main{background:rgba(14,165,233,.1);color:var(--sky);border:1px solid rgba(14,165,233,.25)}
.btn-grn{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.btn-pur{background:rgba(124,58,237,.12);color:#7C3AED;border:1px solid rgba(124,58,237,.25)}
.btn-teal{background:rgba(5,150,105,.12);color:#059669;border:1px solid rgba(5,150,105,.25)}
.btn-del{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25)}
/* PENDING */
.pending-card{background:rgba(245,158,11,.06);border:1.5px solid rgba(245,158,11,.2);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.pending-card.card-rejected{background:rgba(239,68,68,.04);border-color:rgba(239,68,68,.2)}
.pending-card.card-active{background:rgba(16,185,129,.04);border-color:rgba(16,185,129,.2)}
.pc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pc-name{font-size:14px;font-weight:700;color:var(--text)}
.pc-badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px}
.badge-pending{background:rgba(245,158,11,.15);color:var(--gold)}
.badge-rejected{background:rgba(239,68,68,.12);color:var(--red)}
.badge-active{background:rgba(16,185,129,.12);color:var(--green)}
.pc-email{font-size:12px;color:var(--sub);margin-bottom:2px}
.pc-time{font-size:11px;color:var(--hint);margin-bottom:10px}
.pc-memo-row{display:flex;gap:6px;margin-bottom:8px}
.pc-memo-inp{flex:1;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;color:var(--text);outline:none}
.pc-btn-row{display:flex;gap:6px}
.btn-approve{flex:1;padding:9px 4px;background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3);border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-reject{flex:1;padding:9px 4px;background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25);border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
/* FILTER TABS */
.filter-tabs{display:flex;gap:6px;margin-bottom:10px}
.filter-tab{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.filter-tab.on{background:var(--gold);color:#0F1C2D;border-color:var(--gold)}
/* PAGINATION */
.page-btn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);background:rgba(255,255,255,.04);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);transition:background .15s}
.page-btn:disabled{opacity:.3;cursor:not-allowed}
.page-info{font-size:13px;color:var(--sub);font-weight:600}
/* MEMO */
.uc-pending-memo{font-size:11px;color:var(--sky);margin-bottom:6px;line-height:1.5;word-break:break-all}
.uc-memo-details{margin-bottom:6px}
.uc-memo-summary{font-size:11px;color:var(--sky);cursor:pointer;list-style:none;display:flex;align-items:center;gap:4px;word-break:break-all}
.uc-memo-summary::-webkit-details-marker{display:none}
.uc-memo-full{font-size:11px;color:var(--sky);margin-top:6px;padding:7px 10px;background:rgba(14,165,233,.06);border-radius:7px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
/* EXPIRY */
#expiry-load-btn{width:100%;padding:11px;background:rgba(14,165,233,.1);color:var(--sky);border:1px solid rgba(14,165,233,.25);border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:4px}
#expiry-load-btn:disabled{opacity:.5;cursor:not-allowed}
.exp-group{background:var(--card);border-radius:12px;padding:14px;border:1.5px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.exp-group-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.exp-group-name{font-size:14px;font-weight:700;color:var(--text)}
.exp-copy-btn{padding:6px 12px;background:rgba(14,165,233,.1);color:var(--sky);border:1px solid rgba(14,165,233,.25);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.exp-row{padding:8px;background:rgba(0,0,0,.18);border-radius:7px;display:flex;flex-direction:column;gap:6px}
.exp-row-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.exp-room{font-size:12px;font-weight:700;color:var(--text);flex-shrink:0}
.exp-tenant{font-size:12px;color:var(--sub);flex:1;min-width:50px}
.exp-date{font-size:11px;color:var(--hint);flex-shrink:0}
.exp-dl{font-size:11px;font-weight:800;padding:1px 6px;border-radius:4px;flex-shrink:0}
.exp-dl.red{background:rgba(239,68,68,.15);color:var(--red)}
.exp-dl.ora{background:rgba(245,158,11,.15);color:var(--gold)}
.exp-row-memo{display:flex;gap:6px;align-items:center}
.exp-memo-inp{flex:1;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:7px;padding:6px 9px;font-size:11px;font-family:inherit;color:var(--text);outline:none}
.exp-memo-inp::placeholder{color:var(--hint)}
.exp-memo-inp:focus{border-color:var(--sky)}
.exp-memo-save{padding:5px 10px;background:rgba(14,165,233,.1);color:var(--sky);border:1px solid rgba(14,165,233,.25);border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.exp-dismiss{padding:5px 8px;background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0}
/* HIST */
.hist-open-btn{padding:5px 10px;background:rgba(100,116,139,.1);color:var(--sub);border:1px solid rgba(100,116,139,.25);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.hist-search-inp{width:100%;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;color:var(--text);outline:none}
.hist-search-inp:focus{border-color:var(--sky)}
.hist-search-inp::placeholder{color:var(--hint)}
.hist-row{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.hist-row-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hist-who{font-size:12px;font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-date{font-size:10px;color:var(--hint);flex-shrink:0}
.hist-detail{font-size:11px;color:var(--sub)}
.hist-memo{font-size:11px;color:var(--sky);margin-top:2px}
.hist-restore{padding:3px 8px;background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.25);border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
/* COLLAPSIBLE CARD */
.uc-expand{display:none;margin-top:6px}
.user-card.open .uc-expand{display:block}
.uc-top{cursor:pointer;user-select:none}
.uc-chevron{font-size:10px;color:var(--hint);flex-shrink:0;transition:transform .2s}
.user-card.open .uc-chevron{transform:rotate(180deg)}
/* EMPTY */
.empty-state{text-align:center;padding:40px 16px;color:var(--hint)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-txt{font-size:13px;line-height:1.8}
/* BLIND */
.btn-blind-wrap{position:relative;flex:1;min-width:56px}
.btn-blind{position:absolute;inset:0;border-radius:9px;background:rgba(71,85,105,.28);border:1.5px solid rgba(100,116,139,.4);color:var(--sub);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;z-index:2;font-family:inherit;transition:opacity .2s,transform .22s cubic-bezier(.4,0,.2,1);user-select:none}
.btn-blind.lifted{opacity:0;transform:translateY(-8px);pointer-events:none}
/* CONFIRM */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-bg.show{display:flex}
.confirm-box{background:#1A2B3C;border:1px solid var(--border);border-radius:20px;padding:24px;max-width:320px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.confirm-box h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--sub);margin-bottom:18px;line-height:1.6;white-space:pre-line}
.confirm-btns{display:flex;gap:10px;justify-content:flex-end}
.confirm-btns button{padding:9px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
/* TOAST / LOADING */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1F2937;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:calc(100vw - 48px);text-align:center;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#loading-overlay{position:fixed;inset:0;background:rgba(10,22,40,.95);z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .3s}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:5px solid rgba(255,255,255,.12);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{color:rgba(255,255,255,.5);font-size:13px}
#access-denied{position:fixed;inset:0;background:linear-gradient(160deg,#0A1628,#1A2B3C);z-index:7500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:14px}
.denied-icon{font-size:64px}
.denied-title{font-size:20px;font-weight:900;color:var(--red)}
.denied-sub{font-size:13px;color:var(--sub);line-height:1.7}
.denied-btn{padding:12px 28px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
/* USER DROPDOWN */
.usr-drop{position:fixed;background:#1A2B3C;border:1px solid var(--border);border-radius:12px;min-width:220px;max-width:300px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden;max-height:60vh;overflow-y:auto}
.usr-drop-item{padding:11px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.usr-drop-item:last-child{border-bottom:none}
.usr-drop-item:active{background:rgba(14,165,233,.1)}
.usr-drop-item.on{color:var(--sky)}
.usr-drop-uid{font-size:10px;color:var(--hint);font-family:monospace}
.usr-drop-none{padding:11px 14px;font-size:12px;color:var(--hint);cursor:pointer;border-bottom:1px solid var(--border)}
.usr-drop-none:active{background:rgba(255,255,255,.04)}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-txt">인증 확인 중...</div>
</div>
<div id="access-denied" style="display:none">
  <div class="denied-icon">🚫</div>
  <div class="denied-title">접근 권한 없음</div>
  <div class="denied-sub">전체 관리자만 접근할 수 있는 페이지입니다.</div>
  <button class="denied-btn" onclick="location.href='../index.html'">← 돌아가기</button>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-left">
        <a href="admin.html" style="display:flex;align-items:center;line-height:0">
          <img src="../logo.png" alt="PlusHome" style="height:36px;width:auto;image-rendering:-webkit-optimize-contrast">
        </a>
        <span class="admin-badge">ADMIN</span>
        <button class="ctx-btn" id="ctx-btn" onclick="toggleUserDrop(event)">사용자 선택 ▾</button>
      </div>
      <div class="hdr-right">
        <div id="av-wrap" style="cursor:pointer" onclick="auth.signOut().then(()=>location.href='../index.html')"></div>
      </div>
    </div>
    <nav class="nav">
      <a href="admin.html" class="nav-tab on">📊 메인</a>
      <a href="units.html" class="nav-tab">🏠 세대</a>
      <a href="expense.html" class="nav-tab">💸 장부</a>
      <a href="manage.html" class="nav-tab">🗂 관리</a>
    </nav>
  </div>

  <div class="content">
    <!-- 신규 사용자 승인 -->
    <div class="sec-title" style="margin-bottom:8px" id="pending-sec-title">🔔 신규 사용자 승인</div>
    <div class="filter-tabs">
      <button class="filter-tab on" id="ft-pending" onclick="setFilter('pending')">⏳ 대기중</button>
      <button class="filter-tab" id="ft-all" onclick="setFilter('all')">전체</button>
    </div>
    <div id="pending-list" style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px"></div>

    <!-- 계약 만료 임박 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;margin-bottom:8px">
      <div class="sec-title" style="margin:0">⚠️ 사용자 건물 만료 임박 (30일 이내)</div>
      <button class="hist-open-btn" onclick="openExpiryHistory()">🗄 알림 완료 이력</button>
    </div>
    <button id="expiry-load-btn" onclick="loadAllExpiring()">📋 전체 조회</button>
    <div id="expiry-list" style="margin-top:10px;display:flex;flex-direction:column;gap:8px"></div>
    <div id="expiry-pagination" style="display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0;margin-bottom:20px"></div>

    <!-- 사용자 목록 제목 (removed 사용자 등록 section) -->
    <div style="display:none">
      <input type="text" id="inp-name">
      <input type="text" id="inp-uid">
      <input type="text" id="inp-memo">
    </div>

    <!-- 사용자 목록 -->
    <div class="users-hdr">
      <div class="sec-title" id="users-sec-title">👥 관리 사용자 목록</div>
      <input type="text" class="uc-search" id="uc-search" placeholder="이름·자율·대행 검색" oninput="onUcSearch()">
      <button class="uc-sync-btn" id="uc-sync-btn" onclick="syncMasterUsers()">🔄 동기화</button>
    </div>
    <div class="users-list" id="users-list"></div>
    <div id="uc-pagination" style="display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 0;margin-bottom:20px"></div>
  </div>
</div>

<!-- 알림 이력 모달 -->
<div class="confirm-bg" id="hist-modal" style="align-items:flex-start;padding-top:60px">
  <div class="confirm-box" style="max-width:480px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden">
    <div style="padding:18px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <div style="font-size:15px;font-weight:700;color:var(--text)">🗄 삭제된 알림 이력</div>
      <button onclick="closeExpiryHistory()" style="background:rgba(255,255,255,.07);color:var(--sub);border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">✕ 닫기</button>
    </div>
    <div style="padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0">
      <input class="hist-search-inp" id="hist-search" type="text" placeholder="사용자명, 건물명, 호실, 세입자명 검색..." oninput="histSearch(this.value)">
    </div>
    <div id="hist-list" style="flex:1;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:8px"></div>
    <div id="hist-pagination" style="padding:10px 18px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:12px;flex-shrink:0"></div>
  </div>
</div>

<div class="confirm-bg" id="confirm-modal">
  <div class="confirm-box">
    <h3 id="cm-title">확인</h3>
    <p id="cm-msg"></p>
    <div class="confirm-btns">
      <button style="background:rgba(255,255,255,.07);color:var(--sub)" onclick="closeCM()">취소</button>
      <button style="background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)" id="cm-ok">확인</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
let usersRef=null,pendingUsersRef=null,allUsersData={},pendingFilter="pending";
let viewingUid=sessionStorage.getItem("master_view_uid")||null;
let viewingName=sessionStorage.getItem("master_view_name")||null;
let ucTotalList=[],ucPage=1,_usrDrop=null;
let expiryAll=[],expiryPage=1;

auth.onAuthStateChanged(user=>{
  const lo=document.getElementById("loading-overlay");
  const app=document.getElementById("app");
  const denied=document.getElementById("access-denied");
  if(!user){
    auth.signInWithPopup(gProv)
      .then(r=>{if(r.user.uid!==MASTER_UID){lo.classList.add("hide");denied.style.display="flex";auth.signOut();}})
      .catch(()=>{lo.classList.add("hide");denied.style.display="flex";});
    return;
  }
  if(user.uid!==MASTER_UID){lo.classList.add("hide");denied.style.display="flex";return;}
  lo.classList.add("hide");app.style.display="block";
  const w=document.getElementById("av-wrap");
  w.innerHTML=user.photoURL?`<img class="av-img" src="${user.photoURL}">`:`<div class="av-txt">${(user.displayName||"A")[0]}</div>`;
  usersRef=db.ref(DBPath.masterUsers());
  usersRef.on("value",snap=>renderUsers(snap.val()||{}));
  pendingUsersRef=db.ref(DBPath.pendingUsers());
  pendingUsersRef.on("value",snap=>{allUsersData=snap.val()||{};renderPendingUsers();renderUsersPage();});
  updateCtxBtn();
});

function updateCtxBtn(){
  const btn=document.getElementById("ctx-btn");if(!btn)return;
  if(viewingUid){
    const n=viewingName||viewingUid;
    btn.textContent=(n.length>12?n.slice(0,11)+"…":n)+" ▾";
    btn.style.color="var(--green)";btn.style.borderColor="rgba(16,185,129,.4)";btn.style.background="rgba(16,185,129,.1)";
  }else{
    btn.textContent="사용자 선택 ▾";
    btn.style.color="var(--sky)";btn.style.borderColor="rgba(14,165,233,.25)";btn.style.background="rgba(14,165,233,.1)";
  }
}

function toggleUserDrop(e){
  if(e)e.stopPropagation();
  if(_usrDrop){_usrDrop.remove();_usrDrop=null;return;}
  if(!ucTotalList.length){showToast("등록된 사용자가 없습니다");return;}
  const btn=document.getElementById("ctx-btn");
  const drop=document.createElement("div");drop.className="usr-drop";
  const none=document.createElement("div");none.className="usr-drop-none";
  none.textContent="— 선택 안함 —";
  none.onclick=()=>{clearViewing();_usrDrop.remove();_usrDrop=null;};
  drop.appendChild(none);
  ucTotalList.forEach(u=>{
    const item=document.createElement("div");
    item.className="usr-drop-item"+(viewingUid===u.uid?" on":"");
    const nm=document.createElement("span");nm.textContent=u.name;
    const uid=document.createElement("span");uid.className="usr-drop-uid";uid.textContent=u.uid;
    item.appendChild(nm);item.appendChild(uid);
    item.onclick=()=>{setViewing(u.uid,u.name);_usrDrop.remove();_usrDrop=null;};
    drop.appendChild(item);
  });
  const r=btn.getBoundingClientRect();
  drop.style.cssText=`top:${r.bottom+4}px;right:${window.innerWidth-r.right}px;position:fixed`;
  document.body.appendChild(drop);_usrDrop=drop;
}
document.addEventListener("click",()=>{if(_usrDrop){_usrDrop.remove();_usrDrop=null;}});

// ── 만료 임박 전체 조회 ──
async function loadAllExpiring(){
  const btn=document.getElementById("expiry-load-btn");
  const el=document.getElementById("expiry-list");
  btn.disabled=true;btn.textContent="⏳ 조회 중...";
  el.innerHTML="";expiryAll=[];
  try{
    const usersSnap=await db.ref(DBPath.masterUsers()).once("value");
    const users=Object.values(usersSnap.val()||{});
    const today=new Date();today.setHours(0,0,0,0);
    for(const u of users){
      const bldsSnap=await db.ref(DBPath.bldList(u.uid)).once("value");
      const blds=bldsSnap.val()||{};
      await Promise.all(Object.entries(blds).map(async([bid,bld])=>{
        const [uSnap,rlSnap]=await Promise.all([
          db.ref(DBPath.units(u.uid,bid)).once("value"),
          db.ref(DBPath.roomLayout(u.uid,bid)).once("value")
        ]);
        const units=Object.values(uSnap.val()||{});
        const rl=rlSnap.val()||null;
        const rlRooms=rl?new Set(Object.values(rl).flat().map(String)):null;
        (rlRooms?units.filter(x=>rlRooms.has(String(x.room))):units)
          .filter(x=>x.status==="rented"&&x.contractEnd)
          .forEach(x=>{
            const d=new Date(x.contractEnd);d.setHours(0,0,0,0);
            const dl=Math.ceil((d-today)/864e5);
            if(dl>=0&&dl<=30)expiryAll.push({userName:u.name,uid:u.uid,bldName:bld.name||bid,bid,room:x.room,tenantName:x.tenantName||"",contractEnd:x.contractEnd,dl});
          });
      }));
    }
    // 메모·삭제 노트 로드 후 dismissed 항목 제거 + 메모 첨부
    const notesSnap=await db.ref("master_admin/expiry_notes").once("value");
    const notes=notesSnap.val()||{};
    expiryAll=expiryAll.filter(r=>!notes[r.uid]?.[r.bid]?.[String(r.room)]?.dismissed);
    expiryAll.forEach(r=>{r.memo=notes[r.uid]?.[r.bid]?.[String(r.room)]?.memo||"";});
    expiryAll.sort((a,b)=>a.dl!==b.dl?a.dl-b.dl:(parseInt(a.room)-parseInt(b.room))||String(a.room).localeCompare(String(b.room)));
    expiryPage=1;renderExpiryPage();
    btn.textContent=`📋 다시 조회 (총 ${expiryAll.length}건)`;
  }catch(e){
    el.innerHTML=`<div class="empty-state"><div class="empty-txt">❗ 조회 실패: ${e.message}</div></div>`;
    btn.textContent="📋 전체 조회";
  }
  btn.disabled=false;
}
function renderExpiryPage(){
  const el=document.getElementById("expiry-list");
  const pgEl=document.getElementById("expiry-pagination");
  if(!expiryAll.length){
    el.innerHTML='<div class="empty-state" style="padding:16px 0"><div class="empty-icon" style="font-size:28px">✅</div><div class="empty-txt">30일 내 만료 없음</div></div>';
    if(pgEl)pgEl.innerHTML="";return;
  }
  // 사용자별 그룹핑 (각 그룹 내 dl 오름차순 유지)
  const groupMap={};
  expiryAll.forEach(r=>{
    if(!groupMap[r.uid])groupMap[r.uid]={userName:r.userName,uid:r.uid,items:[]};
    groupMap[r.uid].items.push(r);
  });
  const groups=Object.values(groupMap).sort((a,b)=>a.items[0].dl-b.items[0].dl);
  const tp=Math.ceil(groups.length/10);
  if(expiryPage<1)expiryPage=1;if(expiryPage>tp)expiryPage=tp;
  const start=(expiryPage-1)*10;
  el.innerHTML=groups.slice(start,start+10).map(g=>{
    const rows=g.items.map(r=>{
      const isRed=r.dl<=7;
      const eid=`${esc(r.uid)}-${esc(r.bid)}-${esc(String(r.room))}`;
      return`<div class="exp-row">
        <div class="exp-row-top">
          <span class="exp-room">${esc(r.bldName)} ${esc(String(r.room))}호</span>
          <span class="exp-tenant">${esc(r.tenantName||"(미등록)")}</span>
          <span class="exp-date">${esc(r.contractEnd)}</span>
          <span class="exp-dl ${isRed?"red":"ora"}">D-${r.dl}</span>
          <button class="exp-dismiss" onclick="dismissExpiry('${esc(r.uid)}','${esc(r.bid)}','${esc(String(r.room))}')">🗑</button>
        </div>
        <div class="exp-row-memo">
          <input class="exp-memo-inp" id="ememo-${eid}" type="text" value="${esc(r.memo)}" placeholder="메모 (통화함, 갱신예정 등)">
          <button class="exp-memo-save" onclick="saveExpiryMemo('${esc(r.uid)}','${esc(r.bid)}','${esc(String(r.room))}')">💾</button>
        </div>
      </div>`;
    }).join("");
    return`<div class="exp-group">
      <div class="exp-group-hd">
        <span class="exp-group-name">👤 ${esc(g.userName)}</span>
        <button class="exp-copy-btn" onclick="copyUserMsg('${esc(g.uid)}')">📋 문자 복사</button>
      </div>
      ${rows}
    </div>`;
  }).join("");
  if(!pgEl)return;
  if(tp<=1){pgEl.innerHTML="";return;}
  pgEl.innerHTML=`<button class="page-btn" onclick="expSetPage(${expiryPage-1})" ${expiryPage<=1?"disabled":""}>◀</button><span class="page-info">${expiryPage} / ${tp}</span><button class="page-btn" onclick="expSetPage(${expiryPage+1})" ${expiryPage>=tp?"disabled":""}>▶</button>`;
}
function expSetPage(p){expiryPage=p;renderExpiryPage();}
async function saveExpiryMemo(uid,bid,room){
  const eid=`${uid}-${bid}-${room}`;
  const inp=document.getElementById("ememo-"+eid);if(!inp)return;
  const memo=inp.value.trim();
  try{
    await db.ref(`master_admin/expiry_notes/${uid}/${bid}/${room}`).update({memo});
    const item=expiryAll.find(r=>r.uid===uid&&r.bid===bid&&String(r.room)===String(room));
    if(item)item.memo=memo;
    showToast("✅ 메모 저장됨");
  }catch(e){showToast("❗ 저장 실패");}
}
async function dismissExpiry(uid,bid,room){
  const item=expiryAll.find(r=>r.uid===uid&&r.bid===bid&&String(r.room)===String(room));
  try{
    await db.ref(`master_admin/expiry_notes/${uid}/${bid}/${room}`).update({
      dismissed:true,dismissedAt:new Date().toISOString(),
      userName:item?.userName||"",bldName:item?.bldName||"",
      tenantName:item?.tenantName||"",contractEnd:item?.contractEnd||"",
      dl:item?.dl??""
    });
    expiryAll=expiryAll.filter(r=>!(r.uid===uid&&r.bid===bid&&String(r.room)===String(room)));
    renderExpiryPage();
    const btn=document.getElementById("expiry-load-btn");
    if(btn&&!btn.disabled)btn.textContent=`📋 다시 조회 (총 ${expiryAll.length}건)`;
    showToast("🗑 목록에서 제거됨");
  }catch(e){showToast("❗ 실패");}
}
// ── 알림 이력 모달 ──
let histAll=[],histFiltered=[],histPage=1;
async function openExpiryHistory(){
  document.getElementById("hist-modal").classList.add("show");
  document.getElementById("hist-search").value="";
  document.getElementById("hist-list").innerHTML='<div class="empty-state" style="padding:20px 0"><div class="loading-txt">불러오는 중...</div></div>';
  document.getElementById("hist-pagination").innerHTML="";
  const snap=await db.ref("master_admin/expiry_notes").once("value");
  const notes=snap.val()||{};
  histAll=[];
  Object.entries(notes).forEach(([uid,bids])=>{
    Object.entries(bids).forEach(([bid,rooms])=>{
      Object.entries(rooms).forEach(([room,n])=>{
        if(!n.dismissed)return;
        histAll.push({uid,bid,room,
          userName:n.userName||uid,bldName:n.bldName||bid,
          tenantName:n.tenantName||"",contractEnd:n.contractEnd||"",
          dl:n.dl??"",memo:n.memo||"",dismissedAt:n.dismissedAt||""
        });
      });
    });
  });
  histAll.sort((a,b)=>b.dismissedAt.localeCompare(a.dismissedAt));
  histFiltered=[...histAll];histPage=1;renderHistoryPage();
}
function closeExpiryHistory(){document.getElementById("hist-modal").classList.remove("show");}
function histSearch(q){
  const kw=q.trim().toLowerCase();
  histFiltered=kw?histAll.filter(r=>[r.userName,r.bldName,String(r.room),r.tenantName].some(s=>s.toLowerCase().includes(kw))):([...histAll]);
  histPage=1;renderHistoryPage();
}
function renderHistoryPage(){
  const el=document.getElementById("hist-list");
  const pgEl=document.getElementById("hist-pagination");
  if(!histFiltered.length){
    el.innerHTML='<div class="empty-state" style="padding:20px 0"><div class="empty-icon" style="font-size:28px">📭</div><div class="empty-txt">이력 없음</div></div>';
    pgEl.innerHTML="";return;
  }
  const tp=Math.ceil(histFiltered.length/10);
  if(histPage<1)histPage=1;if(histPage>tp)histPage=tp;
  const start=(histPage-1)*10;
  el.innerHTML=histFiltered.slice(start,start+10).map(r=>{
    const dt=r.dismissedAt?new Date(r.dismissedAt).toLocaleDateString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit"}):"";
    return`<div class="hist-row">
      <div class="hist-row-top">
        <span class="hist-who">${esc(r.userName)} · ${esc(r.bldName)} ${esc(String(r.room))}호</span>
        <span class="hist-date">${esc(dt)}</span>
        <button class="hist-restore" onclick="restoreExpiry('${esc(r.uid)}','${esc(r.bid)}','${esc(String(r.room))}')">↩ 복구</button>
      </div>
      <div class="hist-detail">👤 ${esc(r.tenantName||"(미등록)")} &nbsp;|&nbsp; 📅 ${esc(r.contractEnd)}${r.dl!==""?` (D-${r.dl}일)`:""}</div>
      ${r.memo?`<div class="hist-memo">💬 ${esc(r.memo)}</div>`:""}
    </div>`;
  }).join("");
  if(tp<=1){pgEl.innerHTML="";return;}
  pgEl.innerHTML=`<button class="page-btn" onclick="histSetPage(${histPage-1})" ${histPage<=1?"disabled":""}>◀</button><span class="page-info">${histPage} / ${tp}</span><button class="page-btn" onclick="histSetPage(${histPage+1})" ${histPage>=tp?"disabled":""}>▶</button>`;
}
function histSetPage(p){histPage=p;renderHistoryPage();}
async function restoreExpiry(uid,bid,room){
  try{
    await db.ref(`master_admin/expiry_notes/${uid}/${bid}/${room}`).update({dismissed:false,dismissedAt:null});
    histAll=histAll.filter(r=>!(r.uid===uid&&r.bid===bid&&String(r.room)===String(room)));
    histFiltered=histFiltered.filter(r=>!(r.uid===uid&&r.bid===bid&&String(r.room)===String(room)));
    renderHistoryPage();showToast("↩ 복구됨 — 다음 전체 조회 시 표시됩니다");
  }catch(e){showToast("❗ 실패");}
}

function copyUserMsg(uid){
  const items=expiryAll.filter(r=>r.uid===uid);
  if(!items.length)return;
  const name=items[0].userName;
  const lines=items.map(r=>`▪ ${r.bldName} ${r.room}호 \n· ${r.tenantName||"(세입자 미등록)"} \n· ${r.contractEnd} (D-${r.dl}일)`).join("\n\n");
  const msg=`[PlusHome] 계약 만료 임박 안내\n\n안녕하세요, ${name}님.\n관리 중이신 건물에 30일 이내 계약 만료 세대가 있어 안내드립니다.\n\n📋 만료 임박 세대\n\n${lines}\n\n계약 갱신 협의 또는 이사 일정을 미리 조율해 두시면 좋겠습니다.\n\n👉 plushome.kr 에서 세부 내용 확인`;
  navigator.clipboard.writeText(msg).then(()=>showToast("📋 클립보드에 복사됨")).catch(()=>showToast("❗ 복사 실패 — 직접 선택하세요"));
}

// ── 신규 승인 ──
function setFilter(f){
  pendingFilter=f;
  document.getElementById("ft-pending").className="filter-tab"+(f==="pending"?" on":"");
  document.getElementById("ft-all").className="filter-tab"+(f==="all"?" on":"");
  renderPendingUsers();
}
function renderPendingUsers(){
  const all=Object.values(allUsersData).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const pendingCount=all.filter(u=>(u.status||"pending")==="pending").length;
  const totalCount=all.length;
  const titleEl=document.getElementById("pending-sec-title");
  if(titleEl)titleEl.textContent=`🔔 신규 사용자 승인 (대기중-${pendingCount}명, 전체-${totalCount}명)`;
  const list=pendingFilter==="pending"?all.filter(u=>(u.status||"pending")==="pending"):all;
  const el=document.getElementById("pending-list");
  if(!list.length){
    el.innerHTML=`<div class="empty-state" style="padding:20px 0"><div class="empty-icon" style="font-size:32px">✅</div><div class="empty-txt">${pendingFilter==="pending"?"대기 중인 신규 사용자 없음":"신규 사용자 없음"}</div></div>`;
    return;
  }
  el.innerHTML=list.map(u=>{
    const st=u.status||"pending";
    const badgeCls=st==="active"?"badge-active":st==="rejected"?"badge-rejected":"badge-pending";
    const badgeTxt=st==="active"?"✅ 활성":st==="rejected"?"🚫 거부":"⏳ 대기";
    const cardCls=st==="active"?" card-active":st==="rejected"?" card-rejected":"";
    const dt=u.createdAt?new Date(u.createdAt).toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
    return`<div class="pending-card${cardCls}">
      <div class="pc-top"><div class="pc-name">${esc(u.displayName||"(이름없음)")}</div><span class="pc-badge ${badgeCls}">${badgeTxt}</span></div>
      <div class="pc-email">📧 ${esc(u.email||"")}</div>
      <div class="pc-time">🕐 신청: ${esc(dt)}</div>
      <div class="pc-memo-row">
        <input class="pc-memo-inp" id="pm-${esc(u.uid)}" type="text" value="${esc(u.memo||"")}" placeholder="메모 (결제일, 건물명 등)">
        <button style="padding:8px 12px;background:rgba(14,165,233,.1);color:var(--sky);border:1px solid rgba(14,165,233,.25);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap" onclick="savePendingMemo('${esc(u.uid)}')">저장</button>
        <button style="padding:8px 10px;background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25);border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0" onclick="deletePendingMemo('${esc(u.uid)}')">🗑</button>
      </div>
      <div class="pc-btn-row">
        ${st!=="active"?`<button class="btn-approve" onclick="approveUser('${esc(u.uid)}','${esc(u.displayName||"")}','${esc(u.email||"")}')">✅ 활성화</button>`:""}
        ${st!=="rejected"?`<div class="btn-blind-wrap"><div class="btn-blind" onclick="liftBlind(this)">🔒 거부</div><button class="btn-reject" style="width:100%" onclick="rejectUser('${esc(u.uid)}')">🚫 거부</button></div>`:""}
        ${st==="active"?`<button class="btn-approve" style="background:rgba(14,165,233,.12);color:var(--sky);border:1px solid rgba(14,165,233,.3)" onclick="setAndGo('${esc(u.uid)}','${esc(u.displayName||u.uid)}','units')">👁 세대 열람</button>`:""}
      </div>
    </div>`;
  }).join("");
}

async function approveUser(uid,displayName,email){
  try{
    await db.ref(DBPath.pendingUser(uid)).update({status:"active"});
    const snap=await db.ref(DBPath.masterUser(uid)).once("value");
    if(!snap.exists()){
      const memo=document.getElementById("pm-"+uid)?.value.trim()||"";
      await db.ref(DBPath.masterUser(uid)).set({uid,name:displayName||email||uid,memo,createdAt:(allUsersData[uid]?.createdAt||new Date().toISOString())});
    }
    showToast("✅ 활성화됨: "+(displayName||email));
  }catch(e){showToast("❗ 실패: "+e.message)}
}
async function rejectUser(uid){
  try{await db.ref(DBPath.pendingUser(uid)).update({status:"rejected"});showToast("🚫 거부됨");}
  catch(e){showToast("❗ 실패")}
}
async function savePendingMemo(uid){
  const val=document.getElementById("pm-"+uid)?.value.trim()||"";
  try{await db.ref(DBPath.pendingUser(uid)).update({memo:val});showToast("✅ 메모 저장됨");}
  catch(e){showToast("❗ 실패")}
}
async function deletePendingMemo(uid){
  try{
    const inp=document.getElementById("pm-"+uid);if(inp)inp.value="";
    await db.ref(DBPath.pendingUserMemo(uid)).remove();showToast("🗑 메모 삭제됨");
  }catch(e){showToast("❗ 실패")}
}

// ── 사용자 등록 ──
function addUser(){
  const name=document.getElementById("inp-name").value.trim();
  const uid=document.getElementById("inp-uid").value.trim();
  const memo=document.getElementById("inp-memo").value.trim();
  if(!name){showToast("❗ 이름을 입력하세요");return}
  if(!uid||uid.length<20){showToast("❗ 올바른 UID를 입력하세요");return}
  usersRef.child(uid).set({uid,name,memo,createdAt:new Date().toISOString()})
    .then(()=>{document.getElementById("inp-name").value="";document.getElementById("inp-uid").value="";document.getElementById("inp-memo").value="";showToast("✅ 등록됨: "+name);})
    .catch(()=>showToast("❗ 등록 실패"));
}

// ── 목록 렌더 ──
let ucSearchTerm="";
function onUcSearch(){
  ucSearchTerm=document.getElementById("uc-search").value.trim().toLowerCase();
  ucPage=1;renderUsersPage();
}
function toggleUserType(uid,currentType){
  const newType=currentType==="proxy"?"self":"proxy";
  usersRef.child(uid).update({userType:newType}).catch(()=>showToast("❗ 변경 실패"));
}
async function syncMasterUsers(){
  const btn=document.getElementById("uc-sync-btn");
  if(btn)btn.disabled=true;
  try{
    const [usersSnap,pendingSnap]=await Promise.all([
      db.ref(DBPath.masterUsers()).once("value"),
      db.ref(DBPath.pendingUsers()).once("value"),
    ]);
    const existing=usersSnap.val()||{};
    const pending=pendingSnap.val()||{};
    const updates={};
    let count=0;
    for(const [uid,p] of Object.entries(pending)){
      if((p.status||"pending")!=="active")continue;
      if(existing[uid])continue;
      updates[uid]={
        uid,
        name:p.displayName||p.email||uid,
        memo:p.memo||"",
        userType:"self",
        createdAt:p.createdAt||new Date().toISOString(),
      };
      count++;
    }
    const me=auth.currentUser;
    if(me&&me.uid===MASTER_UID&&!existing[me.uid]&&!updates[me.uid]){
      updates[me.uid]={
        uid:me.uid,
        name:me.displayName||me.email||me.uid,
        memo:"관리자 본인",
        userType:"self",
        createdAt:new Date().toISOString(),
      };
      count++;
    }
    if(!count){showToast("✅ 누락된 사용자 없음 — 이미 동기화됨");return;}
    await db.ref(DBPath.masterUsers()).update(updates);
    showToast(`✅ ${count}명 동기화됨`);
  }catch(e){
    showToast("❗ 동기화 실패: "+e.message);
  }finally{
    if(btn)btn.disabled=false;
  }
}
function ucFilteredList(){
  if(!ucSearchTerm)return ucTotalList;
  return ucTotalList.filter(u=>{
    const showName=(allUsersData[u.uid]?.displayName||u.name||"").toLowerCase();
    const type=(u.userType==="proxy")?"대행":"자율";
    return showName.includes(ucSearchTerm)||type.includes(ucSearchTerm);
  });
}
function renderUsers(data){
  ucTotalList=Object.values(data).sort((a,b)=>a.createdAt>b.createdAt?1:-1);
  const t=document.getElementById("users-sec-title");
  if(t)t.textContent=`👥 관리 사용자 목록 (${ucTotalList.length}명)`;
  renderUsersPage();
}
function renderUsersPage(){
  const el=document.getElementById("users-list");
  const pgEl=document.getElementById("uc-pagination");
  if(!ucTotalList.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-txt">등록된 사용자가 없습니다<br>신규 승인 후 자동으로 표시됩니다</div></div>`;
    if(pgEl)pgEl.innerHTML="";return;
  }
  const list=ucFilteredList();
  if(!list.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-txt">검색 결과가 없습니다</div></div>`;
    if(pgEl)pgEl.innerHTML="";return;
  }
  const total=list.length,tp=Math.ceil(total/10);
  if(ucPage<1)ucPage=1;if(ucPage>tp)ucPage=tp;
  const start=(ucPage-1)*10;
  el.innerHTML=list.slice(start,start+10).map((u,i)=>{
    const isV=viewingUid===u.uid;
    const pm=allUsersData[u.uid]?.memo||"";
    const googleName=allUsersData[u.uid]?.displayName||"";
    const showName=googleName||u.name;
    const alias=(googleName&&googleName!==u.name)?u.name:"";
    const userType=u.userType==="proxy"?"proxy":"self";
    const typeLabel=userType==="proxy"?"대행":"자율";
    const typeBadge=`<span class="uc-type-badge ${userType}" onclick="event.stopPropagation();toggleUserType('${esc(u.uid)}','${userType}')">${typeLabel}</span>`;
    const memoHtml=pm
      ?(pm.length<=25?`<div class="uc-pending-memo">💬 ${esc(pm)}</div>`:`<details class="uc-memo-details"><summary class="uc-memo-summary">💬 ${esc(pm.slice(0,25))}…</summary><div class="uc-memo-full">${esc(pm)}</div></details>`)
      :"";
    return`<div class="user-card${isV?" active open":""}" id="uc-${esc(u.uid)}">
      <div class="uc-top" onclick="toggleCard(this)"><div class="uc-name">${esc(showName)}${typeBadge}${alias?`<span style="font-size:11px;color:var(--sub);font-weight:400">(${esc(alias)})</span>`:""}</div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><div class="uc-num">#${start+i+1}</div><span class="uc-chevron">▼</span></div></div>
      ${memoHtml}
      ${u.memo&&u.memo!==pm?`<div class="uc-desc">📝 ${esc(u.memo)}</div>`:""}
      <div class="uc-expand">
        <div class="uc-uid">${esc(u.uid)}</div>
        <div class="uc-actions">
          <button class="uc-btn btn-main" onclick="setAndGo('${esc(u.uid)}','${esc(showName)}','units')">🏠 세대</button>
          <button class="uc-btn btn-pur" onclick="setAndGo('${esc(u.uid)}','${esc(showName)}','expense')">💸 장부</button>
          <button class="uc-btn btn-teal" onclick="setAndGo('${esc(u.uid)}','${esc(showName)}','manage')">🗂 관리</button>
          <div class="btn-blind-wrap"><div class="btn-blind" onclick="liftBlind(this)">🔒 🗑</div><button class="uc-btn btn-del" style="width:100%" onclick="delUser('${esc(u.uid)}','${esc(showName)}')">🗑</button></div>
        </div>
      </div>
    </div>`;
  }).join("");
  if(!pgEl)return;
  if(tp<=1){pgEl.innerHTML="";return;}
  pgEl.innerHTML=`<button class="page-btn" onclick="ucSetPage(${ucPage-1})" ${ucPage<=1?"disabled":""}>◀</button><span class="page-info">${ucPage} / ${tp}</span><button class="page-btn" onclick="ucSetPage(${ucPage+1})" ${ucPage>=tp?"disabled":""}>▶</button>`;
}
function ucSetPage(p){ucPage=p;renderUsersPage()}

// ── 사용자 선택 ──
function setViewing(uid,name){
  viewingUid=uid;viewingName=name;
  sessionStorage.setItem("master_view_uid",uid);
  sessionStorage.setItem("master_view_name",name);
  document.querySelectorAll(".user-card").forEach(c=>c.classList.remove("active","open"));
  const el=document.getElementById("uc-"+uid);if(el)el.classList.add("active","open");
  updateCtxBtn();showToast("✅ 선택됨: "+name);
}
function clearViewing(){
  viewingUid=null;viewingName=null;
  sessionStorage.removeItem("master_view_uid");
  sessionStorage.removeItem("master_view_name");
  document.querySelectorAll(".user-card").forEach(c=>c.classList.remove("active"));
  updateCtxBtn();
}
function setAndGo(uid,name,page){setViewing(uid,name);setTimeout(()=>location.href=page+".html",150);}
function liftBlind(el){el.classList.add("lifted")}
function toggleCard(el){el.closest(".user-card").classList.toggle("open")}

// ── 삭제 ──
function delUser(uid,name){
  showCM("사용자 삭제",`"${name}"을 목록에서 삭제할까요?\n실제 데이터는 삭제되지 않습니다`,()=>{
    usersRef.child(uid).remove()
      .then(()=>{if(viewingUid===uid)clearViewing();showToast("🗑 삭제됨: "+name)})
      .catch(()=>showToast("❗ 삭제 실패"));
  });
}
function showCM(title,msg,cb){
  document.getElementById("cm-title").textContent=title;
  document.getElementById("cm-msg").textContent=msg;
  document.getElementById("cm-ok").onclick=()=>{cb();closeCM();};
  document.getElementById("confirm-modal").classList.add("show");
}
function closeCM(){document.getElementById("confirm-modal").classList.remove("show")}
</script>
