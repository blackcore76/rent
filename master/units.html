<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세대 여는 중… · PlusHome</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
        background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);
        color:#fff;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}
  .box{text-align:center}
  .box .t{font-size:15px;font-weight:700;opacity:.9}
  .box .s{font-size:12px;opacity:.5;margin-top:6px}
</style>
<script>
// 마스터 콘솔의 '세대'는 사용자용 ../units.html 을 열람 모드로 재사용한다.
// master/ 폴더의 옛 데이터뷰 사본은 폐기 — 사용자 페이지 수정이 관리자모드에도
// 자동 반영되도록 중복 관리(드리프트)를 근본 제거. 콘솔(admin.html)이 sessionStorage에 대상 저장.
(function () {
  try {
    var uid  = sessionStorage.getItem('master_view_uid')  || '';
    var name = sessionStorage.getItem('master_view_name') || '';
    if (uid) {
      location.replace('../units.html?master_uid=' + encodeURIComponent(uid) +
                       '&master_name=' + encodeURIComponent(name));
    } else {
      location.replace('admin.html'); // 선택된 사용자 없으면 마스터 콘솔로
    }
  } catch (e) {
    location.replace('../units.html');
  }
})();
</script>
</head>
<body>
  <div class="box">
    <div class="t">🏠 세대 여는 중…</div>
    <div class="s">잠시만 기다려 주세요</div>
  </div>
  <noscript><a href="../units.html" style="color:#7DD3FC">세대로 이동</a></noscript>
</body>
</html>
