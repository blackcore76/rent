<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장부 여는 중… · PlusHome</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
        background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);
        color:#fff;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}
  .box{text-align:center}
  .box .t{font-size:15px;font-weight:700;opacity:.9}
  .box .s{font-size:12px;opacity:.5;margin-top:6px}
</style>
<script>
// 마스터 콘솔의 '장부'는 사용자용 ../expense.html 을 열람 모드로 재사용한다.
// 예전의 master/expense.html 사본은 폐기 — 수지분석·세금도우미 등 최신 기능이
// 사본에 반영되지 않아 화면이 달라지던 중복 관리 문제를 근본 제거하기 위함.
// 대상 사용자는 마스터 콘솔(admin.html)이 sessionStorage에 저장한 값을 사용.
(function () {
  try {
    var uid  = sessionStorage.getItem('master_view_uid')  || '';
    var name = sessionStorage.getItem('master_view_name') || '';
    if (uid) {
      location.replace('../expense.html?master_uid=' + encodeURIComponent(uid) +
                       '&master_name=' + encodeURIComponent(name));
    } else {
      // 선택된 사용자가 없으면 마스터 콘솔로 되돌려 사용자를 먼저 선택하게 함
      location.replace('admin.html');
    }
  } catch (e) {
    location.replace('../expense.html');
  }
})();
</script>
</head>
<body>
  <div class="box">
    <div class="t">🏠 장부 여는 중…</div>
    <div class="s">잠시만 기다려 주세요</div>
  </div>
  <noscript><a href="../expense.html" style="color:#7DD3FC">장부로 이동</a></noscript>
</body>
</html>
