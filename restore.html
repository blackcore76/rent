<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E2D3D">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🏠 월세 관리 · 데이터 복구</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F0F4F8;--card:#fff;--border:#E2E8F0;--text:#1E293B;--sub:#64748B;--hint:#94A3B8;
  --hdr:#1E2D3D;--hdr2:#2A3F55;
  --green:#059669;--green-lt:#D1FAE5;--green-t:#065F46;
  --red:#DC2626;--red-lt:#FEE2E2;--red-t:#991B1B;
  --blue:#0284C7;--blue-lt:#E0F2FE;--blue-t:#0C4A6E;
  --sky:#0EA5E9;--radius:14px
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,var(--hdr),var(--hdr2));box-shadow:0 3px 16px rgba(0,0,0,.25);padding:0 16px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.hdr-actions{display:flex;align-items:center;gap:8px}
.av-img{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;object-fit:cover}
.av-txt{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--sky);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.back-btn{padding:6px 12px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:flex;align-items:center;gap:4px}
/* LOGIN */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);z-index:7000;display:none;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:36px 28px;max-width:320px;width:100%;text-align:center;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{margin-bottom:22px}.login-logo img{width:180px;height:auto;filter:drop-shadow(0 4px 16px rgba(77,208,225,.4))}
.login-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.5px}
.login-sub{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:28px;line-height:1.7}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;background:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;color:#1F2937;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .15s}
.google-btn:active{transform:scale(.97)}.g-icon{width:18px;height:18px;flex-shrink:0}
/* NAV */
.guide-btn{padding:5px 10px;background:rgba(14,165,233,.15);border:1.5px solid rgba(14,165,233,.5);border-radius:8px;color:#7DD3FC;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:background .15s;text-decoration:none;display:flex;align-items:center;gap:3px}
.guide-btn:active{background:rgba(14,165,233,.32)}
.nav{display:flex;border-top:1px solid rgba(255,255,255,.08)}
.nav-tab{flex:1;padding:9px 2px 11px;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,.4);border-bottom:3px solid transparent;text-decoration:none;transition:all .2s;white-space:nowrap}
.nav-tab.on{color:#fff;border-bottom-color:var(--sky);font-weight:700}
/* USER MENU */
.user-menu{position:fixed;top:56px;right:12px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.2);padding:16px;min-width:210px;z-index:300;display:none;border:1px solid var(--border)}
.user-menu.show{display:block}
.um-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.um-email{font-size:12px;color:var(--hint);margin-bottom:12px;word-break:break-all}
.logout-btn{width:100%;padding:9px;background:var(--red-lt);color:var(--red);border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
/* CONTENT */
.content{margin-top:100px;padding:14px;min-height:calc(100vh - 100px)}
.section-hd{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.8px;text-transform:uppercase;margin:20px 0 10px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid var(--border);margin-bottom:12px}
/* BUILDING INFO */
.bld-info{display:flex;align-items:center;gap:10px;background:#EFF6FF;border:1.5px solid #BAE6FD;border-radius:12px;padding:12px 14px;margin-bottom:4px}
.bld-info-name{font-size:14px;font-weight:800;color:var(--blue-t)}
.bld-info-sub{font-size:11px;color:var(--sub);margin-top:2px}
/* DROP ZONE */
.drop-zone{border:2px dashed var(--border);border-radius:14px;padding:36px 20px;text-align:center;cursor:pointer;transition:all .2s;background:#FAFCFF}
.drop-zone.over{border-color:var(--sky);background:#F0F9FF}
.drop-zone.loaded{border-color:var(--green);border-style:solid;background:var(--green-lt)}
.drop-icon{font-size:40px;margin-bottom:10px}
.drop-label{font-size:14px;font-weight:700;color:var(--sub);margin-bottom:4px}
.drop-sub{font-size:12px;color:var(--hint)}
/* PREVIEW */
#preview-card{display:none}
.type-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.5px}
.type-units{background:#EDE9FE;color:#4C1D95}
.type-expense{background:#D1FAE5;color:#065F46}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.preview-item{background:#F8FAFC;border-radius:10px;padding:10px 12px}
.preview-item-label{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.preview-item-val{font-size:18px;font-weight:900;color:var(--text)}
.preview-item-sub{font-size:11px;color:var(--sub);margin-top:1px}
/* MODE */
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode-card{border:2px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all .18s;text-align:center}
.mode-card.selected{border-color:var(--sky);background:#F0F9FF}
.mode-card input[type=radio]{display:none}
.mode-icon{font-size:24px;margin-bottom:6px}
.mode-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:3px}
.mode-desc{font-size:11px;color:var(--sub);line-height:1.5}
/* WARNING */
.warn-box{background:#FEF3C7;border:1.5px solid #FCD34D;border-radius:10px;padding:10px 12px;font-size:12px;color:#92400E;font-weight:600;margin-top:10px;display:none}
/* APPLY BTN */
.apply-btn{width:100%;padding:16px;background:var(--hdr);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:14px;transition:opacity .15s}
.apply-btn:disabled{opacity:.4;cursor:not-allowed}
.apply-btn:not(:disabled):active{opacity:.8}
/* PROGRESS */
#progress-area{display:none;margin-top:14px}
.prog-bar{background:#E2E8F0;border-radius:99px;height:8px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:var(--sky);border-radius:99px;transition:width .4s;width:0%}
.prog-msg{font-size:12px;color:var(--sub);text-align:center}
/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1F2937;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:calc(100vw - 48px);text-align:center;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
/* RESET */
.reset-link{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--hint);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><img src="logo.png" alt="PlusHome"></div>
    <div class="login-title">월세 관리</div>
    <div class="login-sub">임대 현황을 한눈에 관리하세요<br>Google 계정으로 안전하게 로그인</div>
    <button class="google-btn" onclick="signInGoogle()">
      <svg class="g-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 로그인
    </button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-top">
      <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
        <a href="index.html" style="flex-shrink:0;display:flex;align-items:center;line-height:0">
          <img src="logo.png" alt="PlusHome" style="height:40px;width:auto;image-rendering:-webkit-optimize-contrast">
        </a>
      </div>
      <div class="hdr-actions">
        <a class="guide-btn" href="guide.html">❓ 도움말</a>
        <div id="av-wrap" onclick="toggleMenu()" style="display:none"></div>
      </div>
    </div>
    <div class="nav">
      <a href="index.html" class="nav-tab">📊 메인</a>
      <a href="units.html" class="nav-tab">🏠 세대</a>
      <a href="expense.html" class="nav-tab">💸 지출</a>
      <a href="admin.html" class="nav-tab on">🗂 관리</a>
    </div>
  </div>
  <div id="user-menu" class="user-menu">
    <div class="um-name" id="um-name">—</div>
    <div class="um-email" id="um-email">—</div>
    <button class="logout-btn" onclick="auth.signOut().then(()=>location.reload())">🚪 로그아웃</button>
  </div>

  <div class="content">

    <div class="section-hd">현재 건물</div>
    <div class="bld-info">
      <span style="font-size:22px">🏢</span>
      <div>
        <div class="bld-info-name" id="cur-bld-name">—</div>
        <div class="bld-info-sub">이 건물의 데이터에 복구가 적용됩니다</div>
      </div>
    </div>

    <div class="section-hd">JSON 파일 업로드</div>
    <div class="card" style="padding:0">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="drop-icon" id="drop-icon">📂</div>
        <div class="drop-label" id="drop-label">파일을 여기에 드래그하거나 탭하여 선택</div>
        <div class="drop-sub" id="drop-sub">세대 JSON 또는 수지 JSON 지원 · 자동 감지</div>
      </div>
      <input type="file" id="file-input" accept=".json,application/json" style="display:none" onchange="onFileSelect(event)">
    </div>

    <div id="preview-card" class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:14px;font-weight:800;color:var(--text)">파일 미리보기</span>
        <span id="type-badge" class="type-badge"></span>
      </div>
      <div style="font-size:12px;color:var(--hint)" id="file-name-disp"></div>
      <div class="preview-grid" id="preview-grid"></div>

      <div style="font-size:12px;font-weight:700;color:var(--sub);margin-top:16px;margin-bottom:6px">적용 방식</div>
      <div class="mode-row">
        <label class="mode-card selected" id="mode-merge-card" onclick="selectMode('merge')">
          <input type="radio" name="mode" value="merge" checked>
          <div class="mode-icon">🔀</div>
          <div class="mode-title">병합</div>
          <div class="mode-desc">기존 데이터 유지<br>파일 내용으로 덮어씀</div>
        </label>
        <label class="mode-card" id="mode-replace-card" onclick="selectMode('replace')">
          <input type="radio" name="mode" value="replace">
          <div class="mode-icon">♻️</div>
          <div class="mode-title">전체 교체</div>
          <div class="mode-desc">기존 데이터 삭제 후<br>파일 내용으로 교체</div>
        </label>
      </div>
      <div class="warn-box" id="warn-box">⚠️ 전체 교체를 선택하면 현재 건물의 기존 데이터가 모두 삭제됩니다. 신중하게 진행하세요.</div>

      <button class="apply-btn" id="apply-btn" onclick="applyRestore()">✅ 복구 적용하기</button>

      <div id="progress-area">
        <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
        <div class="prog-msg" id="prog-msg">Firebase에 저장 중…</div>
      </div>
    </div>

    <span class="reset-link" id="reset-link" style="display:none" onclick="resetAll()">다른 파일 선택</span>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FC={apiKey:"AIzaSyBHMCPX13coKBA9cu72K4k9WKYQQjVA7IA",authDomain:"rent-4d521.firebaseapp.com",databaseURL:"https://rent-4d521-default-rtdb.firebaseio.com",projectId:"rent-4d521",storageBucket:"rent-4d521.firebasestorage.app",messagingSenderId:"922087443394",appId:"1:922087443394:web:ff78188fc5ab967287645b"};
firebase.initializeApp(FC);
const db=firebase.database(),auth=firebase.auth(),gProv=new firebase.auth.GoogleAuthProvider();
const MASTER_UID='unGRVYWhmcMmEbYbWjAL8Y1pXVP2';
let cu=null,curBid="main",mUid="",mName="";
let parsedData=null,detectedType=null,selectedMode="merge";
let bldgsRef=null,bldgsL=null,bldgsData={};

function getCurBid(uid){return localStorage.getItem("rbid_"+uid)||"main"}
function sortedBids(bd){return Object.keys(bd).sort((a,b)=>(bd[a]?.order||0)-(bd[b]?.order||0))}

// ── AUTH ──
auth.onAuthStateChanged(user=>{
  const ls=document.getElementById("login-screen");
  const app=document.getElementById("app");
  if(user){
    cu=user;
    const w=document.getElementById("av-wrap");
    w.innerHTML=user.photoURL?`<img class="av-img" src="${user.photoURL}">`:`<div class="av-txt">${(user.displayName||"U")[0]}</div>`;
    w.style.display="block";
    const params=new URLSearchParams(location.search);
    mUid=params.get("master_uid")||"";
    mName=params.get("master_name")||"";
    const targetUid=(user.uid===MASTER_UID&&mUid)?mUid:user.uid;
    curBid=getCurBid(targetUid);
    // Load building name
    bldgsRef=db.ref("rent_app/"+targetUid+"/_buildings");
    bldgsL=bldgsRef.on("value",snap=>{
      bldgsData=snap.val()||{};
      const bids=sortedBids(bldgsData);
      if(bids.length&&!bldgsData[curBid]){curBid=bids[0]}
      const name=bldgsData[curBid]?.name||curBid;
      document.getElementById("cur-bld-name").textContent=name;
    });
    document.getElementById("um-name").textContent=user.displayName||"사용자";
    document.getElementById("um-email").textContent=user.email||"";
    ls.style.display="none";app.style.display="block";
  }else{
    cu=null;
    app.style.display="none";ls.style.display="flex";
  }
});

function signInGoogle(){auth.signInWithPopup(gProv).catch(e=>showToast("❗ "+e.message))}
function toggleMenu(){document.getElementById("user-menu").classList.toggle("show")}
document.addEventListener("click",e=>{const m=document.getElementById("user-menu");if(m&&m.classList.contains("show")&&!m.contains(e.target)&&!document.getElementById("av-wrap").contains(e.target))m.classList.remove("show")})

// ── FILE HANDLING ──
function onDragOver(e){e.preventDefault();document.getElementById("drop-zone").classList.add("over")}
function onDragLeave(){document.getElementById("drop-zone").classList.remove("over")}
function onDrop(e){
  e.preventDefault();
  document.getElementById("drop-zone").classList.remove("over");
  const file=e.dataTransfer.files[0];
  if(file)readFile(file);
}
function onFileSelect(e){
  const file=e.target.files[0];
  if(file)readFile(file);
}

function readFile(file){
  if(!file.name.endsWith(".json")){showToast("❗ JSON 파일만 지원합니다");return}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const json=JSON.parse(ev.target.result);
      processJson(json,file.name);
    }catch{showToast("❗ 파일을 읽을 수 없습니다 (JSON 형식 오류)")}
  };
  reader.readAsText(file,"UTF-8");
}

function detectType(json){
  if(Array.isArray(json)&&json[0]&&"amount" in json[0]&&"type" in json[0])return "expense";
  if(json&&Array.isArray(json.units)&&json.rentHistory!==undefined)return "units";
  return null;
}

function processJson(json,fileName){
  const type=detectType(json);
  if(!type){showToast("❗ 지원하지 않는 파일 형식입니다");return}
  parsedData=json;detectedType=type;
  // Update drop zone
  const dz=document.getElementById("drop-zone");
  dz.classList.add("loaded");
  document.getElementById("drop-icon").textContent=type==="units"?"🏠":"💸";
  document.getElementById("drop-label").textContent=fileName;
  document.getElementById("drop-sub").textContent="파일 인식 완료";
  // Badge
  const badge=document.getElementById("type-badge");
  badge.textContent=type==="units"?"세대 데이터":"수지 데이터";
  badge.className="type-badge "+(type==="units"?"type-units":"type-expense");
  document.getElementById("file-name-disp").textContent=fileName;
  // Preview stats
  renderPreview(json,type);
  document.getElementById("preview-card").style.display="block";
  document.getElementById("reset-link").style.display="block";
}

function renderPreview(json,type){
  const grid=document.getElementById("preview-grid");
  if(type==="units"){
    const units=json.units||[];
    const rented=units.filter(u=>u.status==="rented").length;
    const vacant=units.filter(u=>u.status!=="rented").length;
    const histRooms=Object.keys(json.rentHistory||{}).length;
    const expAt=json.exportedAt?new Date(json.exportedAt).toLocaleDateString("ko-KR"):"—";
    grid.innerHTML=`
      <div class="preview-item"><div class="preview-item-label">총 세대</div><div class="preview-item-val">${units.length}</div><div class="preview-item-sub">세대</div></div>
      <div class="preview-item"><div class="preview-item-label">임대중 / 공실</div><div class="preview-item-val">${rented} / ${vacant}</div><div class="preview-item-sub">세대</div></div>
      <div class="preview-item"><div class="preview-item-label">납부 이력</div><div class="preview-item-val">${histRooms}</div><div class="preview-item-sub">세대 분</div></div>
      <div class="preview-item"><div class="preview-item-label">백업 일시</div><div class="preview-item-val" style="font-size:13px">${expAt}</div><div class="preview-item-sub"></div></div>`;
  }else{
    const list=json;
    const income=list.filter(t=>t.type==="income").reduce((s,t)=>s+(t.amount||0),0);
    const expense=list.filter(t=>t.type!=="income").reduce((s,t)=>s+(t.amount||0),0);
    const dates=list.map(t=>t.date).sort();
    const range=dates.length?(dates[0]+" ~ "+dates[dates.length-1]):"—";
    grid.innerHTML=`
      <div class="preview-item"><div class="preview-item-label">총 건수</div><div class="preview-item-val">${list.length}</div><div class="preview-item-sub">건</div></div>
      <div class="preview-item"><div class="preview-item-label">수입 / 지출</div><div class="preview-item-val" style="font-size:13px">${list.filter(t=>t.type==="income").length} / ${list.filter(t=>t.type!=="income").length}</div><div class="preview-item-sub">건</div></div>
      <div class="preview-item"><div class="preview-item-label">수입 합계</div><div class="preview-item-val" style="font-size:13px">+${fmtN(income)}</div><div class="preview-item-sub">원</div></div>
      <div class="preview-item"><div class="preview-item-label">날짜 범위</div><div class="preview-item-val" style="font-size:11px;word-break:break-all">${range}</div><div class="preview-item-sub"></div></div>`;
  }
}

function selectMode(mode){
  selectedMode=mode;
  document.getElementById("mode-merge-card").classList.toggle("selected",mode==="merge");
  document.getElementById("mode-replace-card").classList.toggle("selected",mode==="replace");
  document.getElementById("warn-box").style.display=mode==="replace"?"block":"none";
}

// ── APPLY ──
async function applyRestore(){
  if(!parsedData||!detectedType){showToast("❗ 파일을 먼저 선택하세요");return}
  if(!cu){showToast("❗ 로그인이 필요합니다");return}
  const targetUid=(cu.uid===MASTER_UID&&mUid)?mUid:cu.uid;
  const btn=document.getElementById("apply-btn");
  const prog=document.getElementById("progress-area");
  const fill=document.getElementById("prog-fill");
  const msg=document.getElementById("prog-msg");

  btn.disabled=true;
  prog.style.display="block";
  fill.style.width="10%";

  try{
    if(detectedType==="units"){
      await applyUnits(targetUid,fill,msg);
    }else{
      await applyExpense(targetUid,fill,msg);
    }
    fill.style.width="100%";
    msg.textContent="완료!";
    showToast("✅ 복구가 완료됐습니다");
    btn.disabled=false;
  }catch(e){
    msg.textContent="오류: "+e.message;
    showToast("❗ 복구 실패: "+e.message);
    btn.disabled=false;
  }
}

async function applyUnits(uid,fill,msg){
  const base=`rent_app/${uid}/${curBid}`;
  // Convert units array → object keyed by room
  const unitsObj={};
  (parsedData.units||[]).forEach(u=>{if(u&&u.room)unitsObj[u.room]=u});
  msg.textContent="세대 데이터 저장 중…";fill.style.width="30%";
  if(selectedMode==="replace"){
    await db.ref(base+"/units").set(unitsObj);
    fill.style.width="60%";
    msg.textContent="납부 이력 저장 중…";
    await db.ref(base+"/rent_history").set(parsedData.rentHistory||{});
  }else{
    await db.ref(base+"/units").update(unitsObj);
    fill.style.width="60%";
    msg.textContent="납부 이력 저장 중…";
    const hist=parsedData.rentHistory||{};
    const histFlat={};
    // Flatten to room/ym paths for update
    Object.keys(hist).forEach(room=>{
      Object.keys(hist[room]||{}).forEach(ym=>{
        histFlat[`${room}/${ym}`]=hist[room][ym];
      });
    });
    if(Object.keys(histFlat).length)await db.ref(base+"/rent_history").update(histFlat);
  }
  fill.style.width="90%";
}

async function applyExpense(uid,fill,msg){
  const base=`rent_app/${uid}/${curBid}/transactions`;
  const txObj={};
  (parsedData||[]).forEach(t=>{if(t&&t.id)txObj[String(t.id)]=t});
  msg.textContent="수지 데이터 저장 중…";fill.style.width="40%";
  if(selectedMode==="replace"){
    await db.ref(base).set(txObj);
  }else{
    await db.ref(base).update(txObj);
  }
  fill.style.width="90%";
}

function resetAll(){
  parsedData=null;detectedType=null;selectedMode="merge";
  const dz=document.getElementById("drop-zone");
  dz.classList.remove("loaded","over");
  document.getElementById("drop-icon").textContent="📂";
  document.getElementById("drop-label").textContent="파일을 여기에 드래그하거나 탭하여 선택";
  document.getElementById("drop-sub").textContent="세대 JSON 또는 수지 JSON 지원 · 자동 감지";
  document.getElementById("preview-card").style.display="none";
  document.getElementById("progress-area").style.display="none";
  document.getElementById("prog-fill").style.width="0%";
  document.getElementById("warn-box").style.display="none";
  document.getElementById("apply-btn").disabled=false;
  document.getElementById("reset-link").style.display="none";
  document.getElementById("file-input").value="";
  selectMode("merge");
}

function fmtN(n){return(n||0).toLocaleString("ko-KR")}
let _toastTimer;
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove("show"),3000);
}
</script>
