<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E2D3D">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>🏠 월세 관리 · 세대</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
:root{
  --bg:#F0F4F8;--card:#fff;--border:#E2E8F0;--text:#1E293B;--sub:#64748B;--hint:#94A3B8;
  --hdr:#1E2D3D;--hdr2:#2A3F55;
  --green:#059669;--green-lt:#D1FAE5;--green-t:#065F46;
  --red:#DC2626;--red-lt:#FEE2E2;--red-t:#991B1B;
  --blue:#0284C7;--blue-lt:#E0F2FE;--blue-t:#0C4A6E;
  --indigo:#4F46E5;--indigo-lt:#EEF2FF;--indigo-t:#3730A3;
  --sky:#0EA5E9;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,var(--hdr),var(--hdr2));box-shadow:0 3px 16px rgba(0,0,0,.25);padding:0 16px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.hdr-title{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.5px}
.hdr-actions{display:flex;align-items:center;gap:8px;position:relative}
.av-img{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;object-fit:cover}
.av-txt{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--sky);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.guide-btn{padding:5px 10px;background:rgba(14,165,233,.15);border:1.5px solid rgba(14,165,233,.5);border-radius:8px;color:#7DD3FC;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:background .15s;text-decoration:none;display:flex;align-items:center;gap:3px}
.guide-btn:active{background:rgba(14,165,233,.32)}
.nav{display:flex;border-top:1px solid rgba(255,255,255,.08)}
.nav-tab{flex:1;padding:9px 2px 11px;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,.4);border-bottom:3px solid transparent;text-decoration:none;transition:all .2s;white-space:nowrap}
.nav-tab.on{color:#fff;border-bottom-color:var(--sky);font-weight:700}
.user-menu{position:fixed;top:56px;right:12px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.2);padding:16px;min-width:210px;z-index:300;display:none;border:1px solid var(--border)}
.user-menu.show{display:block}
.um-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.um-email{font-size:12px;color:var(--hint);margin-bottom:12px;word-break:break-all}
.logout-btn{width:100%;padding:9px;background:var(--red-lt);color:var(--red);border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.content{margin-top:100px;padding:14px;min-height:calc(100vh - 100px)}
.floor-tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.tabs-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.export-btn{padding:7px 12px;border-radius:20px;border:2px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:var(--sub);font-family:inherit;white-space:nowrap;flex-shrink:0;transition:all .15s}
.export-btn:active{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.badge-oneroom{background:#FEF3C7;color:#92400E}
.badge-twobay{background:#F3E8FF;color:#6B21A8}
.badge-tworoom{background:#CCFBF1;color:#0F766E}
.badge-threeroom{background:#EEF2FF;color:#3730A3}
.tg-btn.on-rtype{background:var(--sky);color:#fff}
.floor-tab{padding:6px 14px;border-radius:20px;border:2px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--sub);font-family:inherit;white-space:nowrap;transition:all .15s}
.floor-tab.on{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.rooms-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:600px){.rooms-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.room-card{background:var(--card);border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;border:2px solid transparent;min-width:0;overflow:hidden}
.room-card:active{transform:scale(.97)}
.room-card.status-vacant{border-color:var(--indigo-lt)}
.room-card.status-rented{border-color:var(--blue-lt)}
.rc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rc-num{font-size:18px;font-weight:900;color:var(--hdr)}
.rc-sbadge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.badge-rented{background:var(--blue-lt);color:var(--blue-t)}
.badge-vacant{background:var(--red-lt);color:var(--red-t)}
.badge-paid{background:var(--green-lt);color:var(--green-t)}
.badge-unpaid{background:var(--red-lt);color:var(--red-t)}
.rc-names{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-phones{font-size:11px;color:var(--sub);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-rent{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.rc-memo{font-size:11px;color:var(--hint);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-paid{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:540px;box-shadow:0 -4px 32px rgba(0,0,0,.2);max-height:94vh;overflow-y:auto}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-hd h3{font-size:17px;font-weight:900;color:var(--hdr)}
.sheet-close{width:32px;height:32px;border:none;background:#F3F4F6;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tg-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;margin-top:14px}
.toggle-group{display:flex;border:2px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:2px}
.tg-btn{flex:1;padding:10px 8px;border:none;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--sub);transition:all .15s}
.tg-btn.on-blue{background:var(--blue);color:#fff}
.tg-btn.on-gray{background:var(--indigo);color:#fff}
.tg-btn.on-amber{background:#D97706;color:#fff}
.badge-monthly{background:#FFF7ED;color:#C2410C}
.badge-jeonse{background:#EDE9FE;color:#5B21B6}
.divider{height:1px;background:var(--border);margin:16px 0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea{border:2px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;color:var(--text);background:#FAFCFF;width:100%;transition:border-color .2s}
.field input:focus,.field textarea:focus{border-color:var(--sky);background:#fff}
.field textarea{resize:none}
.section-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:14px;display:flex;align-items:center;gap:4px}
.sheet-btn-row{display:flex;gap:10px;margin-top:4px}
.btn-save{flex:7;padding:15px;background:var(--hdr);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.85}
.btn-close-sheet{flex:3;padding:15px;background:#F1F5F9;color:var(--sub);border:2px solid var(--border);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-close-sheet:active{background:#E2E8F0}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rent-hist-wrap{margin-bottom:4px}
.rent-hist-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:6px}
.rh-cell{border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;transition:transform .1s,opacity .1s;user-select:none;-webkit-user-select:none}
.rh-cell:active{transform:scale(.92);opacity:.75}
.rh-month{font-size:9px;font-weight:700;color:inherit;opacity:.7;margin-bottom:3px}
.rh-icon{font-size:13px;line-height:1}
.rh-paid{background:var(--green-lt);color:var(--green-t)}
.rh-unpaid{background:var(--red-lt);color:var(--red-t)}
.rh-none{background:#F1F5F9;color:var(--hint)}
.rh-legend{display:flex;gap:10px;font-size:10px;color:var(--hint);margin-top:2px;flex-wrap:wrap}
.rh-tip{font-size:10px;color:var(--sky);margin-top:4px;text-align:center;font-weight:600}
.rc-dday{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;display:inline-block;margin-bottom:4px}
.dday-safe{background:#D1FAE5;color:#065F46}
.dday-warn{background:#FEF3C7;color:#92400E}
.dday-danger{background:#FEE2E2;color:#991B1B}
.dday-expired{background:#F1F5F9;color:#64748B}
.filter-banner{display:flex;align-items:center;justify-content:space-between;background:var(--hdr);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600}
.filter-clear{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.ph-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#F0F4F8}
.ph-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.ph-del{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upload-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:2px dashed var(--border);border-radius:10px;background:#FAFCFF;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.upload-btn:hover{border-color:var(--sky);color:var(--sky)}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}
.photo-btn-row{display:flex;gap:8px}
.photo-btn-row .upload-btn{flex:1;width:auto;font-size:12px;padding:11px 6px;text-align:center}
.camera-btn{border-color:var(--sky);color:var(--sky)}
.prog-bar{height:22px;border-radius:11px;background:#E2E8F0;margin-top:10px;overflow:hidden;display:none;position:relative}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));transition:width .25s;width:0%}
.prog-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--hdr);letter-spacing:.3px}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:900;display:none;align-items:center;justify-content:center}
#pv.show{display:flex}
#pv img{max-width:95%;max-height:90vh;border-radius:8px;object-fit:contain}
#pv-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:20px;padding:24px;max-width:340px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.confirm-box h3{font-size:15px;font-weight:700;color:var(--hdr);margin-bottom:10px}
.confirm-box p{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6}
.confirm-btns{display:flex;gap:10px;justify-content:flex-end}
.confirm-btns button{padding:9px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1F2937;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);z-index:7000;display:none;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:36px 28px;max-width:320px;width:100%;text-align:center;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{font-size:52px;margin-bottom:14px}
.login-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.5px}
.login-sub{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:28px;line-height:1.7}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;background:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;color:#1F2937;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .15s}
.google-btn:active{transform:scale(.97)}
.g-icon{width:18px;height:18px;flex-shrink:0}
.login-footer{font-size:10px;color:rgba(255,255,255,.25);margin-top:18px;line-height:1.7}
.bld-item{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);transition:background .12s}
.bld-item:active{background:#F0F4F8}
.bld-item.cur{color:var(--sky)}
.bld-sep{height:1px;background:var(--border);margin:4px 0}
.bld-subhd{font-size:11px;font-weight:800;color:var(--sub);padding:10px 4px 4px;letter-spacing:.5px;border-top:1px solid var(--border);margin-top:4px}
.bld-subhd:first-child{border-top:none;padding-top:4px;margin-top:0}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🏠</div>
    <div class="login-title">월세 관리</div>
    <div class="login-sub">임대 현황을 한눈에 관리하세요<br>Google 계정으로 안전하게 로그인</div>
    <button class="google-btn" onclick="signInGoogle()">
      <svg class="g-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 로그인
    </button>
    <div class="login-footer">데이터는 본인 Google 계정에만 저장됩니다</div>
  </div>
</div>

<div id="status-screen" style="display:none;position:fixed;inset:0;background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);z-index:7000;align-items:center;justify-content:center;padding:20px">
  <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:36px 28px;max-width:320px;width:100%;text-align:center;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="font-size:52px;margin-bottom:14px" id="ss-icon">⏳</div>
    <div style="font-size:20px;font-weight:900;color:#fff;margin-bottom:8px" id="ss-title"></div>
    <div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;line-height:1.7;white-space:pre-line" id="ss-msg"></div>
    <div style="font-size:11px;color:rgba(255,255,255,.3);margin-bottom:24px" id="ss-email"></div>
    <button onclick="auth.signOut().then(()=>location.reload())" style="width:100%;padding:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">로그아웃</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-top">
      <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
        <a href="index.html" style="flex-shrink:0;display:flex;align-items:center;line-height:0">
          <img src="logo.png" alt="PlusHome" style="height:40px;width:auto;image-rendering:-webkit-optimize-contrast">
        </a>
      </div>
      <div class="hdr-actions">
        <a class="guide-btn" href="guide.html#sec1">❓ 도움말</a>
        <div id="av-wrap" onclick="toggleMenu()" style="display:none"></div>
      </div>
    </div>
    <div class="nav">
      <a href="index.html" class="nav-tab">📊 메인</a>
      <a href="units.html" class="nav-tab on">🏠 세대</a>
      <a href="expense.html" class="nav-tab">💸 지출</a>
      <a href="admin.html" class="nav-tab">🗂 관리</a>
    </div>
  </div>
  <div id="user-menu" class="user-menu">
    <div class="um-name" id="um-name">—</div>
    <div class="um-email" id="um-email">—</div>
    <button class="logout-btn" onclick="doSignOut()">🚪 로그아웃</button>
  </div>
  <div class="content">
    <div class="tabs-row">
      <div class="floor-tabs" id="floor-tabs">
        <!-- 동적 생성 -->
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;align-self:flex-start">
        <button class="export-btn" onclick="exportCSV()">📥 CSV</button>
        <button class="export-btn" onclick="exportJSON()">📦 JSON</button>
      </div>
    </div>
    <div id="filter-banner" style="display:none" class="filter-banner">
      <span id="filter-banner-txt"></span>
      <button class="filter-clear" onclick="clearFilter()">✕ 필터 해제</button>
    </div>
    <div class="rooms-grid" id="rooms-grid"></div>
  </div>
</div>

<!-- ROOM SHEET -->
<div class="sheet-bg" id="room-sheet">
  <div class="sheet">
    <div class="sheet-hd">
      <h3 id="sheet-title">— 호</h3>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <input type="hidden" id="m-room">
    <div class="tg-label">임대 구조</div>
    <div class="toggle-group">
      <button class="tg-btn on-rtype" id="tg-oneroom" onclick="setRoomType('oneroom')">원룸</button>

function getCurBid(uid){return localStorage.getItem("rbid_"+uid)||"main"}
function setCurBid(uid,bid){localStorage.setItem("rbid_"+uid,bid)}
function sortedBids(bd){return Object.keys(bd).sort((a,b)=>(bd[a]?.order||0)-(bd[b]?.order||0))}

// ── MIGRATION ──
async function migrateToMultiBldg(uid){
  if(localStorage.getItem("mig_"+uid))return;
  const snap=await db.ref("rent_app/"+uid+"/_buildings").once("value");
  if(snap.exists()){localStorage.setItem("mig_"+uid,"1");return;}
  let bname=localStorage.getItem("rent_aptname")||"내 건물";
  try{
    const bs=await db.ref("rent_app/"+uid+"/buildings").once("value");
    if(bs.exists()){const v=Object.values(bs.val());if(v.length&&v[0]?.name)bname=v[0].name}
  }catch(e){}
  const OLD=["units","rent_history","config","transactions","notes","buildings"];
  for(const p of OLD){
    try{
      const s=await db.ref("rent_app/"+uid+"/"+p).once("value");
      if(s.exists()){
        await db.ref("rent_app/"+uid+"/main/"+p).set(s.val());
        await db.ref("rent_app/"+uid+"/"+p).remove();
      }
    }catch(e){}
  }
  await db.ref("rent_app/"+uid+"/_buildings/main").set({id:"main",name:bname,order:0,createdAt:new Date().toISOString()});
  localStorage.setItem("mig_"+uid,"1");
}

function applyLayout(layout){
  ROOMS=[];FLOORS=[];
  Object.keys(layout).sort((a,b)=>Number(a)-Number(b)).forEach(f=>{
    FLOORS.push(Number(f));(layout[f]||[]).forEach(r=>ROOMS.push(String(r)));
  });
  renderFloorTabs();
}
function renderFloorTabs(){
  const el=document.getElementById("floor-tabs");if(!el)return;
  el.innerHTML=`<button class="floor-tab ${curFloor===0?"on":""}" onclick="setFloor(0,this)">전체</button>`+
    FLOORS.map(f=>`<button class="floor-tab ${curFloor===f?"on":""}" onclick="setFloor(${f},this)">${f}층</button>`).join("");
}

async function checkUserAccess(user){
  const ref=db.ref("_users/"+user.uid);
  const snap=await ref.once("value");
  let status;
  if(!snap.exists()){
    await ref.set({uid:user.uid,displayName:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"",status:"pending",createdAt:new Date().toISOString()});
    status="pending";
  }else{
    status=snap.val().status||"pending";
  }
  if(status==="active")return true;
  const ss=document.getElementById("status-screen");
  document.getElementById("ss-email").textContent=user.email||"";
  if(status==="rejected"){
    document.getElementById("ss-icon").textContent="🚫";
    document.getElementById("ss-title").textContent="사용 승인이 거부됐습니다";
    document.getElementById("ss-msg").textContent="자세한 사항은 관리자에게 문의하세요.";
  }else{
    document.getElementById("ss-icon").textContent="⏳";
    document.getElementById("ss-title").textContent="승인 대기 중";
    document.getElementById("ss-msg").textContent="관리자가 계정을 확인 후 승인합니다.\n승인 완료 후 다시 로그인해 주세요.";
  }
  ss.style.display="flex";
  return false;
}

  const ls=document.getElementById("login-screen");

  if(user){
    cu=user;
    if(user.uid!==MASTER_UID){const ok=await checkUserAccess(user);if(!ok)return;}

    if(uL&&uRef)uRef.off("value",uL);
    if(hL&&hRef)hRef.off("value",hL);
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);

    // ★ 관리자가 다른 사용자 페이지를 열람하는 경우
    const params=new URLSearchParams(location.search);

    const targetUid=(user.uid===MASTER_UID&&mUid)?mUid:user.uid;

      banner.innerHTML=`<span style="font-size:12px;font-weight:700;color:#F59E0B">🔧 열람 중: ${esc(mName||mUid)}</span><button onclick="location.href='admin-master.html'" style="font-size:11px;font-weight:700;background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#F59E0B;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit">← 관리자 페이지</button>`;
      document.body.appendChild(banner);
      document.querySelector(".content").style.marginTop="136px";
      document.querySelectorAll(".nav-tab").forEach(a=>{
        const u=new URL(a.href,location.href);
        u.searchParams.set("master_uid",mUid);
        u.searchParams.set("master_name",mName||"");
        a.href=u.pathname+"?"+u.searchParams.toString();
      });
    }

    // Migration (only for own account)
    if(user.uid===targetUid){
      try{await migrateToMultiBldg(user.uid)}catch(e){}
    }
    curBid=getCurBid(targetUid);

    ls.style.display="none";app.style.display="block";

    // Load building registry for switcher
    bldgsRef=db.ref("rent_app/"+targetUid+"/_buildings");
    bldgsL=bldgsRef.on("value",snap=>{
      bldgsData=snap.val()||{};
      const bids=sortedBids(bldgsData);
      if(bids.length&&!bldgsData[curBid]){curBid=bids[0];setCurBid(targetUid,curBid)}
    });

    configRef=db.ref(`rent_app/${targetUid}/${curBid}/config/roomLayout`);
    uRef=db.ref(`rent_app/${targetUid}/${curBid}/units`);
    hRef=db.ref(`rent_app/${targetUid}/${curBid}/rent_history`);
    configRef.once("value").then(snap=>{
      applyLayout(snap.val()||DEFAULT_LAYOUT);
      listenUnits();listenHistory();
    }).catch(()=>{applyLayout(DEFAULT_LAYOUT);listenUnits();listenHistory();});
  }else{
    cu=null;app.style.display="none";ls.style.display="flex";
    if(uL&&uRef)uRef.off("value",uL);
    if(hL&&hRef)hRef.off("value",hL);
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
  }
});
function signInGoogle(){auth.signInWithPopup(gProv).catch(e=>showToast("❗ "+e.message))}
function doSignOut(){
  closeMenu();
  if(uL&&uRef)uRef.off("value",uL);
  if(hL&&hRef)hRef.off("value",hL);

function toggleMenu(){document.getElementById("user-menu").classList.toggle("show")}
function closeMenu(){document.getElementById("user-menu").classList.remove("show")}
document.addEventListener("click",e=>{if(!e.target.closest("#av-wrap")&&!e.target.closest("#user-menu"))closeMenu()});

let _unitsReady=false,_historyReady=false;
function listenUnits(){
  uL=uRef.on("value",snap=>{
    const val=snap.val()||{};ensureRooms(val);units=val;
    _unitsReady=true;renderGrid();tryOpenURLParam();
  },()=>showToast("❗ 연결 오류"));
}
function listenHistory(){
  hL=hRef.on("value",snap=>{
    rentHistory=snap.val()||{};
    _historyReady=true;renderGrid();tryOpenURLParam();
  },()=>{});
}
let _urlOpened=false;
function tryOpenURLParam(){
  if(_urlOpened||!_unitsReady||!_historyReady)return;
  _urlOpened=true;
  const params=new URLSearchParams(location.search);
  const room=params.get("room"),filter=params.get("filter");
  if(filter){
    curFilter=filter;
    const labels={rented:"임대중만 보기",vacant:"공실만 보기",unpaid:"미납 세대만 보기"};
    document.getElementById("filter-banner-txt").textContent="🔍 "+(labels[filter]||filter);
    document.getElementById("filter-banner").style.display="flex";renderGrid();
  }
  if(room&&units[room])openSheet(room);
}
function getLastNMonths(n){
  const res=[],now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    res.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  return res;
}
function renderHistory(roomId){
  const months=getLastNMonths(12),roomH=rentHistory[roomId]||{};
  const el=document.getElementById("rent-hist-grid");if(!el)return;
  el.innerHTML=months.map(ym=>{
    const rec=roomH[ym],cls=rec?(rec.paid?"rh-paid":"rh-unpaid"):"rh-none";
    const icon=rec?(rec.paid?"✅":"❌"):"—",mLabel=ym.split("-")[1]+"월";
    const amtTitle=rec&&rec.amount?" · "+rec.amount.toLocaleString()+"원":"";
    return`<div class="rh-cell ${cls}" onclick="toggleHistory('${roomId}','${ym}')" title="${ym}${amtTitle}">
      <div class="rh-month">${mLabel}</div><div class="rh-icon">${icon}</div></div>`;
  }).join("");
}
function toggleHistory(roomId,ym){
  if(!hRef||!cu)return;
  const rec=(rentHistory[roomId]||{})[ym],u=units[roomId];
  const rentAmt=(u&&u.monthlyRent?u.monthlyRent:0)*10000;
  let nextData=null;
  if(!rec) nextData={room:roomId,yearMonth:ym,paid:true,amount:rentAmt,updatedAt:new Date().toISOString()};
  else if(rec.paid) nextData={room:roomId,yearMonth:ym,paid:false,amount:rentAmt,updatedAt:new Date().toISOString()};
  const ref=hRef.child(`${roomId}/${ym}`);
  (nextData?ref.set(nextData):ref.remove()).then(()=>{
    if(!rentHistory[roomId])rentHistory[roomId]={};
    if(nextData)rentHistory[roomId][ym]=nextData;else delete rentHistory[roomId][ym];
    renderHistory(roomId);renderGrid();
    showToast(nextData===null?"🗑 기록 삭제됨":nextData.paid?"✅ 완납 기록됨":"❌ 미납 기록됨");
  }).catch(()=>showToast("❗ 저장 실패"));
}
async function ensureRooms(ex){
  const up={};ROOMS.forEach(r=>{if(!ex[String(r)])up[String(r)]=defRoom(r)});
  if(Object.keys(up).length)await uRef.update(up);
}
function defRoom(r){return{room:String(r),floor:Math.floor(parseInt(r)/100),status:"vacant",roomType:"oneroom",rentType:"monthly",tenantName:"",tenantName2:"",tenantPhone:"",tenantPhone2:"",depositAmount:0,monthlyRent:0,contractStart:"",contractEnd:"",rentPaid:false,memo:""}}
function setFloor(f,btn){
  curFloor=f;document.querySelectorAll(".floor-tab").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");renderGrid();
}
function computePaidStatus(roomId){
  const recs=Object.values(rentHistory[roomId]||{});
  if(!recs.length)return null;
  return recs.some(r=>!r.paid)?false:true;
}
const RTYPE_LBL={oneroom:"원룸",twobay:"투베이",tworoom:"투룸",threeroom:"쓰리룸"};
const RTYPE_CLS={oneroom:"badge-oneroom",twobay:"badge-twobay",tworoom:"badge-tworoom",threeroom:"badge-threeroom"};
const RENT_TYPE_LBL={monthly:"월세",jeonse:"전세"};
const RENT_TYPE_CLS={monthly:"badge-monthly",jeonse:"badge-jeonse"};
function renderGrid(){
  let list=ROOMS.map(r=>units[String(r)]).filter(u=>u&&(curFloor===0||u.floor===curFloor));
  if(curFilter==="rented") list=list.filter(u=>u.status==="rented");
  else if(curFilter==="vacant") list=list.filter(u=>u.status==="vacant");
  else if(curFilter==="unpaid") list=list.filter(u=>u.status==="rented"&&computePaidStatus(u.room)===false);
  document.getElementById("rooms-grid").innerHTML=list.map(u=>{
    const isR=u.status==="rented";
    const namesTxt=[u.tenantName,u.tenantName2].filter(Boolean).join(" / ")||"공실";
    const phonesTxt=[u.tenantPhone,u.tenantPhone2].filter(Boolean).join(" / ");
    const memoTxt=u.memo?truncate(u.memo,22):"";
    const sBadge=`<span class="rc-sbadge ${isR?"badge-rented":"badge-vacant"}">${isR?"임대중":"공실"}</span>`;
    const rtLbl=RTYPE_LBL[u.roomType]||"";
    const rtBadge=rtLbl?`<span class="rc-sbadge ${RTYPE_CLS[u.roomType]||""}">${rtLbl}</span>`:"";
    const rentTypeLbl=RENT_TYPE_LBL[u.rentType||"monthly"];
    const rentTypeBadge=`<span class="rc-sbadge ${RENT_TYPE_CLS[u.rentType||"monthly"]}">${rentTypeLbl}</span>`;
    const rentTxt=isR&&u.monthlyRent?fmtWon(u.monthlyRent)+"/월":"—";
    let pBadge="";
    if(isR){const ps=computePaidStatus(u.room);
      if(ps===false) pBadge=`<span class="rc-paid badge-unpaid">❌ 미납</span>`;
      else if(ps===true) pBadge=`<span class="rc-paid badge-paid">✅ 완납</span>`;
      else pBadge=`<span class="rc-paid" style="background:#F1F5F9;color:var(--hint)">— 이력없음</span>`;}
    let ddayHtml="";
    if(isR&&u.contractEnd){
      const today=new Date();today.setHours(0,0,0,0);
      const end=new Date(u.contractEnd);end.setHours(0,0,0,0);
      const diff=Math.ceil((end-today)/864e5);
      if(diff<0) ddayHtml=`<span class="rc-dday dday-expired">만료 ${Math.abs(diff)}일 초과</span>`;
      else if(diff<=7) ddayHtml=`<span class="rc-dday dday-danger">D-${diff}</span>`;
      else if(diff<=30) ddayHtml=`<span class="rc-dday dday-warn">D-${diff}</span>`;
      else ddayHtml=`<span class="rc-dday dday-safe">D-${diff}</span>`;}
    return`<div class="room-card status-${u.status}" onclick="openSheet('${u.room}')">
      <div class="rc-top"><span class="rc-num">${u.room}호</span><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${rentTypeBadge}${rtBadge}${sBadge}</div></div>
      <div class="rc-names">${esc(namesTxt)}</div>
      ${phonesTxt?`<div class="rc-phones">📞 ${esc(phonesTxt)}</div>`:""}
      <div class="rc-rent">${rentTxt}</div>
      ${memoTxt?`<div class="rc-memo">💬 ${esc(memoTxt)}</div>`:""}
      ${ddayHtml}${pBadge}</div>`;
  }).join("");
}
function openSheet(roomId){
  const u=units[roomId];if(!u)return;
  curRoom=roomId;
  document.getElementById("sheet-title").textContent=`${roomId}호`;
  document.getElementById("m-room").value=roomId;
  mStatus=u.status||"vacant";
  mRoomType=u.roomType||"oneroom";
  mRentType=u.rentType||"monthly";
  document.getElementById("m-name").value=u.tenantName||"";
  document.getElementById("m-phone").value=u.tenantPhone||"";
  document.getElementById("m-name2").value=u.tenantName2||"";
  document.getElementById("m-phone2").value=u.tenantPhone2||"";
  document.getElementById("m-deposit").value=u.depositAmount||"";
  document.getElementById("m-rent").value=u.monthlyRent||"";
  document.getElementById("m-start").value=u.contractStart||"";
  document.getElementById("m-end").value=u.contractEnd||"";
  document.getElementById("m-memo").value=u.memo||"";
  updateTgUI();updateRtypeUI();updateRentTypeUI();renderPhotos(u.photos||{});renderHistory(roomId);
  document.getElementById("room-sheet").classList.add("show");
}
function closeSheet(){document.getElementById("room-sheet").classList.remove("show");curRoom=null}
function setStatus(s){mStatus=s;updateTgUI()}
function updateTgUI(){
  document.getElementById("tg-rented").className="tg-btn"+(mStatus==="rented"?" on-blue":"");
  document.getElementById("tg-vacant").className="tg-btn"+(mStatus==="vacant"?" on-gray":"");
}
function setRentType(t){mRentType=t;updateRentTypeUI()}
function updateRentTypeUI(){
  document.getElementById("tg-monthly").className="tg-btn"+(mRentType==="monthly"?" on-amber":"");
  document.getElementById("tg-jeonse").className="tg-btn"+(mRentType==="jeonse"?" on-gray":"");
}
function setRoomType(t){mRoomType=t;updateRtypeUI()}
function updateRtypeUI(){
  ["oneroom","twobay","tworoom","threeroom"].forEach(t=>{
    const el=document.getElementById("tg-"+t);
    if(el)el.className="tg-btn"+(mRoomType===t?" on-rtype":"");
  });
}
function saveRoom(){
  if(!curRoom)return;
  const data={room:curRoom,floor:Math.floor(parseInt(curRoom)/100),status:mStatus,roomType:mRoomType,rentType:mRentType,
    tenantName:document.getElementById("m-name").value.trim(),
    tenantName2:document.getElementById("m-name2").value.trim(),
    tenantPhone:document.getElementById("m-phone").value.trim(),
    tenantPhone2:document.getElementById("m-phone2").value.trim(),
    depositAmount:parseInt(document.getElementById("m-deposit").value)||0,
    monthlyRent:parseInt(document.getElementById("m-rent").value)||0,
    contractStart:document.getElementById("m-start").value,
    contractEnd:document.getElementById("m-end").value,
    memo:document.getElementById("m-memo").value.trim()};
  const ex=units[curRoom]||{};if(ex.photos)data.photos=ex.photos;
  uRef.child(curRoom).update(data)
    .then(()=>{closeSheet();showToast("✅ 저장됨");renderGrid()})
    .catch(()=>showToast("❗ 저장 실패"));
}
function renderPhotos(photos){
  const list=Object.values(photos||{}).sort((a,b)=>a.id-b.id);
  document.getElementById("photo-grid").innerHTML=list.map(p=>`
    <div class="ph-thumb"><img src="${p.url}" onclick="openPV('${p.url}')" loading="lazy">
    <button class="ph-del" onclick="delPhoto('${p.id}','${esc(p.storagePath)}')">✕</button></div>`).join("");
}
async function onPhotos(e){
  const files=Array.from(e.target.files);
  if(!files.length||!curRoom||!cu)return;
  const btn=document.getElementById("upload-btn"),camBtn=document.getElementById("camera-btn"),bar=document.getElementById("prog-bar"),fill=document.getElementById("prog-fill"),pct=document.getElementById("prog-pct");
  btn.disabled=true;camBtn.disabled=true;bar.style.display="block";
  for(let i=0;i<files.length;i++){
    const file=files[i];
    if(!file.type.startsWith("image/")){showToast("❗ 이미지만 가능");continue}
    if(file.size>10*1024*1024){showToast("❗ 10MB 이하만 가능");continue}
    const ts=Date.now(),path=`rent_app/${cu.uid}/contracts/${curRoom}/${ts}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
    const label=files.length>1?`(${i+1}/${files.length}) `:"";
    try{
      const ref=storage.ref(path),task=ref.put(file);
      await new Promise((res,rej)=>task.on("state_changed",s=>{
        const p=Math.round(s.bytesTransferred/s.totalBytes*100);
        fill.style.width=`${p}%`;
        pct.textContent=`${label}업로드 중... ${p}%`;
      },rej,res));
      fill.style.width="100%";pct.textContent=`${label}완료!`;
      const url=await ref.getDownloadURL(),pid=String(ts+(i*10));
      const targetUid=(cu.uid===MASTER_UID&&mUid)?mUid:cu.uid;
      await db.ref(`rent_app/${targetUid}/${curBid}/units/${curRoom}/photos/${pid}`).set({id:pid,url,storagePath:path,uploadedAt:new Date().toISOString()});
      if(!units[curRoom].photos)units[curRoom].photos={};
      units[curRoom].photos[pid]={id:pid,url,storagePath:path};
      renderPhotos(units[curRoom].photos);showToast("✅ 업로드 완료");
    }catch(err){showToast("❗ 업로드 실패: "+err.message)}
  }
  btn.disabled=false;camBtn.disabled=false;bar.style.display="none";fill.style.width="0%";pct.textContent="";e.target.value="";
}
function delPhoto(pid,spath){
  showCM("사진 삭제","이 사진을 삭제하시겠습니까?",async()=>{
    try{
      if(spath)await storage.ref(spath).delete().catch(()=>{});
      const targetUid=(cu.uid===MASTER_UID&&mUid)?mUid:cu.uid;
      await db.ref(`rent_app/${targetUid}/${curBid}/units/${curRoom}/photos/${pid}`).remove();
      if(units[curRoom]&&units[curRoom].photos)delete units[curRoom].photos[pid];
      renderPhotos(units[curRoom]&&units[curRoom].photos||{});showToast("🗑 삭제됨");
    }catch(e){showToast("❗ 삭제 실패")}});
}
function openPV(url){document.getElementById("pv-img").src=url;document.getElementById("pv").classList.add("show")}
function closePV(){document.getElementById("pv").classList.remove("show");document.getElementById("pv-img").src=""}
function showCM(title,msg,cb){
  document.getElementById("cm-title").textContent=title;document.getElementById("cm-msg").textContent=msg;
  document.getElementById("cm-ok").onclick=()=>{cb();closeCM()};
  document.getElementById("confirm-modal").classList.add("show");
}
function closeCM(){document.getElementById("confirm-modal").classList.remove("show")}
function fmtWon(v){if(!v)return"—";return(v*10000).toLocaleString("ko-KR")+"원"}
function truncate(s,n){return s&&s.length>n?s.slice(0,n)+"…":s||""}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
let tTm;function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tTm);tTm=setTimeout(()=>t.classList.remove("show"),2800)}
function clearFilter(){curFilter="";document.getElementById("filter-banner").style.display="none";history.replaceState({},"",location.pathname);renderGrid()}
function fmtDate(){const d=new Date();return`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`}
function exportJSON(){
  const data={
    exportedAt:new Date().toISOString(),
    units:ROOMS.map(r=>{
      const u=units[r];if(!u)return null;
      const {photos,...rest}=u;return rest;
    }).filter(Boolean),
    rentHistory:rentHistory
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`월세관리_세대_${fmtDate()}.json`;a.click();URL.revokeObjectURL(a.href);
  showToast("✅ JSON 내려받기 완료");
}
function exportCSV(){
  const months=getLastNMonths(12);
  const header=["호수","층","임대구조","임대상태","임차인①","연락처①","임차인②","연락처②","보증금(만원)","월세(만원)","계약시작","계약종료","메모",...months];
  const rows=ROOMS.map(r=>{
    const u=units[r];if(!u)return null;
    const hist=rentHistory[u.room]||{};
    const mCols=months.map(ym=>{
      const rec=hist[ym];
      return rec?(rec.paid?"완납":"미납"):"";
    });
    return[u.room,u.floor,RTYPE_LBL[u.roomType]||"",u.status==="rented"?"임대중":"공실",
      u.tenantName||"",u.tenantPhone||"",u.tenantName2||"",u.tenantPhone2||"",
      u.depositAmount||0,u.monthlyRent||0,u.contractStart||"",u.contractEnd||"",
      (u.memo||"").replace(/\n/g," "),...mCols];
  }).filter(Boolean);
  const csv=[header,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`월세관리_세대_${fmtDate()}.csv`;a.click();URL.revokeObjectURL(a.href);
  showToast("✅ CSV 내려받기 완료");
}
</script>
