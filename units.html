<style>
.floor-tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.floor-tabs-wrap{margin-bottom:14px}
.export-btn{padding:7px 12px;border-radius:8px;border:2px solid var(--border);font-size:12px;font-weight:600;cursor:default;background:#fff;color:var(--sub);font-family:inherit;white-space:nowrap;flex-shrink:0}
.bld-drop{position:fixed;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.18);border:1px solid var(--border);z-index:600;min-width:140px;overflow:hidden}
.bld-drop-item{display:block;width:100%;padding:11px 16px;border:none;background:transparent;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;color:var(--text);transition:background .12s}
.bld-drop-item:active{background:var(--bg)}
.bld-drop-item.active{color:var(--sky)}
.badge-oneroom{background:#FEF3C7;color:#92400E}
.badge-twobay{background:#F3E8FF;color:#6B21A8}
.badge-tworoom{background:#CCFBF1;color:#0F766E}
.badge-threeroom{background:#EEF2FF;color:#3730A3}
.tg-btn.on-rtype{background:var(--sky);color:#fff}
.floor-tab{padding:6px 14px;border-radius:20px;border:2px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--sub);font-family:inherit;white-space:nowrap;transition:all .15s}
.floor-tab.on{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.status-tabs-row{display:flex;gap:6px;flex:1;min-width:0}
.status-tab{padding:6px 14px;border-radius:20px;border:2px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--sub);font-family:inherit;white-space:nowrap;transition:all .15s}
.status-tab.on{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.status-tab[data-status="rented"].on{background:var(--blue-t);border-color:var(--blue-t)}
.status-tab[data-status="vacant"].on{background:#6366F1;border-color:#6366F1}
.rooms-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:600px){.rooms-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.room-card{background:var(--card);border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;border:2px solid transparent;min-width:0;overflow:hidden}
.room-card:active{transform:scale(.97)}
.room-card.status-vacant{border-color:var(--indigo-lt)}
.room-card.status-rented{border-color:var(--blue-lt)}
.rc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rc-num{font-size:18px;font-weight:900;color:var(--hdr)}
.rc-sbadge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.badge-rented{background:var(--blue-lt);color:var(--blue-t)}
.badge-vacant{background:var(--red-lt);color:var(--red-t)}
.badge-paid{background:var(--green-lt);color:var(--green-t)}
.badge-unpaid{background:var(--red-lt);color:var(--red-t)}
.rc-names{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-phones{font-size:11px;color:var(--sub);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-rent{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.rc-memo{font-size:11px;color:var(--hint);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-paid{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block}
.sheet-bg{position:fixed;top:100px;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:flex-end;justify-content:center;overflow:hidden}
.sheet-bg.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:540px;box-shadow:0 -4px 32px rgba(0,0,0,.2);max-height:calc(100vh - 100px);max-height:calc(100dvh - 100px);overflow-y:auto;overscroll-behavior:contain}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-hd h3{font-size:17px;font-weight:900;color:var(--hdr)}
.sheet-close{width:32px;height:32px;border:none;background:#F3F4F6;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tg-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;margin-top:14px}
.toggle-group{display:flex;border:2px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:2px}
.tg-btn{flex:1;padding:10px 8px;border:none;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--sub);transition:all .15s}
.tg-btn.on-blue{background:var(--blue);color:#fff}
.tg-btn.on-gray{background:var(--indigo);color:#fff}
.tg-btn.on-amber{background:#D97706;color:#fff}
.badge-monthly{background:#FFF7ED;color:#C2410C}
.badge-jeonse{background:#EDE9FE;color:#5B21B6}
.divider{height:1px;background:var(--border);margin:16px 0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea{border:2px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;color:var(--text);background:#FAFCFF;width:100%;transition:border-color .2s}
.field input:focus,.field textarea:focus{border-color:var(--sky);background:#fff}
.field textarea{resize:none}
.section-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:14px;display:flex;align-items:center;gap:4px}
.sheet-btn-row{display:flex;gap:10px;margin-top:4px}
.btn-save{flex:7;padding:15px;background:var(--hdr);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.85}
.btn-close-sheet{flex:3;padding:15px;background:#F1F5F9;color:var(--sub);border:2px solid var(--border);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-close-sheet:active{background:#E2E8F0}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rent-hist-wrap{margin-bottom:4px}
.rent-hist-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:6px}
.rh-cell{border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;transition:transform .1s,opacity .1s;user-select:none;-webkit-user-select:none}
.rh-cell:active{transform:scale(.92);opacity:.75}
.rh-month{font-size:9px;font-weight:700;color:inherit;opacity:.7;margin-bottom:3px}
.rh-icon{font-size:13px;line-height:1}
.rh-paid{background:var(--green-lt);color:var(--green-t)}
.rh-unpaid{background:var(--red-lt);color:var(--red-t)}
.rh-partial{background:#FEF3C7;color:#92400E}
.rh-none{background:#F1F5F9;color:var(--hint)}
.rh-drop{position:fixed;z-index:700;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:6px;min-width:148px;border:1px solid #E2E8F0}
.rh-dd-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;border-radius:9px;text-align:left;font-family:inherit;color:var(--text)}
.rh-dd-btn:active{background:#F1F5F9}
.rh-partial-input{padding:8px;display:flex;flex-direction:column;gap:6px}
.rh-partial-input input{padding:8px 10px;border:1.5px solid #E2E8F0;border-radius:9px;font-size:14px;font-family:inherit;width:100%}
.rh-partial-input button{padding:9px;background:#F59E0B;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.rh-legend{display:flex;gap:10px;font-size:10px;color:var(--hint);margin-top:2px;flex-wrap:wrap}
.rh-tip{font-size:10px;color:var(--sky);margin-top:4px;text-align:center;font-weight:600}
.rc-dday{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;display:inline-block;margin-bottom:4px}
.dday-safe{background:#D1FAE5;color:#065F46}
.dday-warn{background:#FEF3C7;color:#92400E}
.dday-danger{background:#FEE2E2;color:#991B1B}
.dday-expired{background:#F1F5F9;color:#64748B}
.filter-banner{display:flex;align-items:center;justify-content:space-between;background:var(--hdr);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600}
.rc-chg-wrap{margin-top:6px}
.rc-chg-empty{font-size:12px;color:var(--hint);text-align:center;padding:6px 0}
.rc-chg-item{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.rc-chg-item:last-child{border-bottom:none}
.rc-chg-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.rc-chg-badge.deposit{background:#EEF2FF;color:#3730A3}
.rc-chg-badge.monthly{background:#D1FAE5;color:#065F46}
.rc-chg-body{flex:1;min-width:0}
.rc-chg-amounts{font-size:13px;font-weight:700;color:var(--text)}
.rc-chg-meta{font-size:11px;color:var(--hint);margin-top:2px}
.rc-chg-del{width:24px;height:24px;border:none;background:#FEE2E2;color:#991B1B;border-radius:6px;font-size:11px;cursor:pointer;flex-shrink:0;font-family:inherit}
.chg-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:640;display:none}
.chg-bg.show{display:block}
.chg-sheet{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 36px;z-index:650;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:85vh;overflow-y:auto;overscroll-behavior:contain}
.chg-sheet.show{transform:translateY(0)}
.chg-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:12px;border:2px solid var(--border);border-radius:12px;overflow:hidden}
.chg-col{padding:12px}
.chg-col-dep{border-right:1px solid var(--border)}
.chg-col-hd{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
.chg-col-dep .chg-col-hd{background:#EEF2FF;color:#3730A3}
.chg-col-mon .chg-col-hd{background:#D1FAE5;color:#065F46}
.filter-clear{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.ph-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#F0F4F8}
.ph-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.ph-del{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upload-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:2px dashed var(--border);border-radius:10px;background:#FAFCFF;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.upload-btn:hover{border-color:var(--sky);color:var(--sky)}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}
.photo-btn-row{display:flex;gap:8px}
.photo-btn-row .upload-btn{flex:1;width:auto;font-size:12px;padding:11px 6px;text-align:center}
.camera-btn{border-color:var(--sky);color:var(--sky)}
.prog-bar{height:22px;border-radius:11px;background:#E2E8F0;margin-top:10px;overflow:hidden;display:none;position:relative}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));transition:width .25s;width:0%}
.prog-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--hdr);letter-spacing:.3px}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:900;display:none;align-items:center;justify-content:center}
#pv.show{display:flex}
#pv img{max-width:95%;max-height:90vh;border-radius:8px;object-fit:contain}
#pv-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:20px;padding:24px;max-width:340px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.confirm-box h3{font-size:15px;font-weight:700;color:var(--hdr);margin-bottom:10px}
.confirm-box p{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6}
.confirm-btns{display:flex;gap:10px;justify-content:flex-end}
.confirm-btns button{padding:9px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><img src="logo.png" alt="PlusHome"></div>
    <div class="login-title">월세 관리</div>
    <div class="login-sub">임대 현황을 한눈에 관리하세요<br>Google 계정으로 안전하게 로그인</div>
    <button class="google-btn" onclick="signInGoogle()">
      <svg class="g-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 로그인
    </button>
    <button onclick="enterDemoMode()" style="margin-top:10px;width:100%;padding:11px;background:rgba(14,165,233,.15);border:1.5px solid rgba(14,165,233,.4);border-radius:12px;color:#7DD3FC;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">👀 로그인 없이 구경하기</button>
    <div class="login-footer">데이터는 본인 Google 계정에만 저장됩니다</div>
  </div>
</div>

<div id="status-screen" style="display:none;position:fixed;inset:0;background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);z-index:7000;align-items:center;justify-content:center;padding:20px">
  <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:36px 28px;max-width:320px;width:100%;text-align:center;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="font-size:52px;margin-bottom:14px" id="ss-icon">⏳</div>
    <div style="font-size:20px;font-weight:900;color:#fff;margin-bottom:8px" id="ss-title"></div>
    <div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;line-height:1.7;white-space:pre-line" id="ss-msg"></div>
    <div style="font-size:11px;color:rgba(255,255,255,.3);margin-bottom:24px" id="ss-email"></div>
    <button onclick="auth.signOut().then(()=>location.reload())" style="width:100%;padding:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">로그아웃</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-top">
      <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
        <a href="index.html" style="flex-shrink:0;display:flex;align-items:center;line-height:0">
          <img src="logo.png" alt="PlusHome" style="height:40px;width:auto;image-rendering:-webkit-optimize-contrast">
        </a>
      </div>
      <div class="hdr-actions">
        <button class="guide-btn" onclick="openHelp()">❓ 도움말</button>
        <div id="av-wrap" onclick="toggleMenu()" style="display:none"></div>
      </div>
    </div>
    <div class="nav">
      <a href="index.html" class="nav-tab">📊 메인</a>
      <a href="units.html" class="nav-tab on">🏠 세대</a>
      <a href="expense.html" class="nav-tab">💸 지출</a>
      <a href="admin.html" class="nav-tab">🗂 관리</a>
    </div>
  </div>
  <div id="user-menu" class="user-menu">
    <div class="um-name" id="um-name">—</div>
    <div class="um-email" id="um-email">—</div>
    <button class="logout-btn" onclick="doSignOut()">🚪 로그아웃</button>
  </div>
  <div class="content">
    <div class="tabs-row">
      <div class="status-tabs-row" id="status-tabs-row">
        <button class="status-tab on" data-status="" onclick="setStatusFilter('')">전체</button>
        <button class="status-tab" data-status="rented" onclick="setStatusFilter('rented')">임대중</button>
        <button class="status-tab" data-status="vacant" onclick="setStatusFilter('vacant')">공실</button>
      </div>
      <button class="export-btn" id="bld-name-label"></button>
    </div>
    <div class="floor-tabs-wrap">
      <div class="floor-tabs" id="floor-tabs">
        <!-- 동적 생성 -->
      </div>
    </div>
    <div id="filter-banner" style="display:none" class="filter-banner">
      <span id="filter-banner-txt"></span>
      <button class="filter-clear" onclick="clearFilter()">✕ 필터 해제</button>
    </div>
    <div class="rooms-grid" id="rooms-grid"></div>
  </div>
</div>

<!-- ROOM SHEET -->
<div class="sheet-bg" id="room-sheet">
  <div class="sheet">
    <div class="sheet-hd">
      <h3 id="sheet-title">— 호</h3>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <input type="hidden" id="m-room">
    <div id="m-sect-tg">
    <div class="tg-label">임대 구조</div>
    <div class="toggle-group">
      <button class="tg-btn on-rtype" id="tg-oneroom" onclick="setRoomType('oneroom')">원룸</button>
      <button class="tg-btn" id="tg-twobay" onclick="setRoomType('twobay')">투베이</button>
      <button class="tg-btn" id="tg-tworoom" onclick="setRoomType('tworoom')">투룸</button>
      <button class="tg-btn" id="tg-threeroom" onclick="setRoomType('threeroom')">쓰리룸</button>
    </div>

<script>
const storage=firebase.storage();
let cu=null,uRef=null,hRef=null,configRef=null,bldgsRef=null,uL=null,hL=null,bldgsL=null,readOnly=false;
let units={},rentHistory={},curFloor=0,curRoom=null,mStatus="vacant",mRoomType="oneroom",mRentType="monthly",curFilter="";
let ROOMS=[],FLOORS=[],bldgsData={},curBid="main",mUid="",mName="";
const DEFAULT_LAYOUT={"2":["201","202","203","204","205","206"],"3":["301","302","303","304","305","306"],"4":["401","402","403","404","405","406"]};

function applyLayout(layout){
  ROOMS=[];FLOORS=[];
  Object.keys(layout).sort((a,b)=>Number(a)-Number(b)).forEach(f=>{
    FLOORS.push(Number(f));(layout[f]||[]).forEach(r=>ROOMS.push(String(r)));
  });
  renderFloorTabs();
}
function renderFloorTabs(){
  const el=document.getElementById("floor-tabs");if(!el)return;
  el.innerHTML=FLOORS.map(f=>`<button class="floor-tab ${curFloor===f?"on":""}" onclick="setFloor(${f},this)">${f}층</button>`).join("");
}

async function enterDemoMode(){
  await ensureDemoLoaded();
  readOnly=true;sessionStorage.setItem("guestDemo","1");
  bldgsData=DEMO.bldgsData;curBid="main";
  units=DEMO.units;rentHistory=DEMO.rentHistory;
  applyLayout(DEMO.layout);_unitsReady=true;_historyReady=true;
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="block";
  showDemoBanner();renderGrid();
}

auth.onAuthStateChanged(async user=>{
  const ls=document.getElementById("login-screen");
  const app=document.getElementById("app");
  if(user){
    cu=user;
    if(user.uid!==MASTER_UID){const access=await checkUserAccess(user);if(access===false)return;if(access==="readonly")readOnly=true;}
    setTimeout(maybeShowAlerts,1200);
    const w=document.getElementById("av-wrap");
    w.innerHTML=user.photoURL?`<img class="av-img" src="${user.photoURL}">`:`<div class="av-txt">${(user.displayName||"U")[0]}</div>`;
    w.style.display="block";
    document.getElementById("um-name").textContent=user.displayName||"사용자";
    document.getElementById("um-email").textContent=user.email||"";
    if(uL&&uRef)uRef.off("value",uL);
    if(hL&&hRef)hRef.off("value",hL);
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);

    // ★ 관리자가 다른 사용자 페이지를 열람하는 경우
    const params=new URLSearchParams(location.search);
    mUid=params.get("master_uid")||"";
    mName=params.get("master_name")||"";
    const targetUid=(user.uid===MASTER_UID&&mUid)?mUid:user.uid;

    if(user.uid===MASTER_UID&&mUid){
      // 열람 배너 표시
      const banner=document.createElement("div");
      banner.id="master-view-banner";
      banner.style.cssText="position:fixed;top:100px;left:0;right:0;z-index:150;background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(245,158,11,.05));border-bottom:1px solid rgba(245,158,11,.3);padding:8px 16px;display:flex;align-items:center;justify-content:space-between";
      banner.innerHTML=`<span style="font-size:12px;font-weight:700;color:#F59E0B">🔧 열람 중: ${esc(mName||mUid)}</span><button onclick="location.href='admin-master.html'" style="font-size:11px;font-weight:700;background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#F59E0B;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit">← 관리자 페이지</button>`;
      document.body.appendChild(banner);
      document.querySelector(".content").style.marginTop="136px";
      document.querySelectorAll(".nav-tab").forEach(a=>{
        const u=new URL(a.href,location.href);
        u.searchParams.set("master_uid",mUid);
        u.searchParams.set("master_name",mName||"");
        a.href=u.pathname+"?"+u.searchParams.toString();
      });
    }

    // Migration (only for own account)
    if(user.uid===targetUid){
      try{await migrateToMultiBldg(user.uid)}catch(e){}
    }
    curBid=getCurBid(targetUid);

    if(readOnly){enterDemoMode();return;}

    ls.style.display="none";app.style.display="block";

    // Load building registry for switcher
    bldgsRef=db.ref(DBPath.bldList(targetUid));
    bldgsL=bldgsRef.on("value",snap=>{
      bldgsData=snap.val()||{};
      const bids=sortedBids(bldgsData);
      if(bids.length&&!bldgsData[curBid]){curBid=bids[0];setCurBid(targetUid,curBid)}
    });

    configRef=db.ref(DBPath.roomLayout(targetUid, curBid));
    uRef=db.ref(DBPath.units(targetUid, curBid));
    hRef=db.ref(DBPath.rentHistory(targetUid, curBid));
    configRef.once("value").then(snap=>{
      applyLayout(snap.val()||DEFAULT_LAYOUT);
      listenUnits();listenHistory();
    }).catch(()=>{applyLayout(DEFAULT_LAYOUT);listenUnits();listenHistory();});
  }else{
    if(sessionStorage.getItem("guestDemo")==="1"){enterDemoMode();return;}
    cu=null;app.style.display="none";ls.style.display="flex";
    if(uL&&uRef)uRef.off("value",uL);
    if(hL&&hRef)hRef.off("value",hL);
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
  }
});
function doSignOut(){
  closeMenu();
  if(uL&&uRef)uRef.off("value",uL);
  if(hL&&hRef)hRef.off("value",hL);
  if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
  auth.signOut();
}

let _bldDrop=null;
function openBldDrop(e){
  if(e)e.stopPropagation();
  if(_bldDrop){_bldDrop.remove();_bldDrop=null;return;}
  const bids=sortedBids(bldgsData);if(bids.length<=1)return;
  const btn=document.getElementById("bld-name-label");
  const drop=document.createElement("div");drop.className="bld-drop";
  bids.forEach(bid=>{
    const item=document.createElement("button");
    item.className="bld-drop-item"+(bid===curBid?" active":"");
    item.textContent=bldgsData[bid]?.name||bid;
    item.onclick=(ev)=>{ev.stopPropagation();_bldDrop.remove();_bldDrop=null;switchBld(bid);};
    drop.appendChild(item);
  });
  const r=btn.getBoundingClientRect();
  drop.style.cssText=`top:${r.bottom+4}px;right:${window.innerWidth-r.right}px`;
  document.body.appendChild(drop);_bldDrop=drop;
}
document.addEventListener("click",()=>{if(_bldDrop){_bldDrop.remove();_bldDrop=null;}});
function switchBld(bid){
  if(bid===curBid)return;
  if(uL&&uRef)uRef.off("value",uL);
  if(hL&&hRef)hRef.off("value",hL);
  curBid=bid;
  const targetUid=(cu?.uid===MASTER_UID&&mUid)?mUid:cu?.uid||"";
  setCurBid(targetUid,bid);
  units={};rentHistory={};ROOMS=[];FLOORS=[];curFloor=0;
  _unitsReady=false;_historyReady=false;
  configRef=db.ref(DBPath.roomLayout(targetUid, bid));
  uRef=db.ref(DBPath.units(targetUid, bid));
  hRef=db.ref(DBPath.rentHistory(targetUid, bid));
  configRef.once("value").then(snap=>{applyLayout(snap.val()||DEFAULT_LAYOUT);listenUnits();listenHistory();})
    .catch(()=>{applyLayout(DEFAULT_LAYOUT);listenUnits();listenHistory();});
  renderGrid();
}
let _unitsReady=false,_historyReady=false;
let _rgTm=null;
function schedRenderGrid(){clearTimeout(_rgTm);_rgTm=setTimeout(()=>{renderGrid();tryOpenURLParam();},50);}
function listenUnits(){
  uL=uRef.on("value",snap=>{
    const val=snap.val()||{};ensureRooms(val);units=val;
    if(curRoom&&units[curRoom]){
      const f=(id)=>document.getElementById(id);
      if(f("m-memo"))   units[curRoom].memo          = f("m-memo").value;
      if(f("m-deposit"))units[curRoom].depositAmount = parseInt(f("m-deposit").value)||0;
      if(f("m-rent"))   units[curRoom].monthlyRent   = parseInt(f("m-rent").value)||0;
      if(f("m-name"))   units[curRoom].tenantName    = f("m-name").value;
      if(f("m-phone"))  units[curRoom].tenantPhone   = f("m-phone").value;
    }
    _unitsReady=true;schedRenderGrid();
  },()=>showToast("❗ 연결 오류"));
}
function listenHistory(){
  hL=hRef.on("value",snap=>{
    rentHistory=snap.val()||{};
    _historyReady=true;schedRenderGrid();
  },()=>{});
}
let _urlOpened=false;
function tryOpenURLParam(){
  if(_urlOpened||!_unitsReady||!_historyReady)return;
  _urlOpened=true;
  const params=new URLSearchParams(location.search);
  const room=params.get("room"),filter=params.get("filter");
  if(filter){
    if(filter==="rented"||filter==="vacant"){
      setStatusFilter(filter);
    } else {
      curFilter=filter;
      const labels={unpaid:"미납 세대만 보기"};
      document.getElementById("filter-banner-txt").textContent="🔍 "+(labels[filter]||filter);
      document.getElementById("filter-banner").style.display="flex";renderGrid();
    }
  }
  if(room&&units[room])openSheet(room);
}
function getLastNMonths(n){
  const res=[],now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    res.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  return res;
}
function renderHistory(roomId){
  const months=getLastNMonths(12),roomH=rentHistory[roomId]||{};
  const el=document.getElementById("rent-hist-grid");if(!el)return;
  el.innerHTML=months.map(ym=>{
    const rec=roomH[ym];
    let cls,icon;
    if(!rec){cls="rh-none";icon="—";}
    else if(rec.paid){cls="rh-paid";icon="✅";}
    else if(rec.partial){cls="rh-partial";icon="🔶";}
    else{cls="rh-unpaid";icon="❌";}
    const mLabel=ym.split("-")[1]+"월";
    const amtTitle=rec&&rec.amount?" · "+rec.amount.toLocaleString()+"원":"";
    return`<div class="rh-cell ${cls}" onclick="openHistDrop(event,'${roomId}','${ym}')" title="${ym}${amtTitle}">
      <div class="rh-month">${mLabel}</div><div class="rh-icon">${icon}</div></div>`;
  }).join("");
}

let _rhDrop=null;
function openHistDrop(e,roomId,ym){
  if(!guardWrite())return;
  e.stopPropagation();
  if(_rhDrop){_rhDrop.remove();_rhDrop=null;}
  const u=units[roomId];
  const rentAmt=(u&&u.monthlyRent?u.monthlyRent:0)*10000;
  const drop=document.createElement("div");
  drop.className="rh-drop";
  const opts=[
    {label:"✅ 납부완료",status:"paid"},
    {label:"❌ 미납",status:"unpaid"},
    {label:"🔶 부분납부",status:"partial"},
    {label:"— 기록없음",status:"none"},
  ];
  opts.forEach(opt=>{
    const btn=document.createElement("button");
    btn.className="rh-dd-btn";btn.textContent=opt.label;
    if(opt.status==="partial"){
      btn.onclick=(ev)=>{
        ev.stopPropagation();
        drop.innerHTML="";
        const wrap=document.createElement("div");wrap.className="rh-partial-input";
        const lbl=document.createElement("div");lbl.style.cssText="font-size:11px;font-weight:700;color:#92400E";lbl.textContent="🔶 부분납부 금액 (원)";
        const inp=document.createElement("input");inp.type="number";inp.value=rentAmt;inp.min=0;
        const cfm=document.createElement("button");cfm.textContent="확인";
        cfm.onclick=(ev)=>{
          ev.stopPropagation();
          const amt=parseInt(inp.value)||0;
          setHistStatus(roomId,ym,"partial",amt);
          drop.remove();_rhDrop=null;
        };
        wrap.append(lbl,inp,cfm);drop.appendChild(wrap);
        setTimeout(()=>inp.focus(),50);
      };
    } else {
      btn.onclick=()=>{setHistStatus(roomId,ym,opt.status,rentAmt);drop.remove();_rhDrop=null;};
    }
    drop.appendChild(btn);
  });
  // 위치 계산 (화면 밖으로 나가지 않게)
  const rect=e.currentTarget.getBoundingClientRect();
  let top=rect.bottom+6,left=rect.left;
  if(left+160>window.innerWidth)left=window.innerWidth-164;
  if(top+180>window.innerHeight)top=rect.top-186;
  drop.style.cssText+=`;top:${top}px;left:${left}px`;
  document.body.appendChild(drop);_rhDrop=drop;
}
document.addEventListener("click",e=>{if(_rhDrop&&!_rhDrop.contains(e.target)){_rhDrop.remove();_rhDrop=null;}});

function setHistStatus(roomId,ym,status,amount){
  if(!hRef||!cu)return;
  const ref=hRef.child(`${roomId}/${ym}`);
  if(status==="none"){
    const prev=(rentHistory[roomId]||{})[ym];
    if(!rentHistory[roomId])rentHistory[roomId]={};
    delete rentHistory[roomId][ym];
    renderHistory(roomId);renderGrid();
    ref.remove()
      .then(()=>showToast("🗑 기록 삭제됨"))
      .catch(()=>{
        if(prev)rentHistory[roomId][ym]=prev;
        renderHistory(roomId);renderGrid();showToast("❗ 저장 실패");
      });
    return;
  }
  const data={room:roomId,yearMonth:ym,
    paid:status==="paid",
    partial:status==="partial",
    amount:amount,
    updatedAt:new Date().toISOString()};
  if(!rentHistory[roomId])rentHistory[roomId]={};
  const prev=rentHistory[roomId][ym];
  rentHistory[roomId][ym]=data;
  renderHistory(roomId);renderGrid();
  showToast({paid:"✅ 완납 기록됨",unpaid:"❌ 미납 기록됨",partial:"🔶 부분납부 기록됨"}[status]);
  ref.set(data).catch(()=>{
    if(prev)rentHistory[roomId][ym]=prev;
    else delete rentHistory[roomId][ym];
    renderHistory(roomId);renderGrid();showToast("❗ 저장 실패 (되돌림)");
  });
}
async function ensureRooms(ex){
  const up={};ROOMS.forEach(r=>{if(!ex[String(r)])up[String(r)]=defRoom(r)});
  if(Object.keys(up).length)await uRef.update(up);
}

async function saveRentChange(){
  if(!guardWrite())return;
  const depNewStr=document.getElementById("chg-dep-new").value;
  const monNewStr=document.getElementById("chg-mon-new").value;
  const depFilled=depNewStr!==""&&!isNaN(parseInt(depNewStr));
  const monFilled=monNewStr!==""&&!isNaN(parseInt(monNewStr));
  if(!depFilled&&!monFilled){showToast("❗ 보증금 또는 월세 변경 금액을 입력하세요");return;}
  const date=document.getElementById("chg-date").value;
  if(!date){showToast("❗ 적용일을 선택하세요");return;}
  const u=units[_chgRoomId]||{};
  const reason=document.getElementById("chg-reason").value.trim();
  const targetUid=(cu?.uid===MASTER_UID&&mUid)?mUid:cu?.uid||"";
  const ts=Date.now();
  const saves=[];
  if(depFilled){
    const id="dep_"+ts;
    const data={id,type:"deposit",oldVal:u.depositAmount||0,newVal:parseInt(depNewStr),effectiveDate:date,reason,createdAt:new Date().toISOString()};
    saves.push({id,data});
  }
  if(monFilled){
    const id="mon_"+ts;
    const data={id,type:"monthly",oldVal:u.monthlyRent||0,newVal:parseInt(monNewStr),effectiveDate:date,reason,createdAt:new Date().toISOString()};
    saves.push({id,data});
  }
  try{
    const mpath={};
    saves.forEach(({id,data})=>{mpath[`${_chgRoomId}/rentChanges/${id}`]=data;});
    if(depFilled) mpath[`${_chgRoomId}/depositAmount`]=parseInt(depNewStr);
    if(monFilled) mpath[`${_chgRoomId}/monthlyRent`]=parseInt(monNewStr);
    await db.ref(DBPath.units(targetUid, curBid)).update(mpath);
    if(!units[_chgRoomId])units[_chgRoomId]={};
    if(!units[_chgRoomId].rentChanges)units[_chgRoomId].rentChanges={};
    saves.forEach(({id,data})=>{units[_chgRoomId].rentChanges[id]=data;});
    if(depFilled) units[_chgRoomId].depositAmount=parseInt(depNewStr);
    if(monFilled) units[_chgRoomId].monthlyRent=parseInt(monNewStr);
    if(curRoom===_chgRoomId){
      if(depFilled) document.getElementById("m-deposit").value=parseInt(depNewStr);
      if(monFilled) document.getElementById("m-rent").value=parseInt(monNewStr);
    }
    showToast("✅ 변동 이력 기록됨");
    closeRentChangeSheet();
    renderRentChanges(_chgRoomId);
    renderGrid();
  }catch(e){showToast("❗ 저장 실패");}
}

async function onPhotos(e){
  if(!guardWrite()){e.target.value="";return;}
  const files=Array.from(e.target.files);
  if(!files.length||!curRoom||!cu)return;
  const btn=document.getElementById("upload-btn"),camBtn=document.getElementById("camera-btn"),bar=document.getElementById("prog-bar"),fill=document.getElementById("prog-fill"),pct=document.getElementById("prog-pct"),saveBtn=document.querySelector(".btn-save");
  btn.disabled=true;camBtn.disabled=true;if(saveBtn)saveBtn.disabled=true;bar.style.display="block";
  for(let i=0;i<files.length;i++){
    const file=files[i];
    if(!file.type.startsWith("image/")){showToast("❗ 이미지만 가능");continue}
    if(file.size>50*1024*1024){showToast("❗ 50MB 이하만 가능");continue}
    const ts=Date.now(),path=`rent_app/${cu.uid}/contracts/${curRoom}/${ts}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
    const label=files.length>1?`(${i+1}/${files.length}) `:"";
    try{
      pct.textContent=`${label}압축 중...`;
      const blob=await compressImage(file);
      const ref=storage.ref(path);
      let url=null;
      for(let attempt=0;attempt<2;attempt++){
        try{
          const task=ref.put(blob);
          await new Promise((res,rej)=>task.on("state_changed",s=>{
            const p=Math.round(s.bytesTransferred/s.totalBytes*100)||0;
            fill.style.width=`${p}%`;
            pct.textContent=`${label}업로드 중... ${p}%`;
          },rej,res));
          url=await ref.getDownloadURL();break;
        }catch(e){if(attempt===1)throw e;pct.textContent=`${label}❗ 실패 — 재시도 중...`;fill.style.width="0%";await new Promise(r=>setTimeout(r,1800));}
      }
      fill.style.width="100%";pct.textContent=`${label}완료!`;
      const pid=String(ts+(i*10));
      const targetUid=(cu.uid===MASTER_UID&&mUid)?mUid:cu.uid;
      await db.ref(DBPath.unitPhoto(targetUid, curBid, curRoom, pid)).set({id:pid,url,storagePath:path,uploadedAt:new Date().toISOString()});
      if(!units[curRoom].photos)units[curRoom].photos={};
      units[curRoom].photos[pid]={id:pid,url,storagePath:path};
      renderPhotos(units[curRoom].photos);showToast("✅ 업로드 완료");
    }catch(err){showToast("❗ 업로드 실패: "+err.message)}
  }
  btn.disabled=false;camBtn.disabled=false;if(saveBtn)saveBtn.disabled=false;bar.style.display="none";fill.style.width="0%";pct.textContent="";e.target.value="";
}
