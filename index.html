<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E2D3D">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>🏠 월세 관리 · 메인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="shared.js?v=2"></script>
<script src="demo-data.js?v=2"></script>
<style>
:root{
  --bg:#F0F4F8;--card:#fff;--border:#E2E8F0;
  --text:#1E293B;--sub:#64748B;--hint:#94A3B8;
  --hdr:#1E2D3D;--hdr2:#2A3F55;
  --green:#059669;--green-lt:#D1FAE5;--green-t:#065F46;
  --red:#DC2626;--red-lt:#FEE2E2;--red-t:#991B1B;
  --blue:#0284C7;--blue-lt:#E0F2FE;--blue-t:#0C4A6E;
  --indigo:#4F46E5;--indigo-lt:#EEF2FF;--indigo-t:#3730A3;
  --amber:#D97706;--amber-lt:#FEF3C7;--amber-t:#92400E;
  --sky:#0EA5E9;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text)}
/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,var(--hdr),var(--hdr2));box-shadow:0 3px 16px rgba(0,0,0,.25);padding:0 16px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.hdr-title{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
.hdr-actions{display:flex;align-items:center;gap:8px;position:relative}
.av-img{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;object-fit:cover}
.av-txt{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--sky);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.guide-btn{padding:5px 10px;background:rgba(14,165,233,.15);border:1.5px solid rgba(14,165,233,.5);border-radius:8px;color:#7DD3FC;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:background .15s;text-decoration:none;display:flex;align-items:center;gap:3px}
.guide-btn:active{background:rgba(14,165,233,.32)}
.nav{display:flex;border-top:1px solid rgba(255,255,255,.08)}
.nav-tab{flex:1;padding:9px 2px 11px;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,.4);border-bottom:3px solid transparent;text-decoration:none;transition:all .2s;white-space:nowrap}
.nav-tab.on{color:#fff;border-bottom-color:var(--sky);font-weight:700}
/* USER MENU */
.user-menu{position:fixed;top:56px;right:12px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.2);padding:16px;min-width:210px;z-index:300;display:none;border:1px solid var(--border)}
.user-menu.show{display:block}
.um-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.um-email{font-size:12px;color:var(--hint);margin-bottom:12px;word-break:break-all}
.logout-btn{width:100%;padding:9px;background:var(--red-lt);color:var(--red);border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
/* CONTENT */
.content{margin-top:100px;padding:14px;min-height:calc(100vh - 100px)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:12px;padding:12px 4px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi:active{transform:scale(.95);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.kpi-val{font-size:22px;font-weight:900;line-height:1;margin-bottom:3px}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.3px}
.kpi.total .kpi-val{color:var(--text)}
.kpi.rented .kpi-val{color:var(--blue)}
.kpi.vacant .kpi-val{color:var(--indigo)}
.kpi.unpaid .kpi-val{color:var(--red)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-hd{font-size:13px;font-weight:700;color:var(--hdr2);margin-bottom:12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);padding-bottom:10px}
.status-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px;transition:background .12s}
.status-row:last-child{border-bottom:none}
.status-row:active{background:#F0F4F8}
.room-num{font-size:14px;font-weight:800;color:var(--hdr);min-width:40px}
.tenant-nm{flex:1;font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rent-amt{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.badge{display:inline-block;padding:3px 7px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-rented{background:var(--blue-lt);color:var(--blue-t)}
.badge-vacant{background:var(--red-lt);color:var(--red-t)}
.badge-paid{background:var(--green-lt);color:var(--green-t)}
.badge-unpaid{background:var(--red-lt);color:var(--red-t)}
.badge-warning{background:var(--amber-lt);color:var(--amber-t)}
.badge-oneroom{background:#FEF3C7;color:#92400E}
.badge-twobay{background:#F3E8FF;color:#6B21A8}
.badge-tworoom{background:#CCFBF1;color:#0F766E}
.badge-threeroom{background:#EEF2FF;color:#3730A3}
.badge-monthly{background:#FFF7ED;color:#C2410C}
.badge-jeonse{background:#EDE9FE;color:#5B21B6}
/* NOTES */
.note-input-row{display:flex;gap:8px;margin-bottom:12px}
.note-ta{flex:1;border:2px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;resize:none;outline:none;color:var(--text);background:#FAFCFF}
.note-ta:focus{border-color:var(--sky)}
.btn-add{background:var(--hdr);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.note-item{background:#F8FAFC;border-radius:10px;padding:12px;margin-bottom:8px}
.note-item:last-child{margin-bottom:0}
.note-content{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:6px;white-space:pre-wrap;word-break:break-all}
.note-footer{display:flex;align-items:center;justify-content:space-between}
.note-date{font-size:11px;color:var(--hint)}
.note-btns{display:flex;gap:4px}
.note-btn{width:28px;height:28px;border:none;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.note-btn.edit{background:var(--blue-lt);color:var(--blue)}
.note-btn.del{background:var(--red-lt);color:var(--red)}
.empty-small{text-align:center;padding:20px;color:var(--hint);font-size:13px}
.expiry-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px;transition:background .12s}
.expiry-row:last-child{border-bottom:none}
.expiry-row:active{background:#F0F4F8}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--hdr)}
.modal p{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6;white-space:pre-line}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.modal-btns button{padding:10px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-cancel{background:#F3F4F6;color:var(--sub)}
.btn-confirm{background:var(--hdr);color:#fff}
.btn-danger{background:var(--red-lt);color:var(--red)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.field textarea{border:2px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;outline:none;color:var(--text);background:#FAFCFF;width:100%}
.field textarea:focus{border-color:var(--sky)}
/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1F2937;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:calc(100vw - 48px);text-align:center;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
/* LOGIN — display:none 으로 시작, auth 확인 후에만 표시 */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);z-index:7000;display:none;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:36px 28px;max-width:320px;width:100%;text-align:center;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{margin-bottom:22px}
.login-logo img{width:180px;height:auto;filter:drop-shadow(0 4px 16px rgba(77,208,225,.4))}
.login-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.5px}
.login-sub{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:28px;line-height:1.7}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;background:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;color:#1F2937;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .15s}
.google-btn:active{transform:scale(.97)}
.g-icon{width:18px;height:18px;flex-shrink:0}
.login-footer{font-size:10px;color:rgba(255,255,255,.25);margin-top:18px;line-height:1.7}
/* SYNC */
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-ok{background:#4CAF50}.s-err{background:#EF5350}.s-ing{background:#FFA726;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.bld-subhd{font-size:11px;font-weight:800;color:var(--sub);padding:10px 4px 4px;letter-spacing:.5px;border-top:1px solid var(--border);margin-top:4px}
.bld-subhd:first-child{border-top:none;padding-top:4px;margin-top:0}
</style>
</head>
<body>

<!-- 로그인 화면: display:none 으로 시작 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><img src="logo.png" alt="PlusHome"></div>
    <div class="login-title">월세 관리</div>
    <div id="login-aptname" style="font-size:16px;font-weight:700;color:#4DD0E1;margin-bottom:4px;display:none"></div>
    <div class="login-sub">임대 현황을 한눈에 관리하세요<br>Google 계정으로 안전하게 로그인</div>
    <button class="google-btn" onclick="signInGoogle()">
      <svg class="g-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 로그인
    </button>
    <button onclick="enterDemoMode()" style="margin-top:10px;width:100%;padding:11px;background:rgba(14,165,233,.15);border:1.5px solid rgba(14,165,233,.4);border-radius:12px;color:#7DD3FC;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">👀 로그인 없이 구경하기</button>
    <div class="login-footer">데이터는 본인 Google 계정에만 저장됩니다</div>
  </div>
</div>

<div id="status-screen" style="display:none;position:fixed;inset:0;background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);z-index:7000;align-items:center;justify-content:center;padding:20px">
  <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:36px 28px;max-width:320px;width:100%;text-align:center;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="font-size:52px;margin-bottom:14px" id="ss-icon">⏳</div>
    <div style="font-size:20px;font-weight:900;color:#fff;margin-bottom:8px" id="ss-title"></div>
    <div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;line-height:1.7;white-space:pre-line" id="ss-msg"></div>
    <div style="font-size:11px;color:rgba(255,255,255,.3);margin-bottom:24px" id="ss-email"></div>
    <button onclick="auth.signOut().then(()=>location.reload())" style="width:100%;padding:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">로그아웃</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-top">
      <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
        <a href="index.html" style="flex-shrink:0;display:flex;align-items:center;line-height:0">
          <img src="logo.png" alt="PlusHome" style="height:40px;width:auto;image-rendering:-webkit-optimize-contrast">
        </a>
      </div>
      <div class="hdr-actions">
        <span id="sync-st" style="font-size:10px"></span>

        <a class="guide-btn" href="guide.html">❓ 도움말</a>
        <div id="av-wrap" onclick="toggleMenu()" style="display:none"></div>
      </div>
    </div>
    <div class="nav">
      <a href="index.html" class="nav-tab on">📊 메인</a>
      <a href="units.html" class="nav-tab">🏠 세대</a>
      <a href="expense.html" class="nav-tab">💸 지출</a>
      <a href="admin.html" class="nav-tab">🗂 관리</a>
    </div>
  </div>
  <div id="user-menu" class="user-menu">
    <div class="um-name" id="um-name">—</div>
    <div class="um-email" id="um-email">—</div>
    <button class="logout-btn" onclick="doSignOut()">🚪 로그아웃</button>
  </div>

  <div class="content">
    <div class="stats-grid">
      <div class="kpi total" onclick="goUnits()"><div class="kpi-val" id="s-total">—</div><div class="kpi-lbl">전체</div></div>
      <div class="kpi rented" onclick="goUnits('rented')"><div class="kpi-val" id="s-rented">—</div><div class="kpi-lbl">임대중</div></div>
      <div class="kpi vacant" onclick="goUnits('vacant')"><div class="kpi-val" id="s-vacant">—</div><div class="kpi-lbl">공실</div></div>
      <div class="kpi unpaid" onclick="goUnits('unpaid')"><div class="kpi-val" id="s-unpaid">—</div><div class="kpi-lbl">미납</div></div>
    </div>

    <div class="card">
      <div class="card-hd">🔴 이달 미납 현황</div>
      <div id="unpaid-list"><div class="empty-small">로딩 중...</div></div>
    </div>

    <div class="card">
      <div class="card-hd">🟣 공실 현황</div>
      <div id="vacant-list"><div class="empty-small">로딩 중...</div></div>
    </div>

    <div class="card">
      <div class="card-hd">⚠️ 계약 만료 임박 (30일 이내)</div>
      <div id="expiry-list"><div class="empty-small">로딩 중...</div></div>
    </div>

    <div class="card">
      <div class="card-hd">📝 특이사항 메모</div>
      <div class="note-input-row">
        <textarea class="note-ta" id="note-input" rows="2" placeholder="임차인 요청사항, 수리 필요 사항 등..."></textarea>
        <button class="btn-add" onclick="addNote()">추가</button>
      </div>
      <div id="notes-list"></div>
    </div>

    <div id="buildings-wrap"></div>

  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-bg" id="confirm-modal">
  <div class="modal">
    <h3 id="confirm-title">확인</h3>
    <p id="confirm-msg"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeConfirm()">취소</button>
      <button class="btn-danger" id="confirm-ok">삭제</button>
    </div>
  </div>
</div>

<!-- EDIT NOTE MODAL -->
<div class="modal-bg" id="edit-note-modal">
  <div class="modal">
    <h3>✏️ 메모 수정</h3>
    <input type="hidden" id="edit-note-id">
    <div class="field">
      <label>내용</label>
      <textarea id="edit-note-content" rows="4"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEditNote()">취소</button>
      <button class="btn-confirm" onclick="saveEditNote()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let cu=null,mUid="",mName="",readOnly=false;
let bldgsData={},curBid="main",bldgsRef=null,bldgsL=null;
let allBldData={}; // {bid:{units:{},history:{},bldInfo:{}}}
let _alertTimer=null;
let bldListeners={}; // {bid:{uRef,hRef,biRef,uL,hL,biL}}
let nRef=null,nL=null,notes={};

function enterDemoMode(){
  readOnly=true;sessionStorage.setItem("guestDemo","1");
  bldgsData=DEMO.bldgsData;curBid="main";
  allBldData["main"]={units:DEMO.units,history:DEMO.rentHistory,bldInfo:DEMO.bldInfo};
  notes=DEMO.notes;
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="block";
  showDemoBanner();renderDash();renderBldCards();renderNotes();setSS("ok");
}

// ── AUTH STATE ── (탭 이동 시 flash 없음: login-screen은 display:none 시작)
auth.onAuthStateChanged(async user=>{
  const ls=document.getElementById("login-screen");
  const app=document.getElementById("app");
  if(user){
    cu=user;
    if(user.uid!==MASTER_UID){const access=await checkUserAccess(user);if(access===false)return;if(access==="readonly")readOnly=true;}
    const w=document.getElementById("av-wrap");
    w.innerHTML=user.photoURL?`<img class="av-img" src="${user.photoURL}">`:`<div class="av-txt">${(user.displayName||"U")[0]}</div>`;
    w.style.display="block";
    document.getElementById("um-name").textContent=user.displayName||"사용자";
    document.getElementById("um-email").textContent=user.email||"";

    const params=new URLSearchParams(location.search);
    mUid=params.get("master_uid")||"";
    mName=params.get("master_name")||"";
    const targetUid=(user.uid===MASTER_UID&&mUid)?mUid:user.uid;
    if(user.uid===MASTER_UID&&mUid){
      if(!document.getElementById("master-view-banner")){
        const banner=document.createElement("div");
        banner.id="master-view-banner";
        banner.style.cssText="position:fixed;top:100px;left:0;right:0;z-index:150;background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(245,158,11,.05));border-bottom:1px solid rgba(245,158,11,.3);padding:8px 16px;display:flex;align-items:center;justify-content:space-between";
        banner.innerHTML=`<span style="font-size:12px;font-weight:700;color:#F59E0B">🔧 열람 중: ${esc(mName||mUid)}</span><button onclick="location.href='admin-master.html'" style="background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);border-radius:8px;padding:5px 12px;color:#F59E0B;font-size:11px;font-weight:700;cursor:pointer">← 관리자</button>`;
        document.body.appendChild(banner);
        document.querySelector(".content").style.marginTop="136px";
        document.querySelectorAll(".nav-tab").forEach(a=>{
          const u=new URL(a.href,location.href);
          u.searchParams.set("master_uid",mUid);
          u.searchParams.set("master_name",mName);
          a.href=u.pathname+"?"+u.searchParams.toString();
        });
      }
    }

    // Migration (only for own account)
    if(user.uid===targetUid){
      try{await migrateToMultiBldg(user.uid)}catch(e){}
    }
    curBid=getCurBid(targetUid);

    if(readOnly){enterDemoMode();return;}

    ls.style.display="none";app.style.display="block";

    // Notes for current building
    if(nL&&nRef)nRef.off("value",nL);
    nRef=db.ref("rent_app/"+targetUid+"/"+curBid+"/notes");
    nL=nRef.on("value",snap=>{notes=snap.val()||{};renderNotes()});

    // Building registry listener
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
    bldgsRef=db.ref("rent_app/"+targetUid+"/_buildings");
    bldgsL=bldgsRef.on("value",snap=>{
      bldgsData=snap.val()||{};
      const bids=sortedBids(bldgsData);
      if(bids.length&&!bldgsData[curBid]){curBid=bids[0];setCurBid(targetUid,curBid)}
      // Sync per-building listeners
      bids.forEach(bid=>{if(!bldListeners[bid])setupBldListeners(targetUid,bid)});
      Object.keys(bldListeners).forEach(bid=>{if(!bldgsData[bid])teardownBldListeners(bid)});
      renderDash();renderBldCards();
    });
    setSS("ok");
  }else{
    if(sessionStorage.getItem("guestDemo")==="1"){enterDemoMode();return;}
    cu=null;teardownAll();
    app.style.display="none";ls.style.display="flex";
  }
});

function setupBldListeners(uid,bid){
  if(bldListeners[bid])return;
  if(!allBldData[bid])allBldData[bid]={};
  const base=db.ref("rent_app/"+uid+"/"+bid);
  const uRef=base.child("units"),hRef=base.child("rent_history"),biRef=base.child("buildings"),rlRef=base.child("config/roomLayout");
  const uL=uRef.on("value",snap=>{allBldData[bid].units=snap.val()||{};renderDash();setSS("ok")},()=>setSS("err"));
  const hL=hRef.on("value",snap=>{allBldData[bid].history=snap.val()||{};renderDash()});
  const biL=biRef.on("value",snap=>{allBldData[bid].bldInfo=snap.val()||{};renderBldCards()});
  const rlL=rlRef.on("value",snap=>{allBldData[bid].roomLayout=snap.val()||null;renderDash()});
  bldListeners[bid]={uRef,hRef,biRef,rlRef,uL,hL,biL,rlL};
}
function teardownBldListeners(bid){
  const l=bldListeners[bid];if(!l)return;
  if(l.uRef&&l.uL)l.uRef.off("value",l.uL);
  if(l.hRef&&l.hL)l.hRef.off("value",l.hL);
  if(l.biRef&&l.biL)l.biRef.off("value",l.biL);
  if(l.rlRef&&l.rlL)l.rlRef.off("value",l.rlL);
  delete bldListeners[bid];delete allBldData[bid];
}
function teardownAll(){
  Object.keys(bldListeners).forEach(teardownBldListeners);
  if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
  if(nL&&nRef)nRef.off("value",nL);
}



function doSignOut(){closeMenu();teardownAll();auth.signOut()}

function setSS(s){
  const el=document.getElementById("sync-st");if(!el)return;
  const cls=s==="ok"?"s-ok":s==="ing"?"s-ing":"s-err";
  el.innerHTML=`<span class="sync-dot ${cls}" title="${s==="ok"?"동기화됨":s==="ing"?"저장중":"오류"}"></span>`;
}

function computePaidStatus(bid,roomId){
  const h=((allBldData[bid]||{}).history||{})[String(roomId)]||{};
  const recs=Object.values(h);
  if(!recs.length)return null;
  if(recs.some(r=>r.partial))return "partial";
  return recs.some(r=>!r.paid)?false:true;
}

function renderDash(){
  const bids=sortedBids(bldgsData);
  let tot=0,rented=0,vacant=0,unpaidCnt=0;
  bids.forEach(bid=>{
    const rl=allBldData[bid]?.roomLayout;
    const rlRooms=rl?new Set(Object.values(rl).flat().map(String)):null;
    const rlCount=rlRooms?rlRooms.size:null;
    const ul=Object.values((allBldData[bid]||{}).units||{});
    const r=(rlRooms?ul.filter(u=>rlRooms.has(String(u.room))):ul).filter(u=>u.status==="rented");
    rented+=r.length;
    if(rlCount!==null){
      tot+=rlCount;
      vacant+=rlCount-r.length;
    }else{
      tot+=ul.length;
      vacant+=ul.filter(u=>u.status==="vacant").length;
    }
    unpaidCnt+=r.filter(u=>{const ps=computePaidStatus(bid,u.room);return ps===false||ps==="partial";}).length;
  });
  document.getElementById("s-total").textContent=tot;
  document.getElementById("s-rented").textContent=rented;
  document.getElementById("s-vacant").textContent=vacant;
  document.getElementById("s-unpaid").textContent=unpaidCnt;

  // Unpaid
  let uHtml="";
  bids.forEach(bid=>{
    const rl=allBldData[bid]?.roomLayout;
    const rlRooms=rl?new Set(Object.values(rl).flat().map(String)):null;
    const ul=Object.values((allBldData[bid]||{}).units||{});
    const up=(rlRooms?ul.filter(u=>rlRooms.has(String(u.room))):ul).filter(u=>{const ps=computePaidStatus(bid,u.room);return u.status==="rented"&&(ps===false||ps==="partial");})
      .sort((a,b)=>String(a.room).localeCompare(String(b.room)));
    if(!up.length)return;
    uHtml+=`<div class="bld-subhd">${esc(bldgsData[bid]?.name||"")}</div>`;
    uHtml+=up.map(u=>{
      const ps=computePaidStatus(bid,u.room);
      const pBadge=ps==="partial"?`<span class="badge" style="background:#FEF3C7;color:#92400E">🔶 부분납부</span>`:`<span class="badge badge-unpaid">❌ 미납</span>`;
      return`<div class="status-row" onclick="goToUnit('${bid}','${u.room}')">
      <span class="room-num">${u.room}호</span>${rentTypeBadge(u)}${rtBadge(u)}
      <span class="tenant-nm">${esc(names(u))}</span>
      <span class="rent-amt">${fmtWon(u.monthlyRent)}</span>
      ${pBadge}<span style="font-size:14px;color:var(--hint)">›</span></div>`;}).join("");
  });
  document.getElementById("unpaid-list").innerHTML=uHtml||'<div class="empty-small">✅ 이달 미납 없음</div>';

  // Vacant
  let vHtml="";
  bids.forEach(bid=>{
    const rl=allBldData[bid]?.roomLayout;
    const ul=Object.values((allBldData[bid]||{}).units||{});
    const unitMap=Object.fromEntries(ul.map(u=>[String(u.room),u]));
    const rentedRooms=new Set(ul.filter(u=>u.status==="rented").map(u=>String(u.room)));
    let vacItems=[];
    if(rl){
      Object.values(rl).flat().map(String).forEach(room=>{
        if(!rentedRooms.has(room))vacItems.push({room,unit:unitMap[room]||null});
      });
    }else{
      ul.filter(u=>u.status==="vacant").forEach(u=>vacItems.push({room:String(u.room),unit:u}));
    }
    vacItems.sort((a,b)=>String(a.room).localeCompare(String(b.room)));
    if(!vacItems.length)return;
    vHtml+=`<div class="bld-subhd">${esc(bldgsData[bid]?.name||"")}</div>`;
    vHtml+=vacItems.map(({room,unit})=>`<div class="status-row" onclick="goToUnit('${bid}','${room}')">
      <span class="room-num">${room}호</span>${unit?rentTypeBadge(unit):""}${unit?rtBadge(unit):""}
      ${unit?.memo?`<span class="tenant-nm" style="color:var(--sub);font-size:12px">${esc(unit.memo.split('\n')[0])}</span>`:''}
      <span class="badge badge-vacant">공실</span>
      <span style="font-size:14px;color:var(--hint)">›</span></div>`).join("");
  });
  document.getElementById("vacant-list").innerHTML=vHtml||'<div class="empty-small">🏠 공실 없음</div>';

  // Expiry
  const today=new Date();today.setHours(0,0,0,0);
  let eHtml="";
  bids.forEach(bid=>{
    const rl=allBldData[bid]?.roomLayout;
    const rlRooms=rl?new Set(Object.values(rl).flat().map(String)):null;
    const ul=Object.values((allBldData[bid]||{}).units||{});
    const soon=(rlRooms?ul.filter(u=>rlRooms.has(String(u.room))):ul).filter(u=>u.status==="rented"&&u.contractEnd).map(u=>{
      const d=new Date(u.contractEnd);d.setHours(0,0,0,0);
      return{...u,dl:Math.ceil((d-today)/864e5)};
    }).filter(u=>u.dl>=0&&u.dl<=30).sort((a,b)=>a.dl-b.dl);
    if(!soon.length)return;
    eHtml+=`<div class="bld-subhd">${esc(bldgsData[bid]?.name||"")}</div>`;
    eHtml+=soon.map(u=>`<div class="expiry-row" onclick="goToUnit('${bid}','${u.room}')">
      <span class="room-num">${u.room}호</span>${rentTypeBadge(u)}${rtBadge(u)}
      <span class="tenant-nm">${esc(names(u))}</span>
      <span class="badge badge-warning">${u.contractEnd}</span>
      <span style="font-size:11px;font-weight:700;color:${u.dl<=7?"var(--red)":"var(--amber)"};min-width:40px;text-align:right">${u.dl}일 후</span>
      <span style="font-size:14px;color:var(--hint)">›</span></div>`).join("");
  });
  document.getElementById("expiry-list").innerHTML=eHtml||'<div class="empty-small">✅ 30일 내 만료 없음</div>';
  clearTimeout(_alertTimer);_alertTimer=setTimeout(checkContractAlerts,900);
}

function checkContractAlerts(){
  const today=new Date();today.setHours(0,0,0,0);
  const alerts=[];
  sortedBids(bldgsData).forEach(bid=>{
    const bldName=bldgsData[bid]?.name||"";
    Object.values((allBldData[bid]||{}).units||{}).forEach(u=>{
      if(!u?.contractEnd||u.status!=="rented")return;
      const d=new Date(u.contractEnd);d.setHours(0,0,0,0);
      const dl=Math.ceil((d-today)/864e5);
      if(dl>=0&&dl<=30)alerts.push({room:u.room,name:u.tenantName||"",dl,bldName});
    });
  });
  if(alerts.length)sessionStorage.setItem("ca_alerts",JSON.stringify(alerts.sort((a,b)=>a.dl-b.dl)));
  else sessionStorage.removeItem("ca_alerts");
  maybeShowAlerts();
}
function renderBldCards(){
  const el=document.getElementById("buildings-wrap");if(!el)return;
  const bids=sortedBids(bldgsData);
  const html=bids.flatMap(bid=>{
    const bldInfo=(allBldData[bid]||{}).bldInfo||{};
    return Object.values(bldInfo).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).map(b=>
      `<div style="background:linear-gradient(135deg,#1E2D3D 0%,#2A3F55 100%);border-radius:14px;padding:18px 20px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.06)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)">
          <span style="font-size:20px">🏠</span>
          <span style="font-size:16px;font-weight:900;color:#fff">${esc(b.name)}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${b.entranceCode||b.masterCode?`<div style="display:grid;grid-template-columns:${b.entranceCode&&b.masterCode?"1fr 1fr":"1fr"};gap:12px">
            ${b.entranceCode?`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px">🔐</span><div><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px">1층 현관</div><div style="font-size:15px;font-weight:900;color:#4DD0E1;letter-spacing:1px">${esc(b.entranceCode)}</div></div></div>`:""}
            ${b.masterCode?`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px">🗝️</span><div><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px">세대 마스터</div><div style="font-size:15px;font-weight:900;color:#4DD0E1;letter-spacing:1px">${esc(b.masterCode)}</div></div></div>`:""}
          </div>`:""}
          ${b.manageFee?`<div style="display:flex;align-items:center;gap:8px;padding-top:4px;border-top:1px solid rgba(255,255,255,.07)"><span style="font-size:16px;flex-shrink:0">🏦</span><div><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px">관리비 계좌</div><div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.85)">${esc(b.manageFee)}</div></div></div>`:""}
          ${b.address?`<div style="display:flex;align-items:center;gap:8px;padding-top:4px;border-top:1px solid rgba(255,255,255,.07)"><span style="font-size:16px;flex-shrink:0">📍</span><div style="font-size:13px;font-weight:600;color:rgba(255,255,255,.75);line-height:1.6">${esc(b.address)}</div></div>`:""}
        </div>
      </div>`);
  }).join("");
  el.innerHTML=html;
}

function renderNotes(){
  const list=Object.values(notes).sort((a,b)=>b.id-a.id);
  const el=document.getElementById("notes-list");
  if(!list.length){el.innerHTML='<div class="empty-small">메모가 없습니다</div>';return}
  el.innerHTML=list.map(n=>`<div class="note-item">
    <div class="note-content">${esc(n.content)}</div>
    <div class="note-footer">
      <span class="note-date">${fmtDt(n.createdAt)}</span>
      <div class="note-btns">
        <button class="note-btn edit" onclick="startEdit(${n.id})">✏️</button>
        <button class="note-btn del" onclick="delNote(${n.id})">✕</button>
      </div>
    </div>
  </div>`).join("");
}
function addNote(){
  if(!guardWrite())return;
  const ta=document.getElementById("note-input"),c=ta.value.trim();
  if(!c){showToast("❗ 내용을 입력하세요");return}
  const id=Date.now();setSS("ing");
  nRef.child(String(id)).set({id,content:c,createdAt:new Date().toISOString()})
    .then(()=>{ta.value="";showToast("✅ 메모 추가됨");setSS("ok")})
    .catch(()=>{setSS("err");showToast("❗ 저장 실패")});
}
function startEdit(id){
  const n=notes[id];if(!n)return;
  document.getElementById("edit-note-id").value=id;
  document.getElementById("edit-note-content").value=n.content;
  document.getElementById("edit-note-modal").classList.add("show");
}
function closeEditNote(){document.getElementById("edit-note-modal").classList.remove("show")}
function saveEditNote(){if(!guardWrite())return;
  const id=document.getElementById("edit-note-id").value;
  const c=document.getElementById("edit-note-content").value.trim();
  if(!c){showToast("❗ 내용을 입력하세요");return}
  setSS("ing");
  nRef.child(String(id)).update({content:c}).then(()=>{closeEditNote();showToast("✅ 수정됨");setSS("ok")}).catch(()=>{setSS("err");showToast("❗ 실패")});
}
function delNote(id){
  if(!guardWrite())return;
  showConfirm("메모 삭제","이 메모를 삭제하시겠습니까?",()=>{
    setSS("ing");nRef.child(String(id)).remove().then(()=>{showToast("🗑 삭제됨");setSS("ok")}).catch(()=>{setSS("err");showToast("❗ 실패")});
  });
}
function showConfirm(title,msg,cb){
  document.getElementById("confirm-title").textContent=title;
  document.getElementById("confirm-msg").textContent=msg;
  document.getElementById("confirm-ok").onclick=()=>{cb();closeConfirm()};
  document.getElementById("confirm-modal").classList.add("show");
}
function closeConfirm(){document.getElementById("confirm-modal").classList.remove("show")}
function names(u){return[u.tenantName,u.tenantName2].filter(Boolean).join(" / ")||"(미입력)"}
const RTYPE_LBL={oneroom:"원룸",twobay:"투베이",tworoom:"투룸",threeroom:"쓰리룸"};
const RTYPE_CLS={oneroom:"badge-oneroom",twobay:"badge-twobay",tworoom:"badge-tworoom",threeroom:"badge-threeroom"};
const RENT_TYPE_CLS={monthly:"badge-monthly",jeonse:"badge-jeonse"};
function rtBadge(u){const l=RTYPE_LBL[u.roomType];return l?`<span class="badge ${RTYPE_CLS[u.roomType]}">${l}</span>`:""}
function rentTypeBadge(u){const t=u.rentType||"monthly";return`<span class="badge ${RENT_TYPE_CLS[t]}">${t==="jeonse"?"전세":"월세"}</span>`}
function mQs(){return mUid?`&master_uid=${encodeURIComponent(mUid)}&master_name=${encodeURIComponent(mName)}`:""}
function goToUnit(bid,room){
  const targetUid=(cu?.uid===MASTER_UID&&mUid)?mUid:cu?.uid||"";
  setCurBid(targetUid,bid);
  location.href=`units.html?room=${room}${mQs()}`;
}
function goUnits(filter){
  location.href=`units.html${filter?"?filter="+filter:""}${mUid?(filter?"&":"?")+"master_uid="+encodeURIComponent(mUid)+"&master_name="+encodeURIComponent(mName):""}`;
}
function fmtDt(iso){if(!iso)return"";const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
</script>
