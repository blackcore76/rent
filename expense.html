<style>
:root{
  --bg:#F0F4F8;--card:#fff;--border:#E2E8F0;--text:#1E293B;--sub:#64748B;--hint:#94A3B8;
  --hdr:#1E2D3D;--hdr2:#2A3F55;
  --green:#059669;--green-lt:#D1FAE5;--green-t:#065F46;
  --red:#DC2626;--red-lt:#FEE2E2;--red-t:#991B1B;
  --blue:#0284C7;--blue-lt:#E0F2FE;--blue-t:#0C4A6E;
  --sky:#0EA5E9;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,var(--hdr),var(--hdr2));box-shadow:0 3px 16px rgba(0,0,0,.25);padding:0 16px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.hdr-title{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.5px}
.hdr-actions{display:flex;align-items:center;gap:8px;position:relative}
.av-img{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;object-fit:cover}
.av-txt{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--sky);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.guide-btn{padding:5px 10px;background:rgba(14,165,233,.15);border:1.5px solid rgba(14,165,233,.5);border-radius:8px;color:#7DD3FC;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:background .15s;text-decoration:none;display:flex;align-items:center;gap:3px}
.guide-btn:active{background:rgba(14,165,233,.32)}
.admin-btn{padding:5px 10px;background:rgba(255,200,0,.15);border:1.5px solid rgba(255,200,0,.5);border-radius:8px;color:#FFD700;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:none;letter-spacing:.3px;transition:background .15s}
.admin-btn:active{background:rgba(255,200,0,.32)}
.nav{display:flex;border-top:1px solid rgba(255,255,255,.08)}
.nav-tab{flex:1;padding:9px 2px 11px;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,.4);border-bottom:3px solid transparent;text-decoration:none;transition:all .2s;white-space:nowrap}
.nav-tab.on{color:#fff;border-bottom-color:var(--sky);font-weight:700}
.user-menu{position:fixed;top:56px;right:12px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.2);padding:16px;min-width:210px;z-index:300;display:none;border:1px solid var(--border)}
.user-menu.show{display:block}
.um-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.um-email{font-size:12px;color:var(--hint);margin-bottom:12px;word-break:break-all}
.logout-btn{width:100%;padding:9px;background:var(--red-lt);color:var(--red);border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.content{margin-top:100px;padding:14px;min-height:calc(100vh - 100px)}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:12px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.kpi-val{font-size:16px;font-weight:900;line-height:1;margin-bottom:3px}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.3px}
.kpi.income .kpi-val{color:var(--green)}
.kpi.expense .kpi-val{color:var(--red)}
.kpi.net .kpi-val{color:var(--blue)}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=month]{border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;font-family:inherit;outline:none;color:var(--text)}
.toolbar input[type=month]:focus{border-color:var(--sky)}
.spacer{flex:1}
.btn-exp{background:#fff;border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--sub)}
.view-tabs{display:flex;gap:6px;margin-bottom:10px}
.view-tab{padding:6px 14px;border-radius:20px;border:2px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);transition:all .15s}
.view-tab.active{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.filter-year{border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;font-family:inherit;outline:none;color:var(--text)}
.filter-year:focus{border-color:var(--sky)}
.fab{position:fixed;bottom:28px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--hdr);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:100;transition:transform .15s}
.fab:active{transform:scale(.92)}
.card{background:var(--card);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.tx-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-icon.income{background:var(--green-lt)}
.tx-icon.expense{background:var(--red-lt)}
.tx-body{flex:1;min-width:0}
.tx-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.tx-cat{font-size:12px;font-weight:700;color:var(--sub)}
.tx-date{font-size:11px;color:var(--hint)}
.tx-memo{font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-size:15px;font-weight:900;white-space:nowrap;flex-shrink:0}
.tx-amt.income{color:var(--green)}.tx-amt.expense{color:var(--red)}
.tx-del{width:28px;height:28px;border:none;background:var(--red-lt);color:var(--red);border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;margin-bottom:80px}
.page-btn{padding:8px 16px;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--sub)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:13px;color:var(--sub);font-weight:600}
.empty-st{text-align:center;padding:48px 20px;color:var(--hint)}
.empty-st .ei{font-size:48px;margin-bottom:12px}
.empty-st .et{font-size:14px}
/* SHEET */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:520px;box-shadow:0 -4px 32px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}

.sheet-close{width:32px;height:32px;border:none;background:#F3F4F6;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toggle-group{display:flex;border:2px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.tg-btn{flex:1;padding:11px 8px;border:none;background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);transition:all .15s}
.tg-btn.on-green{background:var(--green);color:#fff}
.tg-btn.on-red{background:var(--red);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{border:2px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;color:var(--text);background:#FAFCFF;width:100%;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky);background:#fff}
.field textarea{resize:none}
.btn-save{width:100%;padding:15px;background:var(--hdr);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.btn-save:active{opacity:.85}
/* CONFIRM */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:20px;padding:24px;max-width:340px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.confirm-box h3{font-size:15px;font-weight:700;color:var(--hdr);margin-bottom:10px}
.confirm-box p{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6}
.confirm-btns{display:flex;gap:10px;justify-content:flex-end}
.confirm-btns button{padding:9px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1F2937;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0F1C2D,#1E2D3D 50%,#2A3F55);z-index:7000;display:none;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:36px 28px;max-width:320px;width:100%;text-align:center;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{font-size:52px;margin-bottom:14px}
.login-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.5px}
.login-sub{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:28px;line-height:1.7}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;background:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;color:#1F2937;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .15s}
.google-btn:active{transform:scale(.97)}
.g-icon{width:18px;height:18px;flex-shrink:0}
.login-footer{font-size:10px;color:rgba(255,255,255,.25);margin-top:18px;line-height:1.7}
</style>
</head>

  let bname=localStorage.getItem("rent_aptname")||"내 건물";
  try{
    const bs=await db.ref("rent_app/"+uid+"/buildings").once("value");
    if(bs.exists()){const v=Object.values(bs.val());if(v.length&&v[0]?.name)bname=v[0].name}
  }catch(e){}
  const OLD=["units","rent_history","config","transactions","notes","buildings"];
  for(const p of OLD){
    try{
      const s=await db.ref("rent_app/"+uid+"/"+p).once("value");
      if(s.exists()){
        await db.ref("rent_app/"+uid+"/main/"+p).set(s.val());
        await db.ref("rent_app/"+uid+"/"+p).remove();
      }
    }catch(e){}
  }
  await db.ref("rent_app/"+uid+"/_buildings/main").set({id:"main",name:bname,order:0,createdAt:new Date().toISOString()});
  localStorage.setItem("mig_"+uid,"1");
}


(function(){const n=new Date();document.getElementById("filter-month").value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;filterMonth=document.getElementById("filter-month").value;filterYear=String(n.getFullYear())})();

async function checkUserAccess(user){
  const ref=db.ref("_users/"+user.uid);
  const snap=await ref.once("value");
  let status;
  if(!snap.exists()){
    await ref.set({uid:user.uid,displayName:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"",status:"pending",createdAt:new Date().toISOString()});
    status="pending";
  }else{
    status=snap.val().status||"pending";
  }
  if(status==="active")return true;
  if(status==="rejected"){
    const ss=document.getElementById("status-screen");
    document.getElementById("ss-email").textContent=user.email||"";
    document.getElementById("ss-icon").textContent="🚫";
    document.getElementById("ss-title").textContent="사용 승인이 거부됐습니다";
    document.getElementById("ss-msg").textContent="자세한 사항은 관리자에게 문의하세요.";
    ss.style.display="flex";
    return false;
  }
  return "readonly";
}
function showDemoBanner(){
  if(document.getElementById("demo-banner"))return;
  const b=document.createElement("div");
  b.id="demo-banner";
  b.style.cssText="position:fixed;top:100px;left:0;right:0;z-index:150;background:linear-gradient(135deg,rgba(14,165,233,.18),rgba(14,165,233,.06));border-bottom:1px solid rgba(14,165,233,.35);padding:8px 16px;display:flex;align-items:center;justify-content:space-between";
  const btn=cu
    ?`<button onclick="auth.signOut()" style="background:rgba(14,165,233,.2);border:1px solid rgba(14,165,233,.4);border-radius:8px;padding:5px 12px;color:#0EA5E9;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🚪 로그아웃</button>`
    :`<button onclick="sessionStorage.removeItem('guestDemo');location.reload()" style="background:rgba(14,165,233,.2);border:1px solid rgba(14,165,233,.4);border-radius:8px;padding:5px 12px;color:#0EA5E9;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🔑 로그인</button>`;
  b.innerHTML=`<span style="font-size:12px;font-weight:700;color:#0EA5E9">👀 구경 모드 · 데모 데이터 표시 중</span>${btn}`;
  document.body.appendChild(b);
  document.querySelector(".content").style.marginTop="136px";
}
function guardWrite(){if(!readOnly)return true;showToast("⏳ 승인 후 이용 가능합니다");return false;}
function enterDemoMode(){
  readOnly=true;sessionStorage.setItem("guestDemo","1");
  bldgsData=DEMO.bldgsData;curBid="main";
  allTx=[...DEMO.transactions].sort((a,b)=>b.date.localeCompare(a.date)||(b.id-a.id));
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="block";
  showDemoBanner();renderFeed();
}

auth.onAuthStateChanged(async user=>{
  const ls=document.getElementById("login-screen"),app=document.getElementById("app");
  if(user){
    cu=user;
    if(user.uid!==MASTER_UID){const access=await checkUserAccess(user);if(access===false)return;if(access==="readonly")readOnly=true;}
    const w=document.getElementById("av-wrap");
    w.innerHTML=user.photoURL?`<img class="av-img" src="${user.photoURL}">`:`<div class="av-txt">${(user.displayName||"U")[0]}</div>`;
    w.style.display="block";
    document.getElementById("um-name").textContent=user.displayName||"사용자";
    document.getElementById("um-email").textContent=user.email||"";
    if(user.uid===MASTER_UID)document.getElementById("admin-btn").style.display="block";
    if(txL&&txRef)txRef.off("value",txL);
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
    const params=new URLSearchParams(location.search);
    mUid=params.get("master_uid")||"";
    mName=params.get("master_name")||"";
    const targetUid=(user.uid===MASTER_UID&&mUid)?mUid:user.uid;
    if(user.uid===MASTER_UID&&mUid){
      if(!document.getElementById("master-view-banner")){
        const banner=document.createElement("div");
        banner.id="master-view-banner";
        banner.style.cssText="position:fixed;top:100px;left:0;right:0;z-index:150;background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(245,158,11,.05));border-bottom:1px solid rgba(245,158,11,.3);padding:8px 16px;display:flex;align-items:center;justify-content:space-between";
        banner.innerHTML=`<span style="font-size:12px;font-weight:700;color:#F59E0B">🔧 열람 중: ${esc(mName||mUid)}</span><button onclick="location.href='admin-master.html'" style="font-size:11px;font-weight:700;background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#F59E0B;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit">← 관리자</button>`;
        document.body.appendChild(banner);
        document.querySelector(".content").style.marginTop="136px";
        document.querySelectorAll(".nav-tab").forEach(a=>{
          const u=new URL(a.href,location.href);
          u.searchParams.set("master_uid",mUid);
          u.searchParams.set("master_name",mName||"");
          a.href=u.pathname+"?"+u.searchParams.toString();
        });
      }
    }

    // Migration (only for own account)
    if(user.uid===targetUid){
      try{await migrateToMultiBldg(user.uid)}catch(e){}
    }
    curBid=getCurBid(targetUid);

    if(readOnly){enterDemoMode();return;}

    ls.style.display="none";app.style.display="block";

    bldgsRef=db.ref("rent_app/"+targetUid+"/_buildings");
    bldgsL=bldgsRef.on("value",snap=>{
      bldgsData=snap.val()||{};
      const bids=sortedBids(bldgsData);
      if(bids.length&&!bldgsData[curBid]){curBid=bids[0];setCurBid(targetUid,curBid)}
    });

    txRef=db.ref(`rent_app/${targetUid}/${curBid}/transactions`);listenTx();
  }else{
    if(sessionStorage.getItem("guestDemo")==="1"){enterDemoMode();return;}
    cu=null;app.style.display="none";ls.style.display="flex";
    if(txL&&txRef)txRef.off("value",txL);
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
  }
});
function signInGoogle(){auth.signInWithPopup(gProv).catch(e=>showToast("❗ "+e.message))}
function doSignOut(){
  closeMenu();
  if(txL&&txRef)txRef.off("value",txL);
  if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
  auth.signOut();
}
function toggleMenu(){document.getElementById("user-menu").classList.toggle("show")}
function closeMenu(){document.getElementById("user-menu").classList.remove("show")}
document.addEventListener("click",e=>{if(!e.target.closest("#av-wrap")&&!e.target.closest("#user-menu"))closeMenu()});

function listenTx(){
  txL=txRef.on("value",snap=>{
    allTx=Object.values(snap.val()||{}).sort((a,b)=>b.date.localeCompare(a.date)||(b.id-a.id));
    if(viewMode==="yearly")buildYearSel();
    renderFeed();
  },()=>showToast("❗ 연결 오류"));
}
function setViewMode(mode){
  viewMode=mode;curPage=1;
  document.querySelectorAll(".view-tab").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.view-tab[data-mode="${mode}"]`).classList.add("active");
  const ms=document.getElementById("month-sel"),ys=document.getElementById("year-sel");
  if(mode==="monthly"){ms.style.display="";ys.style.display="none"}
  else if(mode==="yearly"){ms.style.display="none";ys.style.display="";buildYearSel()}
  else{ms.style.display="none";ys.style.display="none"}
  renderFeed();
}
function buildYearSel(){
  const years=[...new Set(allTx.map(t=>t.date&&t.date.slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  const cur=String(new Date().getFullYear());
  if(!years.includes(cur))years.unshift(cur);
  if(!filterYear||!years.includes(filterYear))filterYear=years[0]||cur;
  document.getElementById("filter-year").innerHTML=years.map(y=>`<option value="${y}"${y===filterYear?" selected":""}>${y}년</option>`).join("");
}
function onMonthChange(){filterMonth=document.getElementById("filter-month").value;curPage=1;renderFeed()}
function onYearChange(){filterYear=document.getElementById("filter-year").value;curPage=1;renderFeed()}
function getFiltered(){
  if(viewMode==="monthly")return filterMonth?allTx.filter(t=>t.date&&t.date.startsWith(filterMonth)):allTx;
  if(viewMode==="yearly")return filterYear?allTx.filter(t=>t.date&&t.date.startsWith(filterYear)):allTx;
  return allTx;
}
function getFilterLabel(){
  if(viewMode==="monthly")return(filterMonth||"전체").replace("-","");
  if(viewMode==="yearly")return(filterYear||"전체")+"년";
  return"전체기간";
}

function renderFeed(){
  const list=getFiltered();
  const inc=list.filter(t=>t.type==="income").reduce((a,t)=>a+(t.amount||0),0);
  const exc=list.filter(t=>t.type==="expense").reduce((a,t)=>a+(t.amount||0),0);
  const net=inc-exc;
  document.getElementById("s-in").textContent="₩"+fmtN(inc);
  document.getElementById("s-ex").textContent="₩"+fmtN(exc);
  const nEl=document.getElementById("s-net");
  nEl.textContent=(net>=0?"₩":"−₩")+fmtN(Math.abs(net));
  nEl.style.color=net>0?"var(--green)":net<0?"var(--red)":"var(--blue)";

  const total=list.length,tp=Math.max(1,Math.ceil(total/PS));
  if(curPage>tp)curPage=tp;
  const page=list.slice((curPage-1)*PS,curPage*PS);

  const fc=document.getElementById("feed");
  const emptyMsg=viewMode==="monthly"?"이 달에 기록된 내역이 없어요":viewMode==="yearly"?"이 해에 기록된 내역이 없어요":"기록된 내역이 없어요";
  if(!total){fc.innerHTML=`<div class="empty-st"><div class="ei">💰</div><div class="et">${emptyMsg}<br>+ 버튼으로 추가해 보세요</div></div>`;document.getElementById("pagi").innerHTML="";return}
  fc.innerHTML=`<div class="card">${page.map(t=>`
    <div class="tx-item">
      <div class="tx-icon ${t.type}">${t.type==="income"?"📈":"📉"}</div>
      <div class="tx-body">
        <div class="tx-top"><span class="tx-cat">${esc(t.category||"기타")}</span><span class="tx-date">${fmtD(t.date)}</span></div>
        <div class="tx-memo">${esc(t.memo)||"메모 없음"}</div>
      </div>
      <span class="tx-amt ${t.type}">${t.type==="income"?"+":"−"}₩${fmtN(t.amount)}</span>
      <button class="tx-del" onclick="delTx(${t.id})">✕</button>
    </div>`).join("")}</div>`;
  document.getElementById("pagi").innerHTML=`
    <button class="page-btn" onclick="goPage(${curPage-1})" ${curPage<=1?"disabled":""}>◀</button>
    <span class="page-info">${curPage} / ${tp}</span>
    <button class="page-btn" onclick="goPage(${curPage+1})" ${curPage>=tp?"disabled":""}>▶</button>`;
}
function goPage(p){curPage=p;renderFeed();window.scrollTo(0,0)}

function openAdd(){
  mTT="income";updateTTUI();
  const n=new Date();
  document.getElementById("m-date").value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
  document.getElementById("m-amt").value="";document.getElementById("m-memo").value="";
  updateCats();document.getElementById("add-sheet").classList.add("show");
}
function closeAdd(){document.getElementById("add-sheet").classList.remove("show")}
function setTT(t){mTT=t;updateTTUI();updateCats()}
function updateTTUI(){
  document.getElementById("tg-in").className="tg-btn"+(mTT==="income"?" on-green":"");
  document.getElementById("tg-ex").className="tg-btn"+(mTT==="expense"?" on-red":"");
}
function updateCats(){
  document.getElementById("m-cat").innerHTML=CATS[mTT].map(c=>`<option value="${c}">${c}</option>`).join("");
}
function saveTx(){
  if(!guardWrite())return;
  const amt=parseInt(document.getElementById("m-amt").value)||0;
  const date=document.getElementById("m-date").value;
  if(!amt||amt<=0){showToast("❗ 금액을 입력하세요");return}
  if(!date){showToast("❗ 날짜를 입력하세요");return}
  const id=Date.now();
  txRef.child(String(id)).set({id,type:mTT,amount:amt,category:document.getElementById("m-cat").value,date,memo:document.getElementById("m-memo").value.trim(),createdAt:new Date().toISOString()})
    .then(()=>{closeAdd();showToast("✅ 저장됨")})
    .catch(()=>showToast("❗ 저장 실패"));
}
function delTx(id){
  if(!guardWrite())return;
  document.getElementById("cm-ok").onclick=()=>{
    txRef.child(String(id)).remove().then(()=>showToast("🗑 삭제됨")).catch(()=>showToast("❗ 실패"));
    closeCM();
  };
  document.getElementById("confirm-modal").classList.add("show");
}
function closeCM(){document.getElementById("confirm-modal").classList.remove("show")}

function exportCSV(){
  const list=getFiltered();if(!list.length){showToast("데이터 없음");return}
  const hdr="날짜,유형,카테고리,금액,메모\n";
  const rows=list.map(t=>`${t.date},${t.type==="income"?"수입":"지출"},${t.category||""},${t.amount||0},"${(t.memo||"").replace(/"/g,"'")}"`)
  const blob=new Blob(["\uFEFF"+hdr+rows.join("\n")],{type:"text/csv"});
  dl(blob,"수지내역_"+getFilterLabel()+".csv");showToast("📥 CSV 완료");
}
function exportJSON(){
  const list=getFiltered();if(!list.length){showToast("데이터 없음");return}
  const blob=new Blob([JSON.stringify(list,null,2)],{type:"application/json"});
  dl(blob,"수지내역_"+getFilterLabel()+".json");showToast("📦 JSON 완료");
}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmtN(n){return(n||0).toLocaleString("ko-KR")}
function fmtD(d){if(!d)return"";const p=d.split("-");return viewMode==="all"?`${p[0].slice(2)}/${p[1]}/${p[2]}`:`${p[1]}/${p[2]}`}
let tTm;function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tTm);tTm=setTimeout(()=>t.classList.remove("show"),2800)}
</script>
</body>
