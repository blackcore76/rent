<style>
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:12px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.kpi-val{font-size:clamp(11px,3.5vw,16px);font-weight:900;line-height:1.2;word-break:break-all;margin-bottom:3px}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.3px}
.kpi.income .kpi-val{color:var(--green)}
.kpi.expense .kpi-val{color:var(--red)}
.kpi.net .kpi-val{color:var(--blue)}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=month]{border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;font-family:inherit;outline:none;color:var(--text)}
.toolbar input[type=month]:focus{border-color:var(--sky)}
.toolbar input[type=month]::-webkit-calendar-picker-indicator{width:22px;height:22px;cursor:pointer;opacity:.85}
body.em-on .toolbar input[type=month]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.9}
.spacer{flex:1}
.btn-exp{background:#fff;border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--sub)}
.bld-drop{position:fixed;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.18);border:1px solid var(--border);z-index:600;min-width:140px;overflow:hidden}
.bld-drop-item{display:block;width:100%;padding:11px 16px;border:none;background:transparent;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;color:var(--text);transition:background .12s}
.bld-drop-item:active{background:var(--bg)}
.bld-drop-item.active{color:var(--sky)}
.view-tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:10px;box-shadow:var(--shadow);gap:4px}
.view-tab{flex:1;padding:9px 8px;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--sub);background:transparent;transition:all .2s}
.view-tab.active{background:var(--hdr);color:#fff}
.filter-year{border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;font-family:inherit;outline:none;color:var(--text)}
.filter-year:focus{border-color:var(--sky)}
.fab{position:fixed;bottom:28px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--hdr);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:100;transition:transform .15s}
.fab:active{transform:scale(.92)}
.card{background:var(--card);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.tx-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-icon.income{background:var(--green-lt)}
.tx-icon.expense{background:var(--red-lt)}
.tx-body{flex:1;min-width:0}
.tx-top{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;margin-bottom:3px}
.tx-cat{font-size:12px;font-weight:700;color:var(--sub);word-break:keep-all}
.tx-date{font-size:11px;color:var(--hint);margin-left:auto;flex-shrink:0}
.tx-bottom{display:flex;align-items:center;gap:6px}
.tx-memo{font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tx-amt{font-size:14px;font-weight:900;white-space:nowrap;flex-shrink:0}
.tx-amt.income{color:var(--green)}.tx-amt.expense{color:var(--red)}
.tx-edit{width:28px;height:28px;border:none;background:#EFF6FF;color:#3B82F6;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-del{width:28px;height:28px;border:none;background:var(--red-lt);color:var(--red);border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-item.auto-rent{background:rgba(5,150,105,.04);border-left:3px solid var(--green)}
.tx-auto-badge{font-size:10px;font-weight:700;background:var(--green-lt);color:var(--green-t);padding:1px 6px;border-radius:4px;flex-shrink:0}
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;margin-bottom:80px}
.page-btn{padding:7px 14px;border-radius:8px;border:1px solid #2A3F55;background:#1E293B;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#94A3B8;transition:all .15s;min-width:38px;text-align:center}
.page-btn:disabled{opacity:.3;cursor:not-allowed}
.page-info{font-size:13px;color:#94A3B8;font-weight:600}
.empty-st{text-align:center;padding:48px 20px;color:var(--hint)}
.empty-st .ei{font-size:48px;margin-bottom:12px}
.empty-st .et{font-size:14px}
/* SHEET */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:520px;box-shadow:0 -4px 32px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-hd h3{font-size:17px;font-weight:900;color:var(--hdr)}
.sheet-close{width:32px;height:32px;border:none;background:#F3F4F6;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toggle-group{display:flex;border:2px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.tg-btn{flex:1;padding:11px 8px;border:none;background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);transition:all .15s}
.tg-btn.on-green{background:var(--green);color:#fff}
.tg-btn.on-red{background:var(--red);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{border:2px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;color:var(--text);background:#FAFCFF;width:100%;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky);background:#fff}
.field textarea{resize:none}
.sheet-actions{display:flex;gap:10px;margin-top:4px}
.btn-save{flex:1;padding:15px;background:var(--hdr);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.85}
.btn-close-sheet{padding:14px 28px;min-width:120px;background:#F1F5F9;color:var(--sub);border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-close-sheet:active{background:#E2E8F0}
/* PHOTO */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ph-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#F0F4F8}
.ph-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.ph-del{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upload-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border:2px dashed var(--border);border-radius:10px;background:#FAFCFF;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.upload-btn:hover{border-color:var(--sky);color:var(--sky)}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}
.photo-btn-row{display:flex;gap:8px}
.photo-btn-row .upload-btn{flex:1;width:auto;font-size:12px;padding:11px 6px;text-align:center}
.camera-btn{border-color:var(--sky);color:var(--sky)}
.prog-bar{height:22px;border-radius:11px;background:#E2E8F0;margin-top:10px;overflow:hidden;display:none;position:relative}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--blue,#3B82F6));transition:width .25s;width:0%}
.prog-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--hdr);letter-spacing:.3px}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:900;display:none;align-items:center;justify-content:center}
#pv.show{display:flex}
#pv img{max-width:95%;max-height:90vh;border-radius:8px;object-fit:contain}
#pv-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* CONFIRM */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:20px;padding:24px;max-width:340px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.confirm-box h3{font-size:15px;font-weight:700;color:var(--hdr);margin-bottom:10px}
.confirm-box p{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6}
.confirm-btns{display:flex;gap:10px;justify-content:flex-end}
.confirm-btns button{padding:9px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
/* CATEGORY CHIPS */
.cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cat-chip{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;border:2px solid var(--border);background:#fff;color:var(--sub);cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none}
.cat-chip.on{border-color:var(--hdr);background:var(--hdr);color:#fff}
.cat-chip.custom-chip{border-color:#CBD5E1;color:var(--text)}
.cat-chip.custom-chip.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.cat-chip.add-chip{border-style:dashed;color:var(--hint);font-size:16px;padding:4px 12px}
.cat-del{font-size:11px;margin-left:3px;opacity:.6;vertical-align:middle}
.cat-add-row{display:none;gap:6px;margin-top:8px}
.cat-add-inp{flex:1;border:2px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;color:var(--text);background:#FAFCFF}
.cat-add-inp:focus{border-color:var(--sky)}
.cat-add-btn{padding:9px 14px;border-radius:10px;background:var(--hdr);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
/* 수지분석 */
.pie-section{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.pie-hd{display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pie-hd-title{font-size:13px;font-weight:700;color:var(--hdr2);display:flex;align-items:center;gap:6px}
.pie-tog{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:12px;background:transparent;cursor:pointer;font-family:inherit;color:var(--hint)}
.pie-body{overflow:hidden;transition:max-height .35s ease;max-height:300px}
.pie-body.collapsed{max-height:0}
.suji-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.suji-lbl{font-size:12px;font-weight:700;color:var(--sub)}
.suji-bar-row{display:flex;align-items:center;gap:8px}
.suji-bar-wrap{flex:1;height:14px;background:#F1F5F9;border-radius:8px;overflow:hidden}
.suji-bar{height:100%;border-radius:8px;transition:width .5s ease}
.suji-in{background:var(--green)}
.suji-ex{background:var(--red)}
.suji-val{font-size:13px;font-weight:800;text-align:right;flex-shrink:0;white-space:nowrap}
.suji-net{text-align:center;font-size:13px;font-weight:700;padding:10px 0 4px;border-top:1px solid var(--border);margin-top:2px}
.suji-pct{font-size:11px;font-weight:600;color:var(--hint);margin-left:4px}
.suji-empty{text-align:center;padding:20px 10px;color:var(--hint);font-size:13px}
/* 이지모드 사이드 버튼 → easymode-side.js */
.won-sfx{font-size:.7em;font-weight:600;margin-left:1px;}
body.em-on .kpi{background:linear-gradient(135deg,#1E2D3D 0%,#2A3F55 100%);border:1px solid rgba(255,255,255,.06);box-shadow:none}
body.em-on .kpi-lbl{color:rgba(255,255,255,.4)}
body.em-on .pie-section{background:linear-gradient(135deg,#1E2D3D 0%,#2A3F55 100%);border:1px solid rgba(255,255,255,.06);box-shadow:none}
body.em-on .pie-hd-title{color:rgba(255,255,255,.9)}
body.em-on .pie-tog{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.4)}
body.em-on .suji-bar-wrap{background:rgba(255,255,255,.08)}
body.em-on .suji-lbl{color:rgba(255,255,255,.6)}
body.em-on .suji-net{border-top-color:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
body.em-on .suji-pct{color:rgba(255,255,255,.35)}
body.em-on .suji-empty{color:rgba(255,255,255,.3)}
body.em-on .view-tabs{background:linear-gradient(135deg,#1E2D3D 0%,#2A3F55 100%);border:1px solid rgba(255,255,255,.06);box-shadow:none}
body.em-on .view-tab{color:rgba(255,255,255,.5);background:transparent}
body.em-on .view-tab.active{background:var(--gold);color:#000}
body.em-on #filter-month,body.em-on #filter-year{background:#0e1422;border-color:#1e2d45;color:#c8d6e8}
body.em-on .btn-exp{background:#0e1422;border-color:#1e2d45;color:#7a91a8}
body.em-on .card{background:linear-gradient(135deg,#1E2D3D 0%,#2A3F55 100%);border:1px solid rgba(255,255,255,.06);box-shadow:none}
body.em-on .tx-item{border-bottom-color:rgba(255,255,255,.07)}
body.em-on .tx-icon.income{background:rgba(0,230,118,.12)}
body.em-on .tx-icon.expense{background:rgba(255,82,82,.12)}
body.em-on .tx-cat{color:rgba(255,255,255,.55)}
body.em-on .tx-date{color:rgba(255,255,255,.3)}
body.em-on .tx-memo{color:rgba(255,255,255,.85)}
body.em-on .tx-amt.income{color:#00e676}
body.em-on .tx-amt.expense{color:#ff5252}
body.em-on .tx-auto-badge{background:rgba(0,230,118,.12);color:#00e676}
body.em-on .tx-item.auto-rent{background:rgba(0,230,118,.04);border-left-color:#00e676}
body.em-on .tx-edit{background:rgba(59,130,246,.12);color:#60a5fa}
body.em-on .tx-del{background:rgba(255,82,82,.12);color:#ff5252}
body.em-on .page-btn{background:#0e1422;border-color:#1e2d45}
body.em-on .page-info{color:#7a91a8}
body.em-on .empty-st{color:rgba(255,255,255,.3)}
body.em-on .fab{background:#1e2d45;box-shadow:0 4px 20px rgba(0,0,0,.5)}
</style>
</head>

<div id="app" style="display:none">
  <div class="hdr">

      <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
        <a href="index.html" style="flex-shrink:0;display:flex;align-items:center;line-height:0">
          <img src="logo.png" alt="PlusHome" style="height:36px;width:auto;image-rendering:-webkit-optimize-contrast">
        </a>

<script>
const storage=firebase.storage();
let cu=null,txRef=null,txL=null,allTx=[],curPage=1,filterMonth="",filterYear="",viewMode="monthly",mTT="income",readOnly=false;
let curBid="main",bldgsData={},bldgsRef=null,bldgsL=null,mUid="",mName="";
let txPhotos=[];
let rentHistData={},unitsData={},rhRef=null,rhL=null,auRef=null,auL=null,_tUid="";
const PS=10;
const CATS={income:["월세","관리비","보증금수입","기타수입"],expense:["수리비","청소비","보험료","세금/공과금","인건비","관리비지출","기타지출"]};
let customCats={income:[],expense:[]},catRef=null,catL=null,selectedCat="";
let editMode=false,editId=null;

(function(){const n=new Date();document.getElementById("filter-month").value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;filterMonth=document.getElementById("filter-month").value;filterYear=String(n.getFullYear())})();

function _emKey(uid){return'em_mode_'+(uid||'guest');}
function applyEasyMode(){
  document.body.classList.add('em-on');
  document.querySelectorAll('.nav-tab').forEach(tab=>{
    const href=tab.getAttribute('href')||'';
    if(href.includes('units')||href.includes('admin'))tab.style.display='none';
  });
  const sBtn=document.getElementById('em-side-btn'),sTxt=document.getElementById('em-side-txt');
  if(sBtn)sBtn.classList.add('on');
  if(sTxt)sTxt.textContent='일반모드';
}
function toggleExpenseEasyMode(){
  const isEm=document.body.classList.toggle('em-on');
  document.querySelectorAll('.nav-tab').forEach(tab=>{
    const href=tab.getAttribute('href')||'';
    if(href.includes('units')||href.includes('admin'))tab.style.display=isEm?'none':'';
  });
  const sBtn=document.getElementById('em-side-btn'),sTxt=document.getElementById('em-side-txt');
  sBtn.classList.toggle('on',isEm);
  sTxt.textContent=isEm?'일반모드':'이지모드';
  try{localStorage.setItem(_emKey(cu?.uid||'guest'),isEm?'1':'0');}catch(e){}
}

async function enterDemoMode(){
  await ensureDemoLoaded();
  readOnly=true;sessionStorage.setItem("guestDemo","1");
  _autofillDemoRent(DEMO.units||{}, DEMO.rentHistory||{});
  bldgsData=DEMO.bldgsData;curBid="main";
  allTx=[...DEMO.transactions].sort((a,b)=>b.date.localeCompare(a.date)||(b.id-a.id));
  rentHistData=DEMO.rentHistory||{};unitsData=DEMO.units||{};
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="block";
  showDemoBanner();renderFeed();
  try{if(localStorage.getItem(_emKey('guest'))==='1')applyEasyMode();}catch(e){}
}

auth.onAuthStateChanged(async user=>{
  const ls=document.getElementById("login-screen"),app=document.getElementById("app");
  if(user){
    cu=user;
    if(user.uid!==MASTER_UID){const access=await checkUserAccess(user);if(access===false)return;if(access==="readonly")readOnly=true;}
    setTimeout(maybeShowAlerts,1200);
    const w=document.getElementById("av-wrap");
    w.innerHTML=user.photoURL?`<img class="av-img" src="${user.photoURL}">`:`<div class="av-txt">${(user.displayName||"U")[0]}</div>`;
    w.style.display="block";
    document.getElementById("um-name").textContent=user.displayName||"사용자";
    document.getElementById("um-email").textContent=user.email||"";
    if(user.uid===MASTER_UID)document.getElementById("admin-btn").style.display="block";
    if(txL&&txRef)txRef.off("value",txL);
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
    const params=new URLSearchParams(location.search);
    mUid=params.get("master_uid")||"";
    mName=params.get("master_name")||"";
    const targetUid=(user.uid===MASTER_UID&&mUid)?mUid:user.uid;
    if(user.uid===MASTER_UID&&mUid){
      if(!document.getElementById("master-view-banner")){
        const banner=document.createElement("div");
        banner.id="master-view-banner";
        banner.style.cssText="position:fixed;top:100px;left:0;right:0;z-index:150;background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(245,158,11,.05));border-bottom:1px solid rgba(245,158,11,.3);padding:8px 16px;display:flex;align-items:center;justify-content:space-between";
        banner.innerHTML=`<span style="font-size:12px;font-weight:700;color:#F59E0B">🔧 열람 중: ${esc(mName||mUid)}</span><button onclick="location.href='admin-master.html'" style="font-size:11px;font-weight:700;background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#F59E0B;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit">← 관리자</button>`;
        document.body.appendChild(banner);
        document.querySelector(".content").style.marginTop="136px";
        document.querySelectorAll(".nav-tab").forEach(a=>{
          const u=new URL(a.href,location.href);
          u.searchParams.set("master_uid",mUid);
          u.searchParams.set("master_name",mName||"");
          a.href=u.pathname+"?"+u.searchParams.toString();
        });
      }
    }

    // Migration (only for own account)
    if(user.uid===targetUid){
      try{await migrateToMultiBldg(user.uid)}catch(e){}
    }
    curBid=getCurBid(targetUid);

    if(readOnly){enterDemoMode();return;}

    ls.style.display="none";app.style.display="block";
    try{if(localStorage.getItem(_emKey(targetUid))==='1')applyEasyMode();}catch(e){}

    bldgsRef=db.ref(DBPath.bldList(targetUid));
    bldgsL=bldgsRef.on("value",snap=>{
      bldgsData=snap.val()||{};
      const bids=sortedBids(bldgsData);
      if(bids.length&&!bldgsData[curBid]){switchBld(bids[0]);}
      else{updateBldLabel();}
    });

    _tUid=targetUid;
    txRef=db.ref(DBPath.transactions(targetUid, curBid));listenTx();listenRentData();listenCustomCats();
  }else{
    if(sessionStorage.getItem("guestDemo")==="1"){enterDemoMode();return;}
    cu=null;app.style.display="none";ls.style.display="flex";
    if(txL&&txRef)txRef.off("value",txL);
    if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
    if(rhL&&rhRef)rhRef.off("value",rhL);
    if(auL&&auRef)auRef.off("value",auL);
    if(catL&&catRef)catRef.off("value",catL);
  }
});
function doSignOut(){
  closeMenu();
  if(txL&&txRef)txRef.off("value",txL);
  if(bldgsL&&bldgsRef)bldgsRef.off("value",bldgsL);
  if(rhL&&rhRef)rhRef.off("value",rhL);
  if(auL&&auRef)auRef.off("value",auL);
  if(catL&&catRef)catRef.off("value",catL);
  auth.signOut();
}

let _bldDrop=null;
function placeDropdown(drop,btn,align){
  const dh=drop.offsetHeight,dw=drop.offsetWidth;
  const r=btn.getBoundingClientRect();
  const vh=window.innerHeight,vw=window.innerWidth,gap=4,margin=8;
  const spaceBelow=vh-r.bottom-margin,spaceAbove=r.top-margin;
  let top;
  if(dh<=spaceBelow||spaceBelow>=spaceAbove)top=r.bottom+gap;
  else top=Math.max(margin,r.top-dh-gap);
  let left=(align==='right')?r.right-dw:r.left;
  if(left+dw>vw-margin)left=vw-dw-margin;
  if(left<margin)left=margin;
  drop.style.top=top+'px';
  drop.style.left=left+'px';
  drop.style.right='';
  const onScroll=()=>{try{drop.remove();}catch(e){}};
  window.addEventListener('scroll',onScroll,{passive:true,once:true});
  const origRemove=drop.remove.bind(drop);
  drop.remove=function(){window.removeEventListener('scroll',onScroll);origRemove();};
}
function openBldDrop(e){
  if(e)e.stopPropagation();
  if(_bldDrop){_bldDrop.remove();_bldDrop=null;return;}
  const bids=sortedBids(bldgsData);if(bids.length<=1)return;
  const btn=document.getElementById("bld-name-label");
  const drop=document.createElement("div");drop.className="bld-drop";
  bids.forEach(bid=>{
    const item=document.createElement("button");
    item.className="bld-drop-item"+(bid===curBid?" active":"");
    item.textContent=bldgsData[bid]?.name||bid;
    item.onclick=(ev)=>{ev.stopPropagation();_bldDrop.remove();_bldDrop=null;switchBld(bid);};
    drop.appendChild(item);
  });
  document.body.appendChild(drop);_bldDrop=drop;
  placeDropdown(drop,btn,'right');
}
document.addEventListener("click",()=>{if(_bldDrop){_bldDrop.remove();_bldDrop=null;}});
function switchBld(bid){
  if(bid===curBid)return;
  if(txL&&txRef)txRef.off("value",txL);
  curBid=bid;
  const targetUid=(cu?.uid===MASTER_UID&&mUid)?mUid:cu?.uid||"";
  _tUid=targetUid;
  setCurBid(targetUid,bid);
  allTx=[];rentHistData={};unitsData={};customCats={income:[],expense:[]};
  txRef=db.ref(DBPath.transactions(targetUid, bid));
  listenTx();listenRentData();listenCustomCats();updateBldLabel();
}
function listenTx(){
  txL=txRef.on("value",snap=>{
    allTx=Object.values(snap.val()||{}).sort((a,b)=>b.date.localeCompare(a.date)||(b.id-a.id));
    if(viewMode==="yearly")buildYearSel();
    renderFeed();
  },()=>showToast("❗ 연결 오류"));
}
function listenRentData(){
  if(!_tUid)return;
  if(rhL&&rhRef)rhRef.off("value",rhL);
  if(auL&&auRef)auRef.off("value",auL);
  rhRef=db.ref(DBPath.rentHistory(_tUid, curBid));
  rhL=rhRef.on("value",snap=>{rentHistData=snap.val()||{};renderFeed();});
  auRef=db.ref(DBPath.units(_tUid, curBid));
  auL=auRef.on("value",snap=>{unitsData=snap.val()||{};renderFeed();});
}
function getAutoRentItems(){
  if(viewMode==="monthly"){
    if(!filterMonth)return[];
    const items=[];
    const unitsLoaded=Object.keys(unitsData).length>0;
    Object.entries(rentHistData).forEach(([roomId,roomH])=>{
      if(unitsLoaded&&!unitsData[roomId])return;
      const rec=roomH[filterMonth];
      if(!rec||(!rec.paid&&!rec.partial))return;
      const amt=rec.amount||(unitsData[roomId]?.monthlyRent||0)*10000;
      if(!amt)return;
      items.push({type:"income",category:"월세수입",amount:amt,
        memo:`${roomId}호 ${rec.paid?"완납":"부분납부"}`,
        date:filterMonth+"-01",auto:true});
    });
    return items.sort((a,b)=>a.memo.localeCompare(b.memo,"ko",{numeric:true}));
  }
  const monthly={};
  const unitsLoaded=Object.keys(unitsData).length>0;
  Object.entries(rentHistData).forEach(([roomId,roomH])=>{
    if(unitsLoaded&&!unitsData[roomId])return;
    Object.entries(roomH).forEach(([ym,rec])=>{
      if(!rec||(!rec.paid&&!rec.partial))return;
      if(viewMode==="yearly"&&filterYear&&!ym.startsWith(filterYear))return;
      const amt=rec.amount||(unitsData[roomId]?.monthlyRent||0)*10000;
      if(!amt)return;
      monthly[ym]=(monthly[ym]||0)+amt;
    });
  });
  return Object.entries(monthly)
    .map(([ym,amt])=>({type:"income",category:"월세수입",amount:amt,
      memo:`${ym.slice(0,4)}년 ${Number(ym.slice(5,7))}월 월세수입 합계`,
      date:ym+"-01",auto:true}))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function setViewMode(mode){
  viewMode=mode;curPage=1;
  document.querySelectorAll(".view-tab").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.view-tab[data-mode="${mode}"]`).classList.add("active");
  const ms=document.getElementById("month-sel"),ys=document.getElementById("year-sel");
  if(mode==="monthly"){ms.style.display="";ys.style.display="none"}
  else if(mode==="yearly"){ms.style.display="none";ys.style.display="";buildYearSel()}
  else{ms.style.display="none";ys.style.display="none"}
  renderFeed();
}
function buildYearSel(){
  const years=[...new Set(allTx.map(t=>t.date&&t.date.slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  const cur=String(new Date().getFullYear());
  if(!years.includes(cur))years.unshift(cur);
  if(!filterYear||!years.includes(filterYear))filterYear=years[0]||cur;
  document.getElementById("filter-year").innerHTML=years.map(y=>`<option value="${y}"${y===filterYear?" selected":""}>${y}년</option>`).join("");
}
function onMonthChange(){filterMonth=document.getElementById("filter-month").value;curPage=1;renderFeed()}
function onYearChange(){filterYear=document.getElementById("filter-year").value;curPage=1;renderFeed()}
function getFiltered(){
  if(viewMode==="monthly")return filterMonth?allTx.filter(t=>t.date&&t.date.startsWith(filterMonth)):allTx;
  if(viewMode==="yearly")return filterYear?allTx.filter(t=>t.date&&t.date.startsWith(filterYear)):allTx;
  return allTx;
}
function getFilterLabel(){
  if(viewMode==="monthly")return(filterMonth||"전체").replace("-","");
  if(viewMode==="yearly")return(filterYear||"전체")+"년";
  return"전체기간";
}

function updateBldLabel(){
  const lbl=document.getElementById("bld-name-label");if(!lbl)return;
  const name=bldgsData[curBid]?.name||"";
  const multi=sortedBids(bldgsData).length>1;
  lbl.textContent=multi?name+" ▾":name;
  lbl.style.cursor=multi?"pointer":"default";
  lbl.onclick=multi?openBldDrop:null;
}
function renderFeed(){
  updateBldLabel();
  const manual=getFiltered();
  const auto=getAutoRentItems();
  const list=[...auto,...manual].sort((a,b)=>{
    const dc=b.date.localeCompare(a.date);
    if(dc!==0)return dc;
    if(a.auto&&!b.auto)return -1;
    if(!a.auto&&b.auto)return 1;
    return(b.id||0)-(a.id||0);
  });
  const inc=list.filter(t=>t.type==="income").reduce((a,t)=>a+(t.amount||0),0);
  const exc=list.filter(t=>t.type==="expense").reduce((a,t)=>a+(t.amount||0),0);
  const net=inc-exc;
  document.getElementById("s-in").innerHTML=fmtN(inc)+'<span class="won-sfx">원</span>';
  document.getElementById("s-ex").innerHTML=fmtN(exc)+'<span class="won-sfx">원</span>';
  const nEl=document.getElementById("s-net");
  nEl.innerHTML=(net>=0?"":"−")+fmtN(Math.abs(net))+'<span class="won-sfx">원</span>';
  nEl.style.color=net>0?"var(--green)":net<0?"var(--red)":"var(--blue)";
  renderPie(list);

  const total=list.length,tp=Math.max(1,Math.ceil(total/PS));
  if(curPage>tp)curPage=tp;
  const page=list.slice((curPage-1)*PS,curPage*PS);

  const fc=document.getElementById("feed");
  const emptyMsg=viewMode==="monthly"?"이 달에 기록된 내역이 없어요":viewMode==="yearly"?"이 해에 기록된 내역이 없어요":"기록된 내역이 없어요";
  if(!total){fc.innerHTML=`<div class="empty-st"><div class="ei">💰</div><div class="et">${emptyMsg}<br>+ 버튼으로 추가해 보세요</div></div>`;document.getElementById("pagi").innerHTML="";return}
  fc.innerHTML=`<div class="card">${page.map(t=>{
    const isAggregate=t.auto&&viewMode!=="monthly";
    const click=isAggregate?`onclick="openAutoDetail('${t.date.slice(0,7)}')" style="cursor:pointer"`:"";
    const chevron=isAggregate?'<span style="font-size:14px;color:var(--hint)">›</span>':"";
    const editBtns=t.auto?"":`<button class="tx-edit" onclick="editTx(${t.id})">✏️</button><button class="tx-del" onclick="delTx(${t.id})">✕</button>`;
    return`<div class="tx-item${t.auto?" auto-rent":""}" ${click}>
      <div class="tx-icon ${t.type}">${t.auto?"🏠":t.type==="income"?"📈":"📉"}</div>
      <div class="tx-body">
        <div class="tx-top"><span class="tx-cat">${esc(t.category||"기타")}</span>${t.auto?'<span class="tx-auto-badge">자동</span>':""}<span class="tx-date">${fmtD(t.date)}</span></div>
        <div class="tx-bottom"><span class="tx-memo">${esc(t.memo)||"메모 없음"}${t.photos&&Object.keys(t.photos).length?' <span style="opacity:.5">📷</span>':""}</span><span class="tx-amt ${t.type}">${t.type==="income"?"+":"−"}${fmtN(t.amount)}<span class="won-sfx">원</span></span>${chevron}${editBtns}</div>
      </div>
    </div>`;}).join("")}</div>`;
  document.getElementById("pagi").innerHTML=`

function openAutoDetail(ym){
  const rooms=[];
  const unitsLoaded=Object.keys(unitsData).length>0;
  Object.entries(rentHistData).forEach(([roomId,roomH])=>{
    if(unitsLoaded&&!unitsData[roomId])return;
    const rec=roomH[ym];
    if(!rec||(!rec.paid&&!rec.partial))return;
    const amt=rec.amount||(unitsData[roomId]?.monthlyRent||0)*10000;
    if(!amt)return;
    rooms.push({roomId,amount:amt,paid:!!rec.paid});
  });
  rooms.sort((a,b)=>a.roomId.localeCompare(b.roomId,"ko",{numeric:true}));
  const total=rooms.reduce((s,r)=>s+r.amount,0);
  document.getElementById("auto-detail-title").textContent=
    `${ym.slice(0,4)}년 ${Number(ym.slice(5,7))}월 월세수입 상세`;
  const itemsHtml=rooms.map(r=>`
    <div class="tx-item">
      <div class="tx-icon income">🏠</div>
      <div class="tx-body">
        <div class="tx-top"><span class="tx-cat">${r.roomId}호</span><span class="tx-auto-badge">${r.paid?"완납":"부분납부"}</span></div>
      </div>
      <span class="tx-amt income">+${fmtN(r.amount)}<span class="won-sfx">원</span></span>
    </div>`).join("");
  const totalHtml=`
    <div class="tx-item" style="border-top:2px solid var(--border);background:#F8FAFC">
      <div class="tx-body">
        <div class="tx-top"><span class="tx-cat" style="font-weight:800">합계 (${rooms.length}호실)</span></div>
      </div>
      <span class="tx-amt income" style="font-size:17px">+${fmtN(total)}<span class="won-sfx">원</span></span>
    </div>`;
  document.getElementById("auto-detail-list").innerHTML=`<div class="card">${itemsHtml}${totalHtml}</div>`;
  document.getElementById("auto-detail-sheet").classList.add("show");
}
function closeAutoDetail(){document.getElementById("auto-detail-sheet").classList.remove("show")}

function listenCustomCats(){
  if(!_tUid||!curBid)return;
  if(catL&&catRef)catRef.off("value",catL);
  catRef=db.ref(`${DBPath.bldData(_tUid,curBid)}/config/categories`);
  catL=catRef.on("value",snap=>{
    const v=snap.val()||{};
    customCats={income:Array.isArray(v.income)?v.income:[],expense:Array.isArray(v.expense)?v.expense:[]};
    renderCatChips();
  });
}
function renderCatChips(){
  const chips=document.getElementById("cat-chips");if(!chips)return;
  chips.innerHTML="";
  const built=CATS[mTT];
  const cust=customCats[mTT]||[];
  built.forEach(c=>{
    const el=document.createElement("span");
    el.className="cat-chip"+(selectedCat===c?" on":"");
    el.textContent=c;el.onclick=()=>selectCat(c);
    chips.appendChild(el);
  });
  cust.forEach((c,i)=>{
    const el=document.createElement("span");
    el.className="cat-chip custom-chip"+(selectedCat===c?" on":"");
    el.textContent=c;el.onclick=()=>selectCat(c);
    const del=document.createElement("span");
    del.className="cat-del";del.textContent="✕";
    del.onclick=ev=>{ev.stopPropagation();delCustomCat(i)};
    el.appendChild(del);chips.appendChild(el);
  });
  const add=document.createElement("span");
  add.className="cat-chip add-chip";add.textContent="＋";add.onclick=toggleAddCat;
  chips.appendChild(add);
  document.getElementById("m-cat").value=selectedCat;
}
function selectCat(c){
  selectedCat=c;
  document.getElementById("m-cat").value=c;
  renderCatChips();
}
function toggleAddCat(){
  const row=document.getElementById("cat-add-row");
  const show=row.style.display!=="flex";
  row.style.display=show?"flex":"none";
  if(show)setTimeout(()=>document.getElementById("new-cat-inp").focus(),50);
}
function addCustomCat(){
  if(!guardWrite())return;
  const inp=document.getElementById("new-cat-inp");
  const name=inp.value.trim();
  if(!name){showToast("❗ 카테고리명을 입력하세요");return}
  const all=[...CATS[mTT],...(customCats[mTT]||[])];
  if(all.some(c=>c===name)){showToast("❗ 이미 있는 카테고리입니다");return}
  const updated=[...(customCats[mTT]||[]),name];
  catRef.child(mTT).set(updated)
    .then(()=>{inp.value="";document.getElementById("cat-add-row").style.display="none";selectCat(name);showToast("✅ 카테고리 추가됨")})
    .catch(()=>showToast("❗ 저장 실패"));
}
function delCustomCat(i){
  if(!guardWrite())return;
  const updated=[...(customCats[mTT]||[])];
  const removed=updated.splice(i,1)[0];
  catRef.child(mTT).set(updated.length?updated:null)
    .then(()=>{if(selectedCat===removed){selectedCat=CATS[mTT][0]||"";document.getElementById("m-cat").value=selectedCat;}showToast("🗑 삭제됨")})
    .catch(()=>showToast("❗ 실패"));
}
function editTx(id){
  if(!guardWrite())return;
  const t=allTx.find(x=>x.id===id);if(!t)return;
  editMode=true;editId=id;
  mTT=t.type;updateTTUI();
  document.querySelector("#add-sheet .sheet-hd h3").textContent="✏️ 내역 수정";
  document.getElementById("m-date").value=t.date||"";
  document.getElementById("m-amt").value=t.amount||"";
  document.getElementById("m-memo").value=t.memo||"";

  if(document.getElementById("new-cat-inp"))document.getElementById("new-cat-inp").value="";
  selectedCat=t.category||CATS[mTT][0]||"";
  renderCatChips();
  txPhotos=(t.photos?Object.values(t.photos):[]).sort((a,b)=>a.id-b.id);

function setTT(t){mTT=t;updateTTUI();updateCats()}
function updateTTUI(){
  document.getElementById("tg-in").className="tg-btn"+(mTT==="income"?" on-green":"");
  document.getElementById("tg-ex").className="tg-btn"+(mTT==="expense"?" on-red":"");
}
function updateCats(){

  renderCatChips();
}
function saveTx(){
  if(!guardWrite())return;
  const amt=parseInt(document.getElementById("m-amt").value)||0;
  const date=document.getElementById("m-date").value;
  if(!amt||amt<=0){showToast("❗ 금액을 입력하세요");return}
  if(!date){showToast("❗ 날짜를 입력하세요");return}
  const cat=document.getElementById("m-cat").value||selectedCat;
  const memo=document.getElementById("m-memo").value.trim();
  const photosObj={};
  txPhotos.forEach(p=>{photosObj[p.id]=p;});
  if(editMode&&editId){
    const original=allTx.find(x=>x.id===editId)||{};
    txRef.child(String(editId)).set({...original,type:mTT,amount:amt,category:cat,date,memo,photos:Object.keys(photosObj).length?photosObj:null})
      .then(()=>{closeAdd();showToast("✅ 수정됨")})
      .catch(()=>showToast("❗ 수정 실패"));
  }else{
    const id=Date.now();
    txRef.child(String(id)).set({id,type:mTT,amount:amt,category:cat,date,memo,photos:Object.keys(photosObj).length?photosObj:null,createdAt:new Date().toISOString()})
      .then(()=>{closeAdd();showToast("✅ 저장됨")})
      .catch(()=>showToast("❗ 저장 실패"));
  }
}
function delTx(id){
  if(!guardWrite())return;
  const t=allTx.find(x=>x.id===id);
  showCM("내역 삭제","이 내역을 삭제하시겠습니까?",async()=>{
    if(t&&t.photos){Object.values(t.photos).forEach(p=>{if(p.storagePath)storage.ref(p.storagePath).delete().catch(()=>{});});}
    txRef.child(String(id)).remove().then(()=>showToast("🗑 삭제됨")).catch(()=>showToast("❗ 실패"));
  });
}

async function onTxPhotos(e){
  if(!guardWrite()){e.target.value="";return;}
  const files=Array.from(e.target.files);if(!files.length||!cu)return;
  const btn=document.getElementById("tx-upload-btn"),camBtn=document.getElementById("tx-camera-btn"),bar=document.getElementById("tx-prog-bar"),fill=document.getElementById("tx-prog-fill"),pct=document.getElementById("tx-prog-pct"),saveBtn=document.querySelector(".btn-save");
  btn.disabled=true;camBtn.disabled=true;if(saveBtn)saveBtn.disabled=true;bar.style.display="block";
  const targetUid=(cu.uid===MASTER_UID&&mUid)?mUid:cu.uid;
  for(let i=0;i<files.length;i++){
    const file=files[i];
    if(!file.type.startsWith("image/")){showToast("❗ 이미지만 가능");continue}
    if(file.size>50*1024*1024){showToast("❗ 50MB 이하만 가능");continue}
    const ts=Date.now(),path=`rent_app/${cu.uid}/expense/${curBid}/${ts}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
    const label=files.length>1?`(${i+1}/${files.length}) `:"";
    try{
      pct.textContent=`${label}압축 중...`;
      const blob=await compressImage(file);
      pct.textContent=`${label}파일 로딩 중...`;
      let uploadBlob=blob;
      try{const ab=await blob.arrayBuffer();uploadBlob=new Blob([ab],{type:blob.type||"image/jpeg"});}catch(e){}
      const ref=storage.ref(path);
      let url=null;const MAX_TRIES=3;
      for(let attempt=0;attempt<MAX_TRIES;attempt++){
        try{
          if(attempt>0){pct.textContent=`${label}재연결 중... (${attempt}/${MAX_TRIES-1})`;fill.style.width="0%";await new Promise(r=>setTimeout(r,2000));await auth.currentUser?.getIdToken(true).catch(()=>{});}
          pct.textContent=`${label}서버 연결 중...`;
          const task=ref.put(uploadBlob,{contentType:uploadBlob.type||"image/jpeg"});
          let tmo=null,firstByte=false;
          const resetTmo=()=>{clearTimeout(tmo);tmo=setTimeout(()=>task.cancel(),firstByte?25000:10000);};
          resetTmo();
          await new Promise((res,rej)=>task.on("state_changed",
            s=>{if(s.bytesTransferred>0)firstByte=true;resetTmo();const p=Math.round(s.bytesTransferred/s.totalBytes*100)||0;fill.style.width=`${p}%`;pct.textContent=`${label}업로드 중... ${p}%`;},
            e=>{clearTimeout(tmo);rej(e);},
            ()=>{clearTimeout(tmo);res();}
          ));
          url=await ref.getDownloadURL();break;
        }catch(e){
          if(attempt===MAX_TRIES-1)throw e;
          pct.textContent=e.code==="storage/canceled"?`${label}⏱ 응답 없음 — 재시도 중...`:`${label}❗ 실패 — 재시도 중...`;
        }
      }
      fill.style.width="100%";pct.textContent=`${label}완료!`;
      const pid=String(ts+(i*10));
      txPhotos.push({id:pid,url,storagePath:path});
      renderTxPhotos();showToast("✅ 업로드 완료");
    }catch(err){
      showToast("❗ "+(err.code==="storage/canceled"?"네트워크 오류 — 잠시 후 다시 시도하세요":"업로드 실패: "+err.message));
    }
  }
  btn.disabled=false;camBtn.disabled=false;if(saveBtn)saveBtn.disabled=false;bar.style.display="none";fill.style.width="0%";pct.textContent="";e.target.value="";
}
function delTxPhoto(pid,spath){
  if(!guardWrite())return;
  showCM("사진 삭제","이 사진을 삭제하시겠습니까?",async()=>{
    try{
      if(spath)await storage.ref(spath).delete().catch(()=>{});
      txPhotos=txPhotos.filter(p=>p.id!==pid);
      renderTxPhotos();showToast("🗑 삭제됨");
    }catch(e){showToast("❗ 삭제 실패");}
  });
}

let _pieCollapsed=false;

function renderPie(list){
  const el=document.getElementById('pie-content');if(!el)return;
  const inc=list.filter(t=>t.type==='income').reduce((s,t)=>s+(t.amount||0),0);
  const exc=list.filter(t=>t.type==='expense').reduce((s,t)=>s+(t.amount||0),0);
  if(!inc&&!exc){el.innerHTML=`<div class="suji-empty">이 기간에 기록된 내역이 없습니다</div>`;return;}
  const net=inc-exc;
  const max=Math.max(inc,exc,1);
  const incW=Math.round(inc/max*100),excW=Math.round(exc/max*100);
  const netClr=net>0?'var(--green)':net<0?'var(--red)':'var(--sub)';
  const pctStr=inc>0?`<span class="suji-pct">(수입 대비 ${Math.round(Math.abs(net)/inc*100)}%)</span>`:'';
  el.innerHTML=`
    <div class="suji-row">
      <span class="suji-lbl">📈 수입</span>
      <div class="suji-bar-row"><div class="suji-bar-wrap"><div class="suji-bar suji-in" style="width:${incW}%"></div></div><span class="suji-val" style="color:var(--green)">${fmtN(inc)}<span class="won-sfx">원</span></span></div>
    </div>
    <div class="suji-row">
      <span class="suji-lbl">📉 지출</span>
      <div class="suji-bar-row"><div class="suji-bar-wrap"><div class="suji-bar suji-ex" style="width:${excW}%"></div></div><span class="suji-val" style="color:var(--red)">${fmtN(exc)}<span class="won-sfx">원</span></span></div>
    </div>
    <div class="suji-net" style="color:${netClr}">순수익 ${net>=0?'':'−'}${fmtN(Math.abs(net))}<span class="won-sfx">원</span>${pctStr}</div>`;
}
function togglePie(){
  _pieCollapsed=!_pieCollapsed;
  document.getElementById('pie-body').classList.toggle('collapsed',_pieCollapsed);
  document.getElementById('pie-tog-lbl').textContent=_pieCollapsed?'펼치기 ▼':'접기 ▲';
}
